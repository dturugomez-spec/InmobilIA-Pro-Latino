# Demo local: la app sin Supabase, con la inmobiliaria de ejemplo. Ver com.inmobilia.demo.DemoLocalConfig
# Se activa con --spring.profiles.active=demo-local (nunca en Railway)
inmobilia.demo-local=true
server.port=${PORT:8091}
# Solo este ordenador: nadie más de la red puede abrirla
server.address=127.0.0.1
# La "Supabase" es la memoria de la propia app (FakeSupabase responde a este host)
supabase.url=http://localhost:${server.port}
supabase.key=demo-local
app.base-url=http://localhost:${server.port}
# Plantillas compiladas una vez; menos hilos para tareas programadas en un portátil
spring.thymeleaf.cache=true
spring.task.scheduling.pool.size=2
