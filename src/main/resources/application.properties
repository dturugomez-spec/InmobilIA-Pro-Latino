# InmobilIA Pro - configuracion
spring.application.name=InmobilIA Pro
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
server.http2.enabled=true

# ─── Arranque eager (con RAM holgada): todos los beans listos, sin lag inicial ───
# (configurable: pon LAZY_INIT=true si algún día vuelves a poca RAM)
spring.main.lazy-initialization=${LAZY_INIT:false}

# ─── Tomcat dimensionado para tráfico real (con RAM holgada) ───
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:150}
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=8000
server.tomcat.connection-timeout=20s

# Thymeleaf (cache ON en producción = compila plantillas 1 vez, no en cada request)
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
# Generar la página entera antes de enviarla: si una plantilla falla a mitad, se muestra la
# página de error en vez de dejar al navegador esperando una página a medias.
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# Sesion
server.servlet.session.timeout=4h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Cache (Caffeine) para reducir llamadas Supabase
spring.cache.type=caffeine
spring.cache.cache-names=sbQuery,euribor,euriborHistory,catastro,geocode,ine,aiCredits,newsMarket,newsRegulatory,subastasBoe,tedr,bdeRates,euriborMonthly,inmuebleStats,boeMatches
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Supabase (configurar en Render Environment Variables)
# Acepta ambos nombres: SUPABASE_SERVICE_KEY (recomendado) o SUPABASE_KEY (legacy)
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_SERVICE_KEY:${SUPABASE_KEY:}}
supabase.schema=public

# OpenAI: acepta OPENAI_API_KEY_PLATFORM o, como alternativa, el nombre natural OPENAI_API_KEY
openai.platform-key=${OPENAI_API_KEY_PLATFORM:${OPENAI_API_KEY:}}

# Base URL pública (para emails de recuperación, etc.)
app.base-url=${APP_BASE_URL:https://www.inmobiliapro.es}

# Stripe (configurar en Railway → Variables)
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
# Price IDs creados en el dashboard de Stripe (Productos)
stripe.price.pro=${STRIPE_PRICE_PRO:}
stripe.price.agency=${STRIPE_PRICE_AGENCY:}
# Packs de créditos de IA (precios de PAGO ÚNICO): 100, 500 y 2.000 créditos. Sin ellos no se ofrecen.
stripe.price.credits-s=${STRIPE_PRICE_CREDITS_S:}
stripe.price.credits-m=${STRIPE_PRICE_CREDITS_M:}
stripe.price.credits-l=${STRIPE_PRICE_CREDITS_L:}
openai.model=gpt-4o
openai.max-tokens=2500
openai.temperature=0.7

# Creditos IA por defecto al registrarse
ai.credits.default=${AI_CREDITS_DEFAULT:50}
ai.credits.cost=1

# SMTP - cada cliente configura el suyo desde Configuracion > Email
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
# Acepta SMTP_PASS (recomendado) o SMTP_PASSWORD (legacy)
spring.mail.password=${SMTP_PASS:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST:}

# Logging (producción: WARN global, INFO para nuestro código → ve los >>> logs)
logging.level.root=${LOG_ROOT:WARN}
logging.level.com.inmobilia=${LOG_APP:INFO}
logging.level.org.springframework.web=WARN

# Multipart (uploads documentos/pdf)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Static resources: cache en navegador 7 días (CSS/JS/imágenes no cambian)
spring.web.resources.cache.cachecontrol.max-age=604800
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.cache=true
spring.web.resources.chain.compressed=true
