# ════════════════════════════════════════════════════════════════
#  InmobilIA Pro · Perfil PROD (Render / Railway / Fly.io)
#  Activado con SPRING_PROFILES_ACTIVE=prod
# ════════════════════════════════════════════════════════════════

# Thymeleaf en cache (mucho mas rapido)
spring.thymeleaf.cache=true

# Cache mas agresivo en prod (10 min para news/RSS, 5 min resto)
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=600s

# Static resources con cache fuerte (1 ano para iconos/css versionados, 1h HTML)
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.no-cache=false
spring.web.resources.cache.cachecontrol.no-store=false
spring.web.resources.chain.cache=true
spring.web.resources.chain.compressed=true

# Sesion segura tras HTTPS (Render/Railway/Fly.io ya hacen TLS)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Trust proxy (X-Forwarded-* de Render)
server.forward-headers-strategy=native

# Compresion HTTP (mas ahorrar banda)
server.compression.enabled=true
server.compression.min-response-size=1KB

# Logging menos verboso en prod
logging.level.root=WARN
logging.level.com.inmobilia=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN

# JVM friendly: pequenos heap dumps en error
spring.main.banner-mode=off
spring.output.ansi.enabled=NEVER

# Headers de seguridad (extra)
server.servlet.session.tracking-modes=cookie
