<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Búsquedas guardadas</title></head>
<body><div layout:fragment="content">
<div class="rounded-xl bg-gradient-to-br from-indigo-700 to-purple-900 p-6 mb-5 text-white">
    <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="bell-ring" class="h-6 w-6"></i> Búsqueda inversa con alertas</h2>
    <p class="text-sm text-white/80 mt-1">Configura criterios por cliente. Cuando llegue una propiedad que encaje, se le avisa solo.</p>
</div>
<div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
    <form method="post" action="/busquedas-guardadas/crear" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 space-y-2">
        <h3 class="font-semibold text-sm">+ Nueva búsqueda</h3>
        <input type="text" name="cliente_nombre" required placeholder="Cliente" class="w-full px-3 py-2 text-sm border rounded">
        <input type="email" name="cliente_email" required placeholder="Email" class="w-full px-3 py-2 text-sm border rounded">
        <input type="text" name="nombre_busqueda" placeholder="Nombre búsqueda" class="w-full px-3 py-2 text-sm border rounded">
        <select name="operacion" class="w-full px-3 py-2 text-sm border rounded">
            <option value="">— Operación —</option><option value="venta">Venta</option><option value="alquiler">Alquiler</option>
        </select>
        <select name="tipo" class="w-full px-3 py-2 text-sm border rounded">
            <option value="">— Tipo —</option><option value="piso">Piso</option><option value="casa">Casa</option><option value="atico">Ático</option>
        </select>
        <input type="text" name="municipio" placeholder="Municipio" class="w-full px-3 py-2 text-sm border rounded">
        <div class="grid grid-cols-2 gap-2">
            <input type="number" name="precio_min" placeholder="Precio mín" class="px-3 py-2 text-sm border rounded">
            <input type="number" name="precio_max" placeholder="Precio máx" class="px-3 py-2 text-sm border rounded">
        </div>
        <div class="grid grid-cols-2 gap-2">
            <input type="number" name="metros_min" placeholder="m² mín" class="px-3 py-2 text-sm border rounded">
            <input type="number" name="habitaciones_min" placeholder="Hab mín" class="px-3 py-2 text-sm border rounded">
        </div>
        <label class="flex items-center gap-2 text-xs"><input type="checkbox" name="requiere_garaje">  Requiere garaje</label>
        <label class="flex items-center gap-2 text-xs"><input type="checkbox" name="requiere_ascensor">  Requiere ascensor</label>
        <label class="flex items-center gap-2 text-xs"><input type="checkbox" name="requiere_terraza">  Requiere terraza</label>
        <button class="w-full px-4 py-2 rounded bg-indigo-700 text-white text-sm"> Guardar alerta</button>
    </form>

    <div class="lg:col-span-2 space-y-3">
        <div th:each="b : ${busquedas}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-4">
            <div class="flex items-start justify-between mb-2">
                <div>
                    <p class="font-bold text-sm" th:text="${b.get('cliente_nombre')}">—</p>
                    <p class="text-xs text-slate-500" th:text="${b.get('cliente_email')}">—</p>
                </div>
                <button th:data-id="${b.get('id')}" onclick="toggle(this.dataset.id)" class="text-xs px-2 py-1 rounded"
                        th:classappend="${b.get('activa') == true ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}"
                        th:text="${b.get('activa') == true ? 'Activa' : 'Pausada'}">—</button>
            </div>
            <div class="flex flex-wrap gap-2 text-[10px]">
                <span th:if="${b.get('operacion')}" class="px-2 py-0.5 rounded-full bg-blue-50 text-blue-700" th:text="${b.get('operacion')}">—</span>
                <span th:if="${b.get('tipo')}" class="px-2 py-0.5 rounded-full bg-purple-50 text-purple-700" th:text="${b.get('tipo')}">—</span>
                <span th:if="${b.get('municipio')}" class="px-2 py-0.5 rounded-full bg-amber-50 text-amber-700" th:text="${b.get('municipio')}">—</span>
                <span th:if="${b.get('precio_max')}" class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700" th:text="'hasta ' + ${b.get('precio_max')} + ${mon}">—</span>
            </div>
            <p class="text-[10px] text-slate-400 mt-2"><span th:text="${b.get('matches_count') ?: 0}">0</span> matches enviados</p>
        </div>
        <div th:if="${busquedas.isEmpty()}" class="rounded-xl bg-white py-12 text-center text-slate-500 text-sm">Sin búsquedas guardadas</div>
    </div>
</div>
<script>
async function toggle(id) {
    await fetch('/busquedas-guardadas/' + id + '/toggle', {method:'POST'});
    location.reload();
}
</script>
</div></body></html>
