<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Informe captador</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-xl bg-gradient-to-br from-purple-700 via-brand-800 to-brand-950 p-6 mb-5 ring-1 ring-brand-800 text-white">
        <h2 class="text-xl font-bold"> Informe profesional para captador</h2>
        <p class="text-sm text-white/70 mt-1">Genera un PDF para entregar al propietario en visita de captación. Incluye análisis de zona, comparativa, estimación y propuesta de marketing.</p>
    </div>

    <form action="/herramientas/informe-captador" method="post" class="max-w-2xl mx-auto bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 rounded-xl p-6 space-y-4">

        <h3 class="font-semibold text-base">Datos del inmueble</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
                <label class="block text-sm font-medium mb-1.5">Propietario</label>
                <input type="text" name="propietario" placeholder="Nombre del dueño" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1.5">Dirección</label>
                <input type="text" name="address" required placeholder="Av. Reforma 123" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1.5">Ciudad *</label>
                <input type="text" name="city" required th:placeholder="${ciudadEjemplo}" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1.5">Tipo</label>
                <select name="type" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                    <option>Residencial</option><option>Comercial</option><option>Oficina</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1.5">Superficie (m²) *</label>
                <input type="number" name="m2" required step="0.01" class="w-full px-3 py-2 text-sm font-mono border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1.5">Habitaciones</label>
                <input type="number" name="bedrooms" class="w-full px-3 py-2 text-sm font-mono border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1.5">Baños</label>
                <input type="number" name="bathrooms" class="w-full px-3 py-2 text-sm font-mono border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1.5">Año construcción</label>
                <input type="number" name="year" class="w-full px-3 py-2 text-sm font-mono border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium mb-1.5">Precio que pretende el propietario ([[${mon}]])</label>
                <input type="number" name="precioPretendido" step="1000" class="w-full px-3 py-2 text-sm font-mono border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                <p class="text-xs text-slate-500 mt-1">Lo compararemos con la estimación objetiva del mercado.</p>
            </div>
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t border-slate-200 dark:border-neutral-800">
            <a href="/dashboard" class="px-4 py-2 rounded-lg bg-white ring-1 ring-slate-200 hover:bg-slate-50 text-sm">Cancelar</a>
            <button type="submit" class="inline-flex items-center gap-1.5 px-5 py-2 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-sm font-semibold shadow-card">
                <i data-lucide="file-text" class="h-4 w-4"></i>
                Generar informe
            </button>
        </div>
    </form>

</div>
</body>
</html>
