<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Rechazar solicitud</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl p-8">
        <h1 class="text-2xl font-bold mb-2"> Rechazar solicitud</h1>
        <p class="text-slate-500 text-sm mb-6">El cliente recibirá un email educado con el motivo que escribas.</p>

        <div class="bg-slate-50 rounded-lg p-4 mb-6 text-sm">
            <p><strong>Cliente:</strong> <span th:text="${solicitud.get('nombre')}">—</span></p>
            <p><strong>Empresa:</strong> <span th:text="${solicitud.get('empresa')}">—</span></p>
            <p><strong>Email:</strong> <span th:text="${solicitud.get('email')}">—</span></p>
        </div>

        <form th:action="@{|/email-action/rechazar/${token}|}" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-2">Motivo del rechazo <span class="text-red-500">*</span></label>
                <textarea name="motivo" required rows="4" placeholder="Ej: No estamos aceptando agencias fuera de los países donde operamos por ahora..."
                          class="w-full px-3 py-2 border-2 border-slate-200 rounded-lg focus:border-slate-900 focus:outline-none"></textarea>
            </div>
            <div class="flex gap-3 justify-end">
                <a href="/" class="px-4 py-2.5 rounded-lg border border-slate-300 hover:bg-slate-100 text-sm font-medium">Cancelar</a>
                <button type="submit" class="px-5 py-2.5 rounded-lg bg-red-600 hover:bg-red-700 text-white text-sm font-semibold">Rechazar y enviar email</button>
            </div>
        </form>
    </div>
</body>
</html>
