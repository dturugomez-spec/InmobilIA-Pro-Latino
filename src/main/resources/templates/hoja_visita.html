<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Hoja de visita</title></head>
<body><div layout:fragment="content">

<div class="rounded-xl bg-gradient-to-br from-blue-700 to-blue-950 p-6 mb-5 text-white">
    <h2 class="text-xl font-bold flex items-center gap-2">
        <i data-lucide="clipboard-pen" class="h-6 w-6"></i> Hoja de visita
    </h2>
    <p class="text-sm text-white/80 mt-1">El visitante firma que le enseñaste tú el inmueble. Protege tu comisión frente a compradores que intentan ir directos al vendedor. Imprímela y llévala a cada visita.</p>
</div>

<!-- Crear -->
<form th:action="@{/hoja-visita/crear}" method="post"
      class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 mb-5">
    <p class="text-sm font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2 mb-3"><i data-lucide="plus-circle" class="h-4 w-4"></i> Nueva hoja de visita</p>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="md:col-span-2">
            <label class="block text-xs font-semibold mb-1 text-slate-600">Inmueble *</label>
            <select name="propiedad_id" required class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm">
                <option value="" disabled selected>Selecciona...</option>
                <option th:each="p : ${propiedades}" th:value="${p.get('id')}"
                        th:text="${(p.get('name') ?: p.get('address') ?: 'Inmueble') + ' · ' + (p.get('city') ?: '')}">—</option>
            </select>
        </div>
        <div><label class="block text-xs font-semibold mb-1 text-slate-600">Visitante · Nombre</label>
            <input name="visitante_nombre" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
        <div><label class="block text-xs font-semibold mb-1 text-slate-600">Visitante · [[${pais.etiquetaIdPersonal()}]]</label>
            <input name="visitante_dni" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
        <div><label class="block text-xs font-semibold mb-1 text-slate-600">Visitante · Teléfono</label>
            <input name="visitante_telefono" type="tel" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
        <div><label class="block text-xs font-semibold mb-1 text-slate-600">Visitante · Email</label>
            <input name="visitante_email" type="email" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
        <div><label class="block text-xs font-semibold mb-1 text-slate-600">Fecha de la visita</label>
            <input name="fecha_visita" type="date" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
        <div><label class="block text-xs font-semibold mb-1 text-slate-600">Observaciones (opcional)</label>
            <input name="observaciones" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
    </div>
    <button class="mt-4 px-5 py-2.5 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-sm font-bold flex items-center gap-2">
        <i data-lucide="file-text" class="h-4 w-4"></i> Generar hoja
    </button>
</form>

<!-- Lista -->
<div th:if="${#lists.isEmpty(hojas)}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-10 text-center">
    <i data-lucide="clipboard-pen" class="h-10 w-10 mx-auto text-slate-300"></i>
    <p class="mt-3 font-semibold text-slate-600">Aún no hay hojas de visita</p>
</div>

<div class="space-y-3">
    <div th:each="h : ${hojas}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 flex items-center justify-between gap-3 flex-wrap">
        <div class="min-w-0">
            <p class="font-bold text-slate-900 dark:text-white" th:text="${h.get('visitante_nombre') ?: 'Visitante'}">—</p>
            <p class="text-sm text-slate-500 truncate" th:text="${h.get('inmueble_texto')}">—</p>
            <p class="text-xs text-slate-400 mt-1 font-mono" th:if="${h.get('fecha_visita')}" th:text="'Visita: ' + ${h.get('fecha_visita')}">—</p>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
            <a th:href="@{|/hoja-visita/${h.get('id')}|}" target="_blank"
               class="px-3 py-1.5 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="printer" class="h-3.5 w-3.5"></i> Ver / imprimir
            </a>
            <form th:action="@{|/hoja-visita/${h.get('id')}/eliminar|}" method="post" onsubmit="return confirm('¿Eliminar esta hoja?')">
                <button class="px-2.5 py-1.5 rounded-lg text-red-500 hover:bg-red-50 text-xs font-bold"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
            </form>
        </div>
    </div>
</div>

<script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>

</div></body></html>
