<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Firmas electrónicas</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-xl bg-gradient-to-br from-slate-800 to-slate-950 p-6 mb-5 text-white">
        <div class="flex items-start justify-between flex-wrap gap-3">
            <div>
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="pen-tool" class="h-6 w-6"></i> Firmas electrónicas
                </h2>
                <p class="text-sm text-white/80 mt-1">Envía contratos para firma con firma electrónica simple y registro de evidencias.</p>
            </div>
            <a href="/firmas/nueva" class="px-4 py-2 rounded-lg bg-white text-slate-900 hover:bg-white/90 text-sm font-medium">
                <i data-lucide="plus" class="h-4 w-4 inline-block"></i> Nuevo documento
            </a>
        </div>
    </div>

    <div class="grid grid-cols-3 gap-3 mb-5">
        <div class="rounded-xl bg-amber-50 ring-1 ring-amber-200 p-4">
            <p class="text-[10px] uppercase text-amber-700">Pendientes</p>
            <p class="text-xl font-bold text-amber-700" th:text="${pendientes}">0</p>
        </div>
        <div class="rounded-xl bg-emerald-50 ring-1 ring-emerald-200 p-4">
            <p class="text-[10px] uppercase text-emerald-700">Firmados</p>
            <p class="text-xl font-bold text-emerald-700" th:text="${firmados}">0</p>
        </div>
        <div class="rounded-xl bg-red-50 ring-1 ring-red-200 p-4">
            <p class="text-[10px] uppercase text-red-700">Rechazados</p>
            <p class="text-xl font-bold text-red-700" th:text="${rechazados}">0</p>
        </div>
    </div>

    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 dark:bg-neutral-800/50">
            <tr class="text-[10px] uppercase tracking-wider text-slate-500">
                <th class="text-left px-4 py-3">Título</th>
                <th class="text-left px-4 py-3">Tipo</th>
                <th class="text-left px-4 py-3">Estado</th>
                <th class="text-left px-4 py-3">Hash</th>
                <th class="text-left px-4 py-3">Enviado</th>
                <th></th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-neutral-800">
            <tr th:each="d : ${documentos}" class="hover:bg-slate-50 dark:hover:bg-neutral-800/40">
                <td class="px-4 py-3 font-medium" th:text="${d.get('titulo')}">—</td>
                <td class="px-4 py-3 text-xs capitalize" th:text="${d.get('tipo')}">—</td>
                <td class="px-4 py-3">
                    <span th:switch="${d.get('estado')}">
                        <span th:case="'borrador'" class="inline-flex text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">Borrador</span>
                        <span th:case="'enviado'" class="inline-flex text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">Enviado</span>
                        <span th:case="'parcialmente_firmado'" class="inline-flex text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">Parcial</span>
                        <span th:case="'firmado'" class="inline-flex text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Firmado</span>
                        <span th:case="'rechazado'" class="inline-flex text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700">Rechazado</span>
                        <span th:case="'expirado'" class="inline-flex text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-300 text-slate-700">Expirado</span>
                    </span>
                </td>
                <td class="px-4 py-3 font-mono text-[10px] text-slate-500" th:text="${#strings.abbreviate(d.get('documento_hash'), 15)}">—</td>
                <td class="px-4 py-3 text-xs font-mono" th:text="${d.get('fecha_envio') != null ? #strings.substring(d.get('fecha_envio'), 0, 10) : '—'}">—</td>
                <td class="px-4 py-3 text-right">
                    <a th:href="@{|/firmas/${d.get('id')}|}" class="text-xs text-blue-700 hover:underline">Ver</a>
                </td>
            </tr>
            <tr th:if="${documentos.isEmpty()}"><td colspan="6" class="py-12 text-center text-slate-500 text-sm">Sin documentos para firmar.</td></tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
