<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Open House - InmobilIA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-50 to-pink-50 min-h-screen p-4">
<div class="max-w-2xl mx-auto">

    <div th:if="${error}" class="bg-white rounded-2xl shadow-xl p-8 text-center">
        <div class="text-6xl mb-4"></div>
        <p class="text-slate-700" th:text="${error}">—</p>
    </div>

    <div th:if="${registrado}" class="bg-white rounded-2xl shadow-xl p-8 text-center">
        <div class="text-6xl mb-4"></div>
        <h1 class="text-2xl font-bold text-emerald-700">¡Estás registrado!</h1>
        <p class="text-slate-600 mt-2">Te esperamos el <strong th:text="${oh.get('fecha')}">—</strong> a las <strong th:text="${#strings.substring(oh.get('hora_inicio'),0,5)}">—</strong>.</p>
        <p class="text-sm text-slate-500 mt-3" th:text="${oh.get('propiedad') != null ? oh.get('propiedad').get('direccion') : ''}">—</p>
    </div>

    <div th:if="${oh != null and !registrado and !error}" class="bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="h-48 bg-gradient-to-br from-purple-400 to-pink-500 flex items-center justify-center text-white text-6xl"></div>

        <div class="p-6">
            <span class="inline-block px-2 py-0.5 text-[10px] font-bold rounded-full bg-pink-100 text-pink-700">OPEN HOUSE</span>
            <h1 class="text-2xl font-bold mt-2 text-slate-900" th:text="${oh.get('titulo')}">—</h1>
            <p class="text-slate-600 text-sm mt-1" th:text="${oh.get('propiedad') != null ? ' ' + oh.get('propiedad').get('direccion') : ''}">—</p>

            <div class="my-5 grid grid-cols-3 gap-3 bg-slate-50 p-4 rounded-lg">
                <div class="text-center">
                    <p class="text-[10px] uppercase text-slate-500">Fecha</p>
                    <p class="font-bold text-slate-900" th:text="${oh.get('fecha')}">—</p>
                </div>
                <div class="text-center">
                    <p class="text-[10px] uppercase text-slate-500">Inicio</p>
                    <p class="font-bold text-slate-900" th:text="${#strings.substring(oh.get('hora_inicio'),0,5)}">—</p>
                </div>
                <div class="text-center">
                    <p class="text-[10px] uppercase text-slate-500">Fin</p>
                    <p class="font-bold text-slate-900" th:text="${#strings.substring(oh.get('hora_fin'),0,5)}">—</p>
                </div>
            </div>

            <p class="text-sm text-slate-700" th:if="${oh.get('descripcion')}" th:text="${oh.get('descripcion')}">—</p>

            <div class="flex gap-2 my-4 flex-wrap">
                <span th:if="${oh.get('incluye_aperitivo')}" class="text-xs px-3 py-1 rounded-full bg-amber-100 text-amber-700"> Aperitivo</span>
                <span th:if="${oh.get('incluye_valoracion')}" class="text-xs px-3 py-1 rounded-full bg-blue-100 text-blue-700"> Valoración gratuita</span>
                <span th:if="${oh.get('incluye_financiacion')}" class="text-xs px-3 py-1 rounded-full bg-emerald-100 text-emerald-700"> Asesor financiación</span>
            </div>

            <form th:action="@{|/open-house/publico/${oh.get('pagina_publica_token')}/registrar|}" method="post" class="space-y-3 mt-5">
                <h2 class="font-bold text-slate-900"> Confirma tu asistencia</h2>
                <input type="text" name="nombre" placeholder="Tu nombre *" required class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg">
                <input type="email" name="email" placeholder="Email *" required class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg">
                <input type="tel" name="telefono" placeholder="Teléfono" class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg">

                <div class="grid grid-cols-2 gap-3">
                    <input type="number" name="num_acompanantes" placeholder="Acompañantes" min="0" value="0" class="px-4 py-3 border-2 border-slate-200 rounded-lg">
                    <select name="interes" class="px-4 py-3 border-2 border-slate-200 rounded-lg">
                        <option value="">¿Qué te interesa?</option>
                        <option value="comprar">Comprar</option>
                        <option value="alquilar">Alquilar</option>
                        <option value="mirar">Solo mirar</option>
                        <option value="vender_otra">Vender otra propiedad</option>
                    </select>
                </div>

                <button type="submit" class="w-full px-4 py-3 rounded-lg bg-gradient-to-r from-pink-600 to-purple-700 text-white font-bold">
                     Confirmar asistencia
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
