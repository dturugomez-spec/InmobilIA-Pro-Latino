<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Catastro</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-xl bg-gradient-to-br from-orange-600 to-red-800 p-6 mb-5 text-white">
        <h2 class="text-xl font-bold flex items-center gap-2">
            <i data-lucide="map" class="h-6 w-6"></i> Consulta Catastro
        </h2>
        <p class="text-sm text-white/80 mt-1">Conecta con la API pública del Catastro español para verificar datos.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
            <h3 class="font-semibold text-sm mb-3"> Por referencia catastral</h3>
            <p class="text-[10px] text-slate-500 mb-3">20 caracteres alfanuméricos</p>
            <input type="text" id="rc" placeholder="9872023VH5797S0001WX" maxlength="20" class="w-full px-3 py-2 text-sm font-mono uppercase border border-slate-200 rounded-lg mb-2">
            <button onclick="consultarRC()" class="w-full px-4 py-2 rounded-lg bg-orange-600 hover:bg-orange-700 text-white text-sm font-medium"> Consultar</button>
        </div>

        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
            <h3 class="font-semibold text-sm mb-3"> Por coordenadas</h3>
            <input type="number" step="0.0000001" id="lat" placeholder="Latitud (40.4168)" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg mb-2">
            <input type="number" step="0.0000001" id="lng" placeholder="Longitud (-3.7038)" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg mb-2">
            <button onclick="consultarCoord()" class="w-full px-4 py-2 rounded-lg bg-orange-600 hover:bg-orange-700 text-white text-sm font-medium"> Consultar</button>
        </div>

        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
            <h3 class="font-semibold text-sm mb-3"> Por dirección</h3>
            <input type="text" id="provincia" placeholder="Provincia" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg mb-2">
            <input type="text" id="municipio" placeholder="Municipio" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg mb-2">
            <div class="grid grid-cols-3 gap-2 mb-2">
                <input type="text" id="tipoVia" placeholder="CL" value="CL" class="px-2 py-2 text-sm border border-slate-200 rounded-lg">
                <input type="text" id="calle" placeholder="Calle" class="col-span-2 px-3 py-2 text-sm border border-slate-200 rounded-lg">
            </div>
            <input type="text" id="numero" placeholder="Número" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg mb-2">
            <button onclick="consultarDir()" class="w-full px-4 py-2 rounded-lg bg-orange-600 hover:bg-orange-700 text-white text-sm font-medium"> Consultar</button>
        </div>
    </div>

    <div id="resultado" class="mt-5 rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 hidden">
        <h3 class="font-semibold text-sm mb-3"> Resultado</h3>
        <pre id="resultadoJson" class="text-xs bg-slate-50 p-3 rounded overflow-auto max-h-96"></pre>
    </div>

    <script>
        async function consultarRC() {
            const rc = document.getElementById('rc').value.toUpperCase();
            const fd = new FormData(); fd.append('refCatastral', rc);
            mostrarResult(await (await fetch('/catastro/consultar-rc', {method:'POST', body:fd})).json());
        }
        async function consultarCoord() {
            const fd = new FormData();
            fd.append('lat', document.getElementById('lat').value);
            fd.append('lng', document.getElementById('lng').value);
            mostrarResult(await (await fetch('/catastro/consultar-coord', {method:'POST', body:fd})).json());
        }
        async function consultarDir() {
            const fd = new FormData();
            ['provincia','municipio','tipoVia','calle','numero'].forEach(id => fd.append(id, document.getElementById(id).value));
            mostrarResult(await (await fetch('/catastro/consultar-dir', {method:'POST', body:fd})).json());
        }
        function mostrarResult(data) {
            document.getElementById('resultado').classList.remove('hidden');
            document.getElementById('resultadoJson').textContent = JSON.stringify(data, null, 2);
        }
    </script>

</div>
</body>
</html>
