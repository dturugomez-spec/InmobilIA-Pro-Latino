<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Conciliación bancaria</title></head>
<body>
<div layout:fragment="content">
    <div class="rounded-xl bg-gradient-to-br from-blue-700 to-cyan-900 p-6 mb-5 text-white">
        <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="banknote" class="h-6 w-6"></i> Conciliación bancaria</h2>
        <p class="text-sm text-white/80 mt-1">Sube CSV del banco. Auto-match con facturas pendientes.</p>
    </div>
    <form method="post" action="/conciliacion/importar" enctype="multipart/form-data" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 mb-5">
        <input type="file" name="archivo" accept=".csv" required class="text-sm">
        <button class="ml-2 px-4 py-2 rounded-lg bg-blue-700 text-white text-sm"> Importar CSV</button>
        <p class="text-[10px] text-slate-500 mt-2">Formato: fecha;importe;concepto;referencia (1 línea por movimiento, cabecera opcional)</p>
    </form>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
            <h3 class="font-semibold text-sm mb-3"> Últimos imports</h3>
            <table class="w-full text-xs">
                <tr th:each="i : ${imports}" class="border-b border-slate-100 dark:border-neutral-800">
                    <td class="py-2" th:text="${i.get('nombre_archivo')}">—</td>
                    <td class="py-2 text-right text-emerald-700" th:text="${i.get('num_conciliadas')} + ' conc.'">—</td>
                    <td class="py-2 text-right text-amber-700" th:text="${i.get('num_pendientes')} + ' pend.'">—</td>
                </tr>
                <tr th:if="${imports.isEmpty()}"><td class="py-6 text-center text-slate-400">Sin imports</td></tr>
            </table>
        </div>
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
            <h3 class="font-semibold text-sm mb-3">⏳ Pendientes (<span th:text="${pendientes.size()}">0</span>)</h3>
            <ul class="space-y-2 text-xs max-h-96 overflow-y-auto">
                <li th:each="t : ${pendientes}" class="p-2 rounded bg-slate-50 dark:bg-neutral-800/50">
                    <div class="flex justify-between">
                        <span th:text="${t.get('fecha')}">—</span>
                        <span class="font-mono font-bold" th:classappend="${t.get('importe').doubleValue() >= 0 ? 'text-emerald-700' : 'text-red-700'}" th:text="${#numbers.formatDecimal(t.get('importe'),1,'DEFAULT',2,'DEFAULT')} + ' ' + ${mon}">—</span>
                    </div>
                    <p class="text-[10px] text-slate-500" th:text="${t.get('concepto')}">—</p>
                </li>
            </ul>
        </div>
    </div>
</div></body></html>
