<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Top inquilinos</title>
    <style>@media print { .no-print { display: none !important; } body { background: white !important; } }</style>
</head>
<body>
<div layout:fragment="content">

    <div class="no-print flex items-center gap-2 mb-4">
        <a href="/reports" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-700 hover:bg-slate-50 dark:hover:bg-neutral-800 text-sm font-medium transition-colors">
            <i data-lucide="arrow-left" class="h-4 w-4"></i> Reportes
        </a>
        <button onclick="window.print()" class="ml-auto inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-sm font-medium transition-colors shadow-card">
            <i data-lucide="printer" class="h-4 w-4"></i> Imprimir / PDF
        </button>
    </div>

    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 dark:bg-neutral-800/50 border-b border-slate-200 dark:border-neutral-800">
                <tr class="text-[10px] uppercase tracking-wider text-slate-500 dark:text-neutral-400">
                    <th class="text-left font-semibold px-4 py-3">#</th>
                    <th class="text-left font-semibold px-4 py-3">Inquilino</th>
                    <th class="text-left font-semibold px-4 py-3">Propiedad</th>
                    <th class="text-right font-semibold px-3 py-3">Renta</th>
                    <th class="text-right font-semibold px-3 py-3">Pagos</th>
                    <th class="text-right font-semibold px-3 py-3">Total cobrado</th>
                    <th class="text-center font-semibold px-3 py-3">Score</th>
                    <th class="text-left font-semibold px-3 py-3">Estado</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-neutral-800">
                <tr th:each="r,it : ${rows}" class="hover:bg-slate-50 dark:hover:bg-neutral-800/40">
                    <td class="px-4 py-3 text-center">
                        <span th:if="${it.index == 0}" class="text-base"></span>
                        <span th:if="${it.index == 1}" class="text-base"></span>
                        <span th:if="${it.index == 2}" class="text-base"></span>
                        <span th:if="${it.index >= 3}" th:text="${it.index + 1}" class="font-mono text-xs text-slate-400">4</span>
                    </td>
                    <td class="px-4 py-3">
                        <a th:href="@{|/entity/inquilino/${r.get('id')}|}" class="flex items-center gap-2.5 hover:text-brand-700 dark:hover:text-brand-400">
                            <div class="h-7 w-7 rounded-full bg-gradient-to-br from-brand-600 to-brand-800 text-white flex items-center justify-center text-xs font-bold flex-shrink-0"
                                 th:text="${r.get('name') != null and !#strings.isEmpty(r.get('name')) ? #strings.toUpperCase(#strings.substring(r.get('name'),0,1)) : 'I'}">I</div>
                            <span class="font-medium" th:text="${r.get('name')}">nombre</span>
                        </a>
                    </td>
                    <td class="px-4 py-3 text-slate-600 dark:text-slate-400 truncate max-w-[200px]" th:text="${r.get('property') ?: '—'}">—</td>
                    <td class="px-3 py-3 font-mono text-right text-xs" th:text="${r.get('rent') > 0 ? #numbers.formatDecimal(r.get('rent'),0,'DEFAULT',0,'DEFAULT') + ' ' + mon : '—'}">—</td>
                    <td class="px-3 py-3 font-mono text-right" th:text="${r.get('pagosCount')}">0</td>
                    <td class="px-3 py-3 font-mono text-right font-semibold text-emerald-600 dark:text-emerald-400" th:text="${#numbers.formatDecimal(r.get('totalPagado'),0,'DEFAULT',0,'DEFAULT')} + ' ' + ${mon}">0 [[${mon}]]</td>
                    <td class="px-3 py-3 text-center">
                        <span th:if="${r.get('score') > 0}"
                              th:text="${r.get('score') + '/100'}"
                              th:classappend="${r.get('score') >= 70 ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-400' : (r.get('score') >= 40 ? 'bg-amber-100 text-amber-700 dark:bg-amber-950/40 dark:text-amber-400' : 'bg-red-100 text-red-700 dark:bg-red-950/40 dark:text-red-400')}"
                              class="inline-flex text-[11px] font-mono font-bold px-2 py-0.5 rounded-full">—</span>
                        <span th:unless="${r.get('score') > 0}" class="text-xs text-slate-400">—</span>
                    </td>
                    <td class="px-3 py-3"><span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 dark:bg-neutral-800" th:text="${r.get('status') ?: '—'}">—</span></td>
                </tr>
                <tr th:if="${rows.isEmpty()}"><td colspan="8" class="py-12 text-center text-sm text-slate-500">Sin inquilinos registrados.</td></tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
