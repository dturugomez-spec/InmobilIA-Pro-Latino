<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Ranking de leads</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-xl bg-gradient-to-br from-red-600 to-orange-700 p-6 mb-5 text-white">
        <div class="flex items-start justify-between flex-wrap gap-3">
            <div>
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="flame" class="h-6 w-6"></i> Ranking de leads (AI scoring)
                </h2>
                <p class="text-sm text-white/90 mt-1">Priorización automática por temperatura. Contacta primero los HOT.</p>
            </div>
            <button onclick="recalcAll()" id="btnRecalc" class="px-4 py-2 rounded-lg bg-white text-red-900 hover:bg-white/90 text-sm font-medium">
                <i data-lucide="refresh-cw" class="h-4 w-4 inline-block"></i> Recalcular todos
            </button>
        </div>
    </div>

    <!-- KPIs temperatura -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-5">
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-4">
            <p class="text-[10px] uppercase text-slate-500">Score promedio</p>
            <p class="text-xl font-bold mt-1" th:text="${#numbers.formatDecimal(scorePromedio, 1, 1)} + '/100'">0</p>
        </div>
        <a href="/leads-scoring?temperatura=hot" class="rounded-xl bg-red-50 ring-1 ring-red-200 p-4 hover:bg-red-100 transition">
            <p class="text-[10px] uppercase text-red-700"> HOT</p>
            <p class="text-xl font-bold mt-1 text-red-700" th:text="${hot}">0</p>
        </a>
        <a href="/leads-scoring?temperatura=caliente" class="rounded-xl bg-orange-50 ring-1 ring-orange-200 p-4 hover:bg-orange-100 transition">
            <p class="text-[10px] uppercase text-orange-700"> Caliente</p>
            <p class="text-xl font-bold mt-1 text-orange-700" th:text="${caliente}">0</p>
        </a>
        <a href="/leads-scoring?temperatura=tibio" class="rounded-xl bg-yellow-50 ring-1 ring-yellow-200 p-4 hover:bg-yellow-100 transition">
            <p class="text-[10px] uppercase text-yellow-700"> Tibio</p>
            <p class="text-xl font-bold mt-1 text-yellow-700" th:text="${tibio}">0</p>
        </a>
        <a href="/leads-scoring?temperatura=frio" class="rounded-xl bg-blue-50 ring-1 ring-blue-200 p-4 hover:bg-blue-100 transition">
            <p class="text-[10px] uppercase text-blue-700"> Frío</p>
            <p class="text-xl font-bold mt-1 text-blue-700" th:text="${frio}">0</p>
        </a>
    </div>

    <!-- Listado -->
    <div class="space-y-2">
        <div th:each="l : ${leads}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-4 hover:shadow transition flex items-center gap-4">

            <!-- Score circle -->
            <div class="relative flex-shrink-0">
                <svg class="w-16 h-16 -rotate-90" viewBox="0 0 36 36">
                    <circle cx="18" cy="18" r="16" fill="none" stroke="#e5e7eb" stroke-width="3"/>
                    <circle cx="18" cy="18" r="16" fill="none"
                            th:attr="stroke-dasharray=${l.get('score') + ', 100'}"
                            stroke-width="3"
                            th:style="|stroke: ${l.get('score') >= 80 ? '#dc2626' : (l.get('score') >= 60 ? '#ea580c' : (l.get('score') >= 40 ? '#ca8a04' : '#2563eb'))}|"/>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span class="text-sm font-bold" th:text="${l.get('score') ?: 0}">0</span>
                    <span class="text-[8px] text-slate-500 uppercase" th:text="${l.get('temperatura') ?: 'sin'}">—</span>
                </div>
            </div>

            <!-- Info -->
            <div class="flex-1 min-w-0">
                <p class="font-semibold text-sm" th:text="${l.get('nombre')}">—</p>
                <p class="text-xs text-slate-500 truncate">
                    <span th:if="${l.get('email')}" th:text="${l.get('email')}">—</span>
                    <span th:if="${l.get('telefono')}" th:text="' · ' + ${l.get('telefono')}">—</span>
                </p>
                <p class="text-[10px] text-slate-400 mt-1">
                    Tipo: <span th:text="${l.get('tipo') ?: '—'}">—</span> ·
                    Presup.: <span th:text="${l.get('presupuesto_max') != null ? #numbers.formatDecimal(l.get('presupuesto_max'),1,'POINT',0,'COMMA') + ' €' : '—'}">—</span>
                </p>
            </div>

            <!-- Sugerencia -->
            <div class="hidden md:block flex-1 min-w-0">
                <p class="text-xs text-slate-700 italic" th:text="${l.get('siguiente_accion') ?: 'Sin sugerencia aún'}">—</p>
                <p class="text-[10px] text-emerald-700 mt-1" th:if="${l.get('probabilidad_conversion')}" th:text="'Prob. conv: ' + ${#numbers.formatDecimal(l.get('probabilidad_conversion'),1,1)} + '%'">—</p>
            </div>

            <!-- CTA -->
            <div class="flex gap-1 flex-shrink-0">
                <a th:if="${l.get('telefono')}" th:href="${'tel:' + l.get('telefono')}" class="px-3 py-2 rounded bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs"></a>
                <a th:if="${l.get('telefono')}" th:href="${'https://wa.me/' + l.get('telefono')}" target="_blank" class="px-3 py-2 rounded bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs"></a>
                <a th:href="@{|/leads-scoring/${l.get('id')}|}" class="px-3 py-2 rounded bg-slate-100 hover:bg-slate-200 text-xs">Ver</a>
            </div>
        </div>

        <div th:if="${leads.isEmpty()}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 py-12 text-center">
            <p class="text-slate-500 text-sm">Sin leads. Crea algunos para empezar a priorizar.</p>
        </div>
    </div>

    <script>
        async function recalcAll() {
            const btn = document.getElementById('btnRecalc');
            btn.disabled = true;
            btn.innerHTML = '⏳ Recalculando...';
            const res = await fetch('/leads-scoring/recalcular-todos', { method: 'POST' });
            const data = await res.json();
            if (data.ok) {
                if (window.toast) toast(' ' + data.actualizados + ' leads recalculados', 'ok');
                setTimeout(() => location.reload(), 800);
            }
        }
    </script>

</div>
</body>
</html>
