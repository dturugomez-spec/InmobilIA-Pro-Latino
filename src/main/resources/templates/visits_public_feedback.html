<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Feedback de visita - InmobilIA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl p-8">

        <div th:if="${gracias}" class="text-center text-emerald-600">
            <div class="text-6xl mb-4"></div>
            <h1 class="text-2xl font-bold mb-2 text-slate-900">¡Gracias por tu feedback!</h1>
            <p class="text-slate-600">Tu opinión nos ayuda a mejorar y a encontrar la propiedad ideal para ti.</p>
        </div>

        <div th:unless="${gracias}">
            <h1 class="text-2xl font-bold mb-2 text-slate-900">¿Qué te ha parecido la visita?</h1>
            <p class="text-slate-600 text-sm mb-6">Hola <strong th:text="${visita.get('visitante_nombre')}">—</strong>, nos gustaría conocer tu opinión.</p>

            <form th:action="@{|/visitas/feedback-publico/${visita.get('feedback_token')}|}" method="post" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium mb-2">Nivel de interés en la propiedad</label>
                    <div class="flex gap-2 justify-between">
                        <label class="flex-1"><input type="radio" name="interes_nivel" value="1" class="sr-only peer" required><span class="block text-center py-3 rounded-lg border-2 border-slate-200 peer-checked:border-red-500 peer-checked:bg-red-50 cursor-pointer"><br><span class="text-xs">1</span></span></label>
                        <label class="flex-1"><input type="radio" name="interes_nivel" value="2" class="sr-only peer"><span class="block text-center py-3 rounded-lg border-2 border-slate-200 peer-checked:border-orange-500 peer-checked:bg-orange-50 cursor-pointer"><br><span class="text-xs">2</span></span></label>
                        <label class="flex-1"><input type="radio" name="interes_nivel" value="3" class="sr-only peer"><span class="block text-center py-3 rounded-lg border-2 border-slate-200 peer-checked:border-yellow-500 peer-checked:bg-yellow-50 cursor-pointer"><br><span class="text-xs">3</span></span></label>
                        <label class="flex-1"><input type="radio" name="interes_nivel" value="4" class="sr-only peer"><span class="block text-center py-3 rounded-lg border-2 border-slate-200 peer-checked:border-green-500 peer-checked:bg-green-50 cursor-pointer"><br><span class="text-xs">4</span></span></label>
                        <label class="flex-1"><input type="radio" name="interes_nivel" value="5" class="sr-only peer"><span class="block text-center py-3 rounded-lg border-2 border-slate-200 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 cursor-pointer"><br><span class="text-xs">5</span></span></label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Cuéntanos qué te ha parecido</label>
                    <textarea name="feedback_visitante" rows="5" placeholder="¿Qué te ha gustado? ¿Qué mejorarías? ¿Hay algo que necesites saber?" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg" required></textarea>
                </div>

                <button type="submit" class="w-full px-4 py-3 rounded-lg bg-violet-700 hover:bg-violet-800 text-white font-medium">
                    Enviar feedback
                </button>
            </form>
        </div>

    </div>
</body>
</html>
