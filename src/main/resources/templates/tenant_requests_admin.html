<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Solicitudes inquilinos</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 overflow-hidden">
        <ul class="divide-y divide-slate-100 dark:divide-neutral-800">
            <li th:each="r : ${rows}" class="p-5" x-data="{ open: false, response: '' }">
                <div class="flex items-start justify-between gap-3">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-slate-100 dark:bg-neutral-800" th:text="${r.get('category')}">tipo</span>
                            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full"
                                  th:classappend="${r.get('priority') == 'Urgente' ? 'bg-red-100 text-red-700' : (r.get('priority') == 'Alta' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600')}"
                                  th:text="${r.get('priority')}">prioridad</span>
                            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full"
                                  th:classappend="${r.get('status') == 'Resuelta' or r.get('status') == 'Cerrada' ? 'bg-emerald-100 text-emerald-700' : (r.get('status') == 'En curso' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700')}"
                                  th:text="${r.get('status')}">estado</span>
                        </div>
                        <h3 class="font-semibold" th:text="${r.get('title')}">título</h3>
                        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1" th:text="${r.get('description')}">descripción</p>
                        <div class="text-xs text-slate-500 mt-2" th:text="' ' + ${r.get('property_name')} + ' · ' + ${#strings.substring(r.get('created_at'),0,10)}">—</div>
                        <div th:if="${r.get('response')}" class="mt-3 p-3 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 ring-1 ring-emerald-200">
                            <div class="text-[10px] font-bold uppercase text-emerald-700 mb-1">Tu respuesta</div>
                            <p class="text-sm text-emerald-800" th:text="${r.get('response')}">—</p>
                        </div>
                    </div>
                    <button @click="open = !open" x-show="!r.response" class="px-3 py-1.5 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-xs font-medium flex-shrink-0">
                        Responder
                    </button>
                </div>

                <form x-show="open" x-cloak th:action="@{|/admin/tenant-requests/${r.get('id')}/respond|}" method="post" class="mt-3 space-y-2">
                    <textarea name="response" required x-model="response" rows="3" placeholder="Tu respuesta al inquilino..." class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700"></textarea>
                    <div class="flex gap-2">
                        <select name="status" class="px-3 py-1.5 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800">
                            <option>En curso</option><option>Resuelta</option><option>Cerrada</option>
                        </select>
                        <button type="submit" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm">Enviar</button>
                        <button type="button" @click="open=false" class="px-3 py-1.5 rounded-lg bg-slate-100 text-sm">Cancelar</button>
                    </div>
                </form>
            </li>
            <li th:if="${rows.isEmpty()}" class="p-12 text-center text-slate-500">No hay solicitudes pendientes.</li>
        </ul>
    </div>

</div>
</body>
</html>
