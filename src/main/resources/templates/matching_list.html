<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Matches</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-xl bg-gradient-to-br from-pink-700 to-fuchsia-900 p-6 mb-5 text-white">
        <div class="flex items-start justify-between flex-wrap gap-3">
            <div>
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="heart-handshake" class="h-6 w-6"></i> Matches inteligentes
                </h2>
                <p class="text-sm text-white/80 mt-1">Cruza automáticamente leads y propiedades. Cuanto mayor el score, mejor encaje.</p>
            </div>
            <div class="flex gap-2">
                <a href="/matches/preferencias" class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-sm">
                    <i data-lucide="sliders-horizontal" class="h-4 w-4 inline-block"></i> Preferencias
                </a>
                <button onclick="runMatching()" id="btnRun" class="px-4 py-2 rounded-lg bg-white text-fuchsia-900 hover:bg-white/90 text-sm font-medium">
                    <i data-lucide="zap" class="h-4 w-4 inline-block"></i> Ejecutar matching
                </button>
            </div>
        </div>
    </div>

    <!-- KPIs -->
    <div class="grid grid-cols-3 gap-3 mb-5">
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-4">
            <p class="text-[10px] uppercase text-slate-500">Total matches</p>
            <p class="text-xl font-bold" th:text="${total}">0</p>
        </div>
        <div class="rounded-xl bg-pink-50 ring-1 ring-pink-200 p-4">
            <p class="text-[10px] uppercase text-pink-700">Nuevos</p>
            <p class="text-xl font-bold text-pink-700" th:text="${nuevos}">0</p>
        </div>
        <div class="rounded-xl bg-emerald-50 ring-1 ring-emerald-200 p-4">
            <p class="text-[10px] uppercase text-emerald-700">Interesados</p>
            <p class="text-xl font-bold text-emerald-700" th:text="${interesados}">0</p>
        </div>
    </div>

    <!-- Filtros -->
    <form method="get" action="/matches" class="flex flex-wrap gap-2 mb-4">
        <select name="estado" onchange="this.form.submit()" class="px-3 py-1.5 text-xs border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            <option value="">Todos los estados</option>
            <option value="nuevo">Nuevo</option>
            <option value="enviado">Enviado</option>
            <option value="visto">Visto</option>
            <option value="interesado">Interesado</option>
            <option value="visita">Visita programada</option>
            <option value="descartado">Descartado</option>
        </select>
        <select name="minScore" onchange="this.form.submit()" class="px-3 py-1.5 text-xs border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            <option value="">Score mínimo</option>
            <option value="80">≥ 80%</option>
            <option value="70">≥ 70%</option>
            <option value="60">≥ 60%</option>
        </select>
    </form>

    <!-- Listado -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div th:each="m : ${matches}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 hover:shadow-md transition">
            <div class="flex items-start justify-between mb-3">
                <div class="flex-1">
                    <p class="font-semibold text-sm" th:text="${m.get('propiedad') != null ? m.get('propiedad').get('direccion') : 'Propiedad'}">—</p>
                    <p class="text-xs text-slate-500 mt-1">
                        <span th:if="${m.get('lead') != null}">Lead: <strong th:text="${m.get('lead').get('nombre')}">—</strong></span>
                    </p>
                </div>
                <!-- Score badge -->
                <div class="text-center">
                    <div class="relative w-14 h-14">
                        <svg class="w-full h-full -rotate-90" viewBox="0 0 36 36">
                            <circle cx="18" cy="18" r="16" fill="none" stroke="#e5e7eb" stroke-width="3"/>
                            <circle cx="18" cy="18" r="16" fill="none"
                                    :stroke="getColor(m.score)"
                                    th:attr="stroke-dasharray=${m.get('score') + ', 100'}"
                                    stroke-width="3"
                                    th:style="|stroke: ${m.get('score') >= 80 ? '#10b981' : (m.get('score') >= 65 ? '#f59e0b' : '#ef4444')}|"/>
                        </svg>
                        <span class="absolute inset-0 flex items-center justify-center text-xs font-bold"
                              th:text="${#numbers.formatDecimal(m.get('score'), 1, 0)} + '%'">—</span>
                    </div>
                </div>
            </div>

            <!-- Razones / descartes -->
            <div class="text-xs space-y-1 mb-3">
                <p th:if="${m.get('razones') != null and !m.get('razones').isEmpty()}" class="text-emerald-700">
                     <span th:text="${#strings.listJoin(m.get('razones'), ' · ')}">—</span>
                </p>
                <p th:if="${m.get('descartes') != null and !m.get('descartes').isEmpty()}" class="text-amber-700">
                     <span th:text="${#strings.listJoin(m.get('descartes'), ' · ')}">—</span>
                </p>
            </div>

            <!-- Datos propiedad -->
            <div th:if="${m.get('propiedad') != null}" class="grid grid-cols-3 gap-2 text-[10px] mb-3 bg-slate-50 dark:bg-neutral-800/30 p-2 rounded">
                <div><p class="text-slate-500 uppercase">Precio</p><p class="font-mono font-bold" th:text="${#numbers.formatDecimal(m.get('propiedad').get('precio') ?: 0, 1, 'DEFAULT', 0, 'DEFAULT')} + ' ' + ${mon}">—</p></div>
                <div><p class="text-slate-500 uppercase">m²</p><p class="font-mono" th:text="${m.get('propiedad').get('metros_cuadrados') ?: '—'}">—</p></div>
                <div><p class="text-slate-500 uppercase">Hab</p><p class="font-mono" th:text="${m.get('propiedad').get('habitaciones') ?: '—'}">—</p></div>
            </div>

            <!-- Acciones -->
            <div class="flex gap-1 text-xs">
                <form th:action="@{|/matches/${m.get('id')}/estado|}" method="post" class="flex-1">
                    <input type="hidden" name="estado" value="interesado">
                    <button class="w-full px-2 py-1 rounded bg-emerald-100 text-emerald-700 hover:bg-emerald-200"> Interesado</button>
                </form>
                <form th:action="@{|/matches/${m.get('id')}/estado|}" method="post" class="flex-1">
                    <input type="hidden" name="estado" value="visita">
                    <button class="w-full px-2 py-1 rounded bg-blue-100 text-blue-700 hover:bg-blue-200"> Visita</button>
                </form>
                <form th:action="@{|/matches/${m.get('id')}/estado|}" method="post" class="flex-1">
                    <input type="hidden" name="estado" value="descartado">
                    <button class="w-full px-2 py-1 rounded bg-slate-100 text-slate-600 hover:bg-slate-200"> Descartar</button>
                </form>
            </div>
        </div>

        <div th:if="${matches.isEmpty()}" class="md:col-span-2 py-12 text-center text-slate-500 text-sm rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800">
            <i data-lucide="heart-crack" class="h-10 w-10 mx-auto opacity-30"></i>
            <p class="mt-3">Sin matches aún. Crea preferencias para los leads y ejecuta el matching.</p>
        </div>
    </div>

    <script>
        async function runMatching() {
            const btn = document.getElementById('btnRun');
            btn.disabled = true;
            btn.innerHTML = '⏳ Ejecutando...';
            try {
                const res = await fetch('/matches/ejecutar', { method: 'POST' });
                const data = await res.json();
                if (data.ok) {
                    if (window.toast) toast(` ${data.nuevos} matches nuevos encontrados`, 'ok');
                    setTimeout(() => location.reload(), 1000);
                }
            } catch(e) { btn.disabled = false; btn.innerHTML = 'Reintentar'; }
        }
    </script>

</div>
</body>
</html>
