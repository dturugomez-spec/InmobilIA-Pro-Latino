<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>OCR</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<div layout:fragment="content" x-data="ocrTool()">

    <div class="rounded-xl bg-gradient-to-br from-cyan-700 via-blue-800 to-blue-950 p-6 mb-5 text-white">
        <h2 class="text-xl font-bold"> OCR · Extraer texto de imágenes</h2>
        <p class="text-sm text-white/70 mt-1">Sube una foto de factura, contrato, DNI, certificado catastral... y obtén el texto extraído al instante. <strong>Procesamiento local</strong>: tus documentos no salen de tu navegador.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

        <!-- Input -->
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
            <h3 class="font-semibold mb-3 flex items-center gap-2"><i data-lucide="upload" class="h-4 w-4 text-brand-600"></i> Subir imagen</h3>

            <label class="block">
                <div class="border-2 border-dashed border-slate-300 dark:border-neutral-700 rounded-lg p-8 text-center hover:border-brand-500 cursor-pointer transition-colors">
                    <input type="file" accept="image/*,.pdf" @change="processFile($event.target.files[0])" class="sr-only">
                    <i data-lucide="image-up" class="h-10 w-10 text-slate-400 mx-auto mb-2"></i>
                    <p class="text-sm font-medium">Click para seleccionar o arrastra una imagen</p>
                    <p class="text-xs text-slate-500 mt-1">JPG, PNG, WebP · max 10 MB</p>
                </div>
            </label>

            <div x-show="previewUrl" x-cloak class="mt-4">
                <img :src="previewUrl" class="w-full max-h-80 object-contain rounded-lg ring-1 ring-slate-200">
            </div>

            <div x-show="processing" x-cloak class="mt-4">
                <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div class="h-full bg-brand-600 transition-all" :style="`width: ${progress}%`"></div>
                </div>
                <p class="text-xs text-slate-500 mt-2 text-center" x-text="status">Procesando...</p>
            </div>
        </div>

        <!-- Resultado -->
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-semibold flex items-center gap-2"><i data-lucide="file-text" class="h-4 w-4 text-brand-600"></i> Texto extraído</h3>
                <button @click="copy()" x-show="text" class="text-xs text-brand-700 hover:underline"> Copiar</button>
            </div>

            <textarea x-model="text" rows="16" placeholder="El texto extraído aparecerá aquí..." class="w-full px-3 py-2 text-sm font-mono bg-slate-50 dark:bg-neutral-800/40 border border-slate-200 dark:border-neutral-700 rounded-lg focus:outline-none focus:border-brand-500"></textarea>

            <!-- Datos auto-extraídos -->
            <div x-show="extracted.length > 0" x-cloak class="mt-4 space-y-2">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500">Datos detectados</h4>
                <template x-for="d in extracted" :key="d.label">
                    <div class="flex items-center justify-between p-2 rounded bg-emerald-50 dark:bg-emerald-950/30 ring-1 ring-emerald-200 dark:ring-emerald-900/40 text-sm">
                        <span class="text-emerald-700 font-medium" x-text="d.label"></span>
                        <span class="font-mono font-bold text-emerald-900" x-text="d.value"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>

</div>

<script>
function ocrTool() {
    return {
        text: '',
        previewUrl: null,
        processing: false,
        progress: 0,
        status: '',
        extracted: [],

        async processFile(file) {
            if (!file) return;
            this.previewUrl = URL.createObjectURL(file);
            this.text = '';
            this.extracted = [];
            this.processing = true;
            this.progress = 0;
            this.status = 'Iniciando OCR...';

            try {
                const result = await Tesseract.recognize(file, 'spa+eng', {
                    logger: m => {
                        if (m.status) this.status = m.status;
                        if (m.progress != null) this.progress = Math.round(m.progress * 100);
                    }
                });
                this.text = result.data.text;
                this.detectData();
                this.status = ' Texto extraído';
            } catch (e) {
                this.status = ' Error: ' + e.message;
                console.error(e);
            } finally {
                this.processing = false;
            }
        },

        detectData() {
            const t = this.text;
            // NIF/CIF
            const nif = t.match(/\b[0-9]{8}[A-Z]\b|\b[A-Z][0-9]{8}\b/);
            if (nif) this.extracted.push({ label: 'NIF/CIF', value: nif[0] });
            // IBAN
            const iban = t.match(/ES[0-9]{2}\s?[0-9]{4}\s?[0-9]{4}\s?[0-9]{4}\s?[0-9]{4}\s?[0-9]{4}/i);
            if (iban) this.extracted.push({ label: 'IBAN', value: iban[0].toUpperCase() });
            // Email
            const email = t.match(/[\w.-]+@[\w.-]+\.[a-z]{2,}/i);
            if (email) this.extracted.push({ label: 'Email', value: email[0] });
            // Teléfono ES
            const phone = t.match(/(\+?34)?\s?[6-9][0-9]{2}\s?[0-9]{3}\s?[0-9]{3}/);
            if (phone) this.extracted.push({ label: 'Teléfono', value: phone[0] });
            // Importe €
            const importe = t.match(/[\d.]+,?\d{0,2}\s?€/);
            if (importe) this.extracted.push({ label: 'Importe', value: importe[0] });
            // Fecha
            const fecha = t.match(/\b\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4}\b/);
            if (fecha) this.extracted.push({ label: 'Fecha', value: fecha[0] });
            // Catastro
            const cat = t.match(/\b[0-9]{7}[A-Z]{2}[0-9]{4}[A-Z]{1}\b/i);
            if (cat) this.extracted.push({ label: 'Ref. catastral', value: cat[0].toUpperCase() });
        },

        async copy() {
            try { await navigator.clipboard.writeText(this.text); if (window.toast) window.toast('Copiado', 'ok'); } catch(e) {}
        }
    };
}
</script>
</body>
</html>
