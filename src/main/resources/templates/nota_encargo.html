<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Nota de encargo</title></head>
<body><div layout:fragment="content">

<div class="rounded-xl bg-gradient-to-br from-blue-700 to-blue-950 p-6 mb-5 text-white">
    <h2 class="text-xl font-bold flex items-center gap-2">
        <i data-lucide="file-signature" class="h-6 w-6"></i> Nota de encargo de venta
    </h2>
    <p class="text-sm text-white/80 mt-1">Genera el documento del encargo (exclusiva) con los datos reales de la agencia, el propietario y el inmueble, listo para imprimir y firmar. El cierre de tu captación.</p>
</div>

<!-- Crear -->
<form th:action="@{/nota-encargo/crear}" method="post"
      class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 mb-5">
    <p class="text-sm font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2 mb-3"><i data-lucide="plus-circle" class="h-4 w-4"></i> Nuevo encargo</p>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="md:col-span-2">
            <label class="block text-xs font-semibold mb-1 text-slate-600">Inmueble *</label>
            <select name="propiedad_id" required class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm">
                <option value="" disabled selected>Selecciona...</option>
                <option th:each="p : ${propiedades}" th:value="${p.get('id')}"
                        th:text="${(p.get('name') ?: p.get('address') ?: 'Inmueble') + ' · ' + (p.get('city') ?: '')}">—</option>
            </select>
        </div>
        <div><label class="block text-xs font-semibold mb-1 text-slate-600">Propietario · Nombre</label>
            <input name="propietario_nombre" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
        <div><label class="block text-xs font-semibold mb-1 text-slate-600">Propietario · DNI/NIF</label>
            <input name="propietario_dni" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
        <div><label class="block text-xs font-semibold mb-1 text-slate-600">Propietario · Email</label>
            <input name="propietario_email" type="email" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
        <div><label class="block text-xs font-semibold mb-1 text-slate-600">Propietario · Teléfono</label>
            <input name="propietario_telefono" type="tel" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
        <div class="md:col-span-2"><label class="block text-xs font-semibold mb-1 text-slate-600">Propietario · Domicilio</label>
            <input name="propietario_direccion" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
        <div><label class="block text-xs font-semibold mb-1 text-slate-600">Comisión (%)</label>
            <input name="comision_pct" type="number" step="0.1" value="3" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
        <div><label class="block text-xs font-semibold mb-1 text-slate-600">Duración (meses)</label>
            <input name="duracion_meses" type="number" value="6" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
        <label class="flex items-center gap-2 text-sm md:col-span-2 mt-1">
            <input type="checkbox" name="exclusiva" value="true" checked class="rounded"> Encargo en <strong>exclusiva</strong>
        </label>
        <div class="md:col-span-2"><label class="block text-xs font-semibold mb-1 text-slate-600">Observaciones (opcional)</label>
            <input name="observaciones" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm"></div>
    </div>
    <button class="mt-4 px-5 py-2.5 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-sm font-bold flex items-center gap-2">
        <i data-lucide="file-text" class="h-4 w-4"></i> Generar encargo
    </button>
</form>

<!-- Lista -->
<div th:if="${#lists.isEmpty(notas)}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-10 text-center">
    <i data-lucide="file-signature" class="h-10 w-10 mx-auto text-slate-300"></i>
    <p class="mt-3 font-semibold text-slate-600">Aún no has generado encargos</p>
</div>

<div class="space-y-3">
    <div th:each="n : ${notas}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 flex items-center justify-between gap-3 flex-wrap">
        <div class="min-w-0">
            <p class="font-bold text-slate-900 dark:text-white" th:text="${n.get('propietario_nombre') ?: 'Propietario'}">—</p>
            <p class="text-sm text-slate-500 truncate" th:text="${n.get('inmueble_texto')}">—</p>
            <div class="flex flex-wrap gap-x-3 text-xs text-slate-400 mt-1">
                <span th:text="${#bools.isTrue(n.get('exclusiva')) ? 'Exclusiva' : 'No exclusiva'} + ' · ' + ${n.get('comision_pct')} + '% · ' + ${n.get('duracion_meses')} + ' meses'">—</span>
                <span class="font-mono" th:if="${n.get('created_at')}" th:text="${#strings.substring(n.get('created_at'), 0, 10)}">—</span>
            </div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
            <a th:href="@{|/nota-encargo/${n.get('id')}|}" target="_blank"
               class="px-3 py-1.5 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="printer" class="h-3.5 w-3.5"></i> Ver / imprimir
            </a>
            <form th:action="@{|/nota-encargo/${n.get('id')}/eliminar|}" method="post" onsubmit="return confirm('¿Eliminar este encargo?')">
                <button class="px-2.5 py-1.5 rounded-lg text-red-500 hover:bg-red-50 text-xs font-bold"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
            </form>
        </div>
    </div>
</div>

<script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>

</div></body></html>
