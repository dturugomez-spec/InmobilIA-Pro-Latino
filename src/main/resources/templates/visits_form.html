<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Nueva visita</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-xl bg-gradient-to-br from-violet-700 to-indigo-900 p-5 mb-5 text-white">
        <h2 class="text-lg font-bold flex items-center gap-2">
            <i data-lucide="calendar-plus" class="h-5 w-5"></i> Programar visita
        </h2>
    </div>

    <form method="post" action="/visitas/guardar" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 space-y-4">

        <section>
            <h3 class="font-semibold text-sm mb-3 text-violet-700"> Propiedad y agente</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium mb-1">Propiedad *</label>
                    <select name="propiedad_id" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                        <option value="">— Seleccionar —</option>
                        <option th:each="p : ${propiedades}" th:value="${p.get('id')}" th:text="${p.get('direccion')}"
                                th:selected="${p.get('id') == preseleccion.get('propiedad_id')}">—</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Agente responsable</label>
                    <select name="agente_id" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                        <option value="">— Yo mismo —</option>
                        <option th:each="a : ${agentes}" th:value="${a.get('id')}" th:text="${a.get('name')}">—</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Lead asociado</label>
                    <select name="lead_id" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                        <option value="">— Ninguno —</option>
                        <option th:each="l : ${leads}" th:value="${l.get('id')}" th:text="${l.get('nombre')}"
                                th:selected="${l.get('id') == preseleccion.get('lead_id')}">—</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Tipo</label>
                    <select name="tipo" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                        <option value="presencial"> Presencial</option>
                        <option value="virtual"> Virtual</option>
                        <option value="open_house"> Open House</option>
                    </select>
                </div>
            </div>
        </section>

        <section>
            <h3 class="font-semibold text-sm mb-3 text-violet-700"> Visitante</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium mb-1">Nombre *</label>
                    <input type="text" name="visitante_nombre" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">DNI</label>
                    <input type="text" name="visitante_dni" placeholder="12345678A" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Email</label>
                    <input type="email" name="visitante_email" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Teléfono</label>
                    <input type="tel" name="visitante_telefono" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
            </div>
        </section>

        <section>
            <h3 class="font-semibold text-sm mb-3 text-violet-700"> Fecha y hora</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-medium mb-1">Fecha *</label>
                    <input type="date" name="fecha" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Hora *</label>
                    <input type="time" name="hora" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Duración (min)</label>
                    <input type="number" name="duracion_min" value="30" min="15" step="15" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
            </div>
            <div class="mt-3">
                <label class="block text-xs font-medium mb-1">URL reunión (para visitas virtuales)</label>
                <input type="url" name="reunion_url" placeholder="https://meet.google.com/..." class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            </div>
        </section>

        <div>
            <label class="block text-xs font-medium mb-1">Notas internas</label>
            <textarea name="notas" rows="3" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700"></textarea>
        </div>

        <div class="rounded-lg bg-blue-50 border border-blue-200 p-3 text-xs text-blue-900">
            <p> <strong>Automatizaciones:</strong></p>
            <ul class="mt-1 ml-5 list-disc">
                <li>Email de confirmación al instante</li>
                <li>Recordatorio 24h antes</li>
                <li>Recordatorio 1h antes</li>
                <li>Solicitud de feedback 2h después</li>
            </ul>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100 dark:border-neutral-800">
            <a href="/visitas" class="px-4 py-2 rounded-lg border border-slate-200 text-sm">Cancelar</a>
            <button type="submit" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-violet-700 hover:bg-violet-800 text-white text-sm font-medium">
                <i data-lucide="calendar-check" class="h-4 w-4"></i> Programar visita
            </button>
        </div>
    </form>

</div>
</body>
</html>
