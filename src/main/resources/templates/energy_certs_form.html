<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Nuevo CEE</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-xl bg-gradient-to-br from-green-600 to-emerald-900 p-5 mb-5 text-white">
        <h2 class="text-lg font-bold flex items-center gap-2">
            <i data-lucide="leaf" class="h-5 w-5"></i> Nuevo certificado energético
        </h2>
    </div>

    <form method="post" action="/cee/guardar" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 space-y-4">

        <section>
            <h3 class="font-semibold text-sm mb-3 text-emerald-700"> Datos del certificado</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium mb-1">Propiedad *</label>
                    <select name="propiedad_id" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                        <option value="">— Seleccionar —</option>
                        <option th:each="p : ${propiedades}" th:value="${p.get('id')}" th:text="${p.get('direccion')}"
                                th:selected="${p.get('id') == preseleccion}">—</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Nº registro CCAA *</label>
                    <input type="text" name="numero_registro" required class="w-full px-3 py-2 text-sm font-mono border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Fecha emisión *</label>
                    <input type="date" name="fecha_emision" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Fecha caducidad (auto si vacío)</label>
                    <input type="date" name="fecha_caducidad" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
            </div>
        </section>

        <section>
            <h3 class="font-semibold text-sm mb-3 text-emerald-700"> Calificación de consumo</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium mb-1">Letra consumo *</label>
                    <select name="calificacion_consumo" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                        <option value="A">A - Muy eficiente</option><option value="B">B</option><option value="C">C</option>
                        <option value="D">D</option><option value="E">E</option><option value="F">F</option>
                        <option value="G">G - Poco eficiente</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Consumo (kWh/m²·año)</label>
                    <input type="number" step="0.01" name="consumo_kwh_m2_anio" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Letra emisiones *</label>
                    <select name="calificacion_emisiones" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                        <option value="A">A</option><option value="B">B</option><option value="C">C</option>
                        <option value="D">D</option><option value="E">E</option><option value="F">F</option><option value="G">G</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Emisiones (kg CO₂/m²·año)</label>
                    <input type="number" step="0.01" name="emisiones_kg_co2_m2_anio" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
            </div>
        </section>

        <section>
            <h3 class="font-semibold text-sm mb-3 text-emerald-700"> Técnico certificador</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input type="text" name="tecnico_nombre" placeholder="Nombre" class="px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                <input type="text" name="tecnico_titulacion" placeholder="Arquitecto / Ingeniero" class="px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                <input type="text" name="tecnico_colegiado" placeholder="Nº colegiado" class="px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                <input type="number" step="0.01" name="coste" placeholder="Coste €" class="px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            </div>
        </section>

        <section>
            <label class="block text-xs font-medium mb-1">Medidas de mejora recomendadas</label>
            <textarea name="medidas_mejora" rows="3" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700" placeholder="Aislamiento térmico, ventanas, caldera de condensación..."></textarea>
        </section>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100 dark:border-neutral-800">
            <a href="/cee" class="px-4 py-2 rounded-lg border border-slate-200 text-sm">Cancelar</a>
            <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-medium"> Guardar CEE</button>
        </div>
    </form>

</div>
</body>
</html>
