<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Preferencias</title></head>
<body>
<div layout:fragment="content">

    <div class="flex items-center justify-between mb-5">
        <h2 class="text-lg font-bold flex items-center gap-2">
            <i data-lucide="sliders-horizontal" class="h-5 w-5"></i> Preferencias de búsqueda
        </h2>
        <a href="/matches/preferencias/nueva" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-fuchsia-700 hover:bg-fuchsia-800 text-white text-sm font-medium">
            <i data-lucide="plus" class="h-4 w-4"></i> Nueva preferencia
        </a>
    </div>

    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 dark:bg-neutral-800/50 border-b border-slate-200 dark:border-neutral-800">
            <tr class="text-[10px] uppercase tracking-wider text-slate-500">
                <th class="text-left px-4 py-3">Lead</th>
                <th class="text-left px-4 py-3">Operación</th>
                <th class="text-left px-4 py-3">Tipos</th>
                <th class="text-right px-4 py-3">Presupuesto</th>
                <th class="text-left px-4 py-3">Zonas</th>
                <th class="text-left px-4 py-3">Hab</th>
                <th class="text-left px-4 py-3">Auto</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-neutral-800">
            <tr th:each="p : ${preferencias}" class="hover:bg-slate-50 dark:hover:bg-neutral-800/40">
                <td class="px-4 py-3 font-medium" th:text="${p.get('lead') != null ? p.get('lead').get('nombre') : '—'}">—</td>
                <td class="px-4 py-3 text-xs capitalize" th:text="${p.get('operacion')}">—</td>
                <td class="px-4 py-3 text-xs" th:text="${p.get('tipo_propiedad') != null ? #strings.listJoin(p.get('tipo_propiedad'), ', ') : '—'}">—</td>
                <td class="px-4 py-3 text-right font-mono text-xs"
                    th:text="${(p.get('presupuesto_min') ?: 0) + ' – ' + (p.get('presupuesto_max') ?: 0) + ' €'}">—</td>
                <td class="px-4 py-3 text-xs" th:text="${p.get('zonas') != null ? #strings.listJoin(p.get('zonas'), ', ') : '—'}">—</td>
                <td class="px-4 py-3 text-xs" th:text="${(p.get('habitaciones_min') ?: '-') + '/' + (p.get('habitaciones_max') ?: '-')}">—</td>
                <td class="px-4 py-3">
                    <span th:if="${p.get('auto_match')}" class="inline-flex text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">ON</span>
                    <span th:unless="${p.get('auto_match')}" class="inline-flex text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-200 text-slate-600">OFF</span>
                </td>
            </tr>
            <tr th:if="${preferencias.isEmpty()}"><td colspan="7" class="py-12 text-center text-slate-500 text-sm">Sin preferencias registradas.</td></tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
