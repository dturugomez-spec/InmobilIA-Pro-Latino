<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blog · InmobilIA Pro · Guías sobre gestión inmobiliaria en España</title>
    <meta name="description" content="Artículos sobre Ley 12/2023, IRAV, modelos AEAT, fiscal, contratos LAU. Lo que todo propietario y agencia debe saber.">
    <link rel="stylesheet" href="/css/tw.css?v=7a9273c5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-slate-50 min-h-screen">
<header class="bg-white border-b border-slate-200">
    <div class="max-w-4xl mx-auto px-6 h-14 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2"><div class="h-7 w-7 rounded-lg bg-blue-800 flex items-center justify-center"><span class="text-xs"></span></div><span class="font-bold text-sm">InmobilIA Pro</span></a>
        <a href="/login" class="text-sm text-blue-700">Empezar gratis →</a>
    </div>
</header>
<main class="max-w-4xl mx-auto px-6 py-12">
    <div class="text-center mb-10">
        <h1 class="text-4xl font-bold tracking-tight mb-2"> Blog</h1>
        <p class="text-slate-600">Guías prácticas sobre legislación, fiscal y operativa inmobiliaria en España.</p>
    </div>

    <div class="space-y-4">
        <article th:each="p : ${posts}" class="bg-white rounded-xl ring-1 ring-slate-200 p-6 hover:shadow-lg transition-all">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-800" th:text="${p.get('category')}">Cat</span>
                <span class="text-xs text-slate-500 font-mono" th:text="${p.get('date')}">fecha</span>
            </div>
            <h2 class="text-xl font-bold mb-2"><a th:href="@{|/blog/${p.get('slug')}|}" class="hover:text-blue-700" th:text="${p.get('title')}">título</a></h2>
            <p class="text-sm text-slate-600 mb-3" th:text="${p.get('excerpt')}">excerpt</p>
            <a th:href="@{|/blog/${p.get('slug')}|}" class="text-sm text-blue-700 hover:underline font-medium">Leer artículo →</a>
        </article>
    </div>
</main>
</body>
</html>
