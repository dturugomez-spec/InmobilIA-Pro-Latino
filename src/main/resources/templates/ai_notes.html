<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Notas IA</title></head>
<body><div layout:fragment="content">
<div class="rounded-xl bg-gradient-to-br from-purple-700 to-pink-900 p-6 mb-5 text-white">
    <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="sparkles" class="h-6 w-6"></i> Asistente IA</h2>
    <p class="text-sm text-white/80 mt-1">Resúmenes de leads y respuestas sugeridas en 1 clic.</p>
</div>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
        <h3 class="font-semibold text-sm mb-3"> Resumir lead</h3>
        <select id="leadId" class="w-full px-3 py-2 text-sm border rounded mb-2 dark:bg-neutral-800 dark:border-neutral-700">
            <option value="">— Elige un lead —</option>
            <option th:each="l : ${leads}" th:value="${l.get('id')}"
                    th:text="${(l.get('nombre') ?: 'Sin nombre') + (l.get('etapa') != null ? ' · ' + l.get('etapa') : '')}">Lead</option>
        </select>
        <p th:if="${leads.isEmpty()}" class="text-xs text-slate-500 mb-2">Aún no tienes leads. Crea uno o carga los ejemplos.</p>
        <button onclick="resumir()" class="px-4 py-2 rounded bg-purple-700 text-white text-sm w-full"> Generar resumen IA</button>
        <div id="resumen" class="mt-4 p-3 bg-purple-50 rounded text-sm hidden"></div>
    </div>
    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
        <h3 class="font-semibold text-sm mb-3"> Sugerir respuesta</h3>
        <textarea id="msg" rows="4" placeholder="Pega el mensaje del cliente..." class="w-full px-3 py-2 text-sm border rounded mb-2"></textarea>
        <select id="tono" class="w-full px-3 py-2 text-sm border rounded mb-2">
            <option value="profesional">Profesional</option>
            <option value="amigable">Amigable</option>
            <option value="formal">Formal</option>
            <option value="conciso">Conciso</option>
        </select>
        <button onclick="sugerir()" class="px-4 py-2 rounded bg-purple-700 text-white text-sm w-full"> Sugerir respuesta</button>
        <div id="respuesta" class="mt-4 p-3 bg-purple-50 rounded text-sm hidden"></div>
    </div>
</div>
<script>
async function pedir(url, opciones, div, clave) {
    div.classList.remove('hidden'); div.textContent = '⏳ Generando...';
    try {
        const res = await fetch(url, opciones);
        const d = await res.json();
        div.textContent = d[clave] || d.error || 'No se pudo generar. Inténtalo de nuevo.';
    } catch (e) {
        div.textContent = 'No se pudo conectar. Recarga la página e inténtalo de nuevo.';
    }
}
function resumir() {
    const id = document.getElementById('leadId').value;
    if (!id) return alert('Elige un lead');
    pedir('/notas-ia/resumir-lead/' + id, {method: 'POST'}, document.getElementById('resumen'), 'resumen');
}
function sugerir() {
    const mensaje = document.getElementById('msg').value.trim();
    if (!mensaje) return alert('Pega el mensaje del cliente');
    pedir('/notas-ia/sugerir-respuesta', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({mensaje, tono: document.getElementById('tono').value})
    }, document.getElementById('respuesta'), 'respuesta');
}
</script>
</div></body></html>
