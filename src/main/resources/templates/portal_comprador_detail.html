<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Selección del comprador</title></head>
<body><div layout:fragment="content">

<a href="/portal-comprador" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-blue-700 mb-3">
    <i data-lucide="arrow-left" class="h-4 w-4"></i> Volver a selecciones
</a>

<div class="rounded-xl bg-gradient-to-br from-blue-700 to-blue-950 p-6 mb-5 text-white">
    <h2 class="text-xl font-bold flex items-center gap-2">
        <i data-lucide="heart-handshake" class="h-6 w-6"></i> <span th:text="${sel.get('titulo')}">—</span>
    </h2>
    <p class="text-sm text-white/80 mt-1" th:if="${sel.get('comprador_nombre')}" th:text="'Para ' + ${sel.get('comprador_nombre')}">—</p>
</div>

<!-- Enlace compartible -->
<div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 mb-5" x-data="{copied:false}">
    <p class="text-sm font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2 mb-2"><i data-lucide="link" class="h-4 w-4"></i> Enlace para el comprador</p>
    <div class="flex gap-2 flex-wrap">
        <input id="urlC" type="text" readonly th:value="${urlPublica}"
               class="flex-1 min-w-0 px-4 py-3 rounded-lg bg-slate-50 dark:bg-neutral-800 ring-1 ring-slate-200 dark:ring-neutral-700 font-mono text-sm">
        <button @click="navigator.clipboard.writeText(document.getElementById('urlC').value); copied=true; setTimeout(()=>copied=false,2000)"
                class="px-4 py-3 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-sm font-bold whitespace-nowrap flex items-center gap-2">
            <i data-lucide="copy" class="h-4 w-4"></i><span x-text="copied ? '¡Copiado!' : 'Copiar'">Copiar</span>
        </button>
        <a th:href="${urlPublica}" target="_blank" class="px-4 py-3 rounded-lg bg-slate-100 dark:bg-neutral-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-sm font-bold whitespace-nowrap flex items-center gap-2">
            <i data-lucide="external-link" class="h-4 w-4"></i> Ver
        </a>
        <a th:href="${'https://wa.me/?text=' + #uris.escapeQueryParam('Te he preparado una selección de inmuebles: ' + urlPublica)}" target="_blank"
           class="px-4 py-3 rounded-lg bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200 hover:bg-emerald-100 text-sm font-bold whitespace-nowrap"> WhatsApp</a>
    </div>
</div>

<!-- Añadir / sugerir -->
<div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 mb-5">
    <div class="flex flex-wrap items-end gap-3">
        <form th:action="@{|/portal-comprador/${sel.get('id')}/item|}" method="post" class="flex-1 min-w-[240px] flex items-end gap-2">
            <div class="flex-1">
                <label class="block text-xs font-semibold mb-1 text-slate-600">Añadir inmueble de la cartera</label>
                <select name="propiedad_id" required class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm">
                    <option value="" disabled selected>Selecciona...</option>
                    <option th:each="p : ${cartera}" th:value="${p.get('id')}"
                            th:text="${(p.get('name') ?: p.get('address') ?: 'Inmueble') + ' · ' + (p.get('city') ?: '')}">—</option>
                </select>
            </div>
            <button class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-900 text-white text-sm font-bold">+ Añadir</button>
        </form>
        <form th:action="@{|/portal-comprador/${sel.get('id')}/sugerir|}" method="post">
            <button class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-700 text-white text-sm font-bold flex items-center gap-1.5">
                <i data-lucide="sparkles" class="h-4 w-4"></i> Sugerir según presupuesto
            </button>
        </form>
    </div>
</div>

<!-- Items -->
<div th:if="${#lists.isEmpty(items)}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-10 text-center">
    <i data-lucide="home" class="h-10 w-10 mx-auto text-slate-300"></i>
    <p class="mt-3 font-semibold text-slate-600">Selección vacía</p>
    <p class="text-sm text-slate-400 mt-1">Añade inmuebles o usa la sugerencia automática.</p>
</div>

<div class="space-y-3">
    <div th:each="it : ${items}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-4 flex items-center gap-4 flex-wrap">
        <img th:if="${it.get('prop') != null and it.get('prop').get('featured_photo') != null}" th:src="${it.get('prop').get('featured_photo')}"
             class="h-16 w-20 object-cover rounded-lg flex-shrink-0" alt="">
        <div class="flex-1 min-w-0">
            <p class="font-semibold text-sm truncate" th:text="${it.get('prop') != null ? (it.get('prop').get('name') ?: it.get('prop').get('address')) : 'Inmueble'}">—</p>
            <p class="text-xs text-slate-500" th:if="${it.get('prop') != null}"
               th:text="${(it.get('prop').get('city') ?: '') + ' · ' + (it.get('prop').get('current_value') != null ? #numbers.formatInteger(it.get('prop').get('current_value'), 0, 'DEFAULT') + ' ' + mon : '')}">—</p>
            <p th:if="${it.get('comentario')}" class="text-xs text-slate-600 italic mt-1" th:text="' ' + ${it.get('comentario')}">—</p>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
            <span th:switch="${it.get('reaccion')}" class="text-xs font-bold px-2 py-1 rounded-full">
                <span th:case="'favorito'" class="text-rose-700 bg-rose-100 px-2 py-1 rounded-full"> Favorito</span>
                <span th:case="'visita'" class="text-emerald-700 bg-emerald-100 px-2 py-1 rounded-full"> Pide visita</span>
                <span th:case="'descartado'" class="text-slate-500 bg-slate-100 px-2 py-1 rounded-full"> Descartado</span>
                <span th:case="*" class="text-slate-400 bg-slate-50 px-2 py-1 rounded-full">⏳ Sin reaccionar</span>
            </span>
            <form th:action="@{|/portal-comprador/item/${it.get('id')}/eliminar|}" method="post">
                <input type="hidden" name="selId" th:value="${sel.get('id')}">
                <button class="h-8 w-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50" title="Quitar">
                    <i data-lucide="trash-2" class="h-4 w-4"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>

</div></body></html>
