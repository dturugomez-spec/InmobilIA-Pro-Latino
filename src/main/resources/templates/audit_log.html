<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Auditoría</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-xl bg-gradient-to-br from-slate-700 to-slate-950 p-6 mb-5 text-white">
        <h2 class="text-xl font-bold flex items-center gap-2">
            <i data-lucide="shield-check" class="h-6 w-6"></i> Registro de auditoría
        </h2>
        <p class="text-sm text-white/70 mt-1">Quién hizo qué y cuándo · protección de datos</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-4">
            <p class="text-[10px] uppercase text-slate-500">Total eventos</p>
            <p class="text-xl font-bold mt-1" th:text="${logs.size()}">0</p>
        </div>
        <div class="rounded-xl bg-red-50 ring-1 ring-red-200 p-4">
            <p class="text-[10px] uppercase text-red-700">Críticos</p>
            <p class="text-xl font-bold mt-1 text-red-700" th:text="${criticos}">0</p>
        </div>
        <div class="rounded-xl bg-purple-50 ring-1 ring-purple-200 p-4">
            <p class="text-[10px] uppercase text-purple-700">Seguridad</p>
            <p class="text-xl font-bold mt-1 text-purple-700" th:text="${security}">0</p>
        </div>
        <div class="rounded-xl bg-amber-50 ring-1 ring-amber-200 p-4">
            <p class="text-[10px] uppercase text-amber-700">Warnings</p>
            <p class="text-xl font-bold mt-1 text-amber-700" th:text="${warnings}">0</p>
        </div>
    </div>

    <form method="get" action="/auditoria" class="flex flex-wrap gap-2 mb-4">
        <select name="nivel" onchange="this.form.submit()" class="px-3 py-1.5 text-xs border border-slate-200 rounded-lg">
            <option value="">Todos los niveles</option>
            <option value="info">Info</option>
            <option value="warning"> Warning</option>
            <option value="critical"> Crítico</option>
            <option value="security"> Seguridad</option>
        </select>
        <select name="tabla" onchange="this.form.submit()" class="px-3 py-1.5 text-xs border border-slate-200 rounded-lg">
            <option value="">Todas las tablas</option>
            <option th:each="t : ${tablas}" th:value="${t}" th:text="${t}">—</option>
        </select>
        <input type="date" name="desde" onchange="this.form.submit()" class="px-3 py-1.5 text-xs border border-slate-200 rounded-lg">
    </form>

    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 dark:bg-neutral-800/50">
                <tr class="text-[10px] uppercase text-slate-500">
                    <th class="text-left px-3 py-2">Cuándo</th>
                    <th class="text-left px-3 py-2">Quién</th>
                    <th class="text-left px-3 py-2">Acción</th>
                    <th class="text-left px-3 py-2">Sobre</th>
                    <th class="text-left px-3 py-2">Descripción</th>
                    <th class="text-left px-3 py-2">IP</th>
                    <th class="text-left px-3 py-2">Nivel</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-neutral-800">
                <tr th:each="l : ${logs}" class="hover:bg-slate-50 dark:hover:bg-neutral-800/30">
                    <td class="px-3 py-2 font-mono text-[10px] text-slate-500" th:text="${#strings.substring(l.get('created_at'), 0, 19)}">—</td>
                    <td class="px-3 py-2 text-xs">
                        <p th:text="${l.get('actor_nombre') ?: '—'}">—</p>
                        <p class="text-[9px] text-slate-400" th:text="${l.get('actor_rol')}">—</p>
                    </td>
                    <td class="px-3 py-2 text-xs font-semibold capitalize" th:text="${l.get('accion')}">—</td>
                    <td class="px-3 py-2 text-xs font-mono">
                        <span th:text="${l.get('tabla') ?: '—'}">—</span>
                        <span th:if="${l.get('registro_id')}" class="text-[9px] text-slate-400" th:text="${'#' + #strings.substring(l.get('registro_id'),0,8)}">—</span>
                    </td>
                    <td class="px-3 py-2 text-xs" th:text="${l.get('descripcion')}">—</td>
                    <td class="px-3 py-2 font-mono text-[10px] text-slate-500" th:text="${l.get('ip')}">—</td>
                    <td class="px-3 py-2">
                        <span th:switch="${l.get('nivel')}">
                            <span th:case="'info'" class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-blue-50 text-blue-700">INFO</span>
                            <span th:case="'warning'" class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-700"> WARN</span>
                            <span th:case="'critical'" class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-red-100 text-red-700"> CRIT</span>
                            <span th:case="'security'" class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-purple-100 text-purple-700"> SEC</span>
                        </span>
                    </td>
                </tr>
                <tr th:if="${logs.isEmpty()}"><td colspan="7" class="py-8 text-center text-slate-500 text-xs">Sin eventos.</td></tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
