<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Holding</title></head>
<body>
<div layout:fragment="content">
    <form method="post" action="/herramientas/holding" class="form-card">
        <h3>Optimizador de estructura holding</h3>
        <div class="form-grid cols-2">
            <label>Ingresos anuales (EUR) <input type="number" step="0.01" name="ingresosAnuales" required></label>
            <label>Estructura actual
                <select name="estructuraActual">
                    <option>Persona fisica</option>
                    <option>Sociedad Limitada</option>
                </select>
            </label>
        </div>
        <div class="form-actions"><button class="btn btn-primary">Comparar</button></div>
    </form>
    <div class="kpi-grid" th:if="${recomendacion != null}">
        <div class="kpi-card"><div class="kpi-label">IRPF (PF 45%)</div>
            <div class="kpi-value neg" th:text="${#numbers.formatDecimal(pfIrpf,0,'POINT',0,'COMMA')} + ' EUR'">—</div></div>
        <div class="kpi-card"><div class="kpi-label">IS (SL 25%)</div>
            <div class="kpi-value" th:text="${#numbers.formatDecimal(pjIs,0,'POINT',0,'COMMA')} + ' EUR'">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Ahorro potencial</div>
            <div class="kpi-value pos" th:text="${#numbers.formatDecimal(ahorro,0,'POINT',0,'COMMA')} + ' EUR'">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Recomendacion</div>
            <div class="kpi-value" th:text="${recomendacion}">—</div></div>
    </div>

    <div th:replace="~{fragments/official-links :: panel('empresa,holding,fiscal,cif,validador')}"></div>
</div>
</body>
</html>
