<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Future-Proof Score</title></head>
<body>
<div layout:fragment="content">
    <form method="post" action="/herramientas/future-proof" class="form-card">
        <h3>Power Readiness</h3>
        <div class="form-grid cols-3">
            <label>Potencia contratada (kW) <input type="number" step="0.1" name="potenciaKw" required></label>
            <label class="bool-field"><input type="checkbox" name="ampliable" value="true"><span>Ampliable</span></label>
            <label class="bool-field"><input type="checkbox" name="trifasica" value="true"><span>Trifasica</span></label>
            <label class="bool-field"><input type="checkbox" name="preVE" value="true"><span>Pre-instalacion VE</span></label>
            <label class="bool-field"><input type="checkbox" name="placas" value="true"><span>Placas solares</span></label>
            <label class="bool-field"><input type="checkbox" name="bateria" value="true"><span>Bateria</span></label>
        </div>
        <h3>Robotics Readiness</h3>
        <div class="form-grid cols-3">
            <label>Carga suelo (kg/m2) <input type="number" step="0.1" name="cargaSuelo" value="250"></label>
            <label>Altura libre (m) <input type="number" step="0.1" name="alturaLibre" value="2.4"></label>
            <label>Ancho puerta (m) <input type="number" step="0.01" name="anchoPuerta" value="0.80"></label>
            <label class="bool-field"><input type="checkbox" name="wifiMesh" value="true"><span>WiFi mesh</span></label>
            <label class="bool-field"><input type="checkbox" name="ascensor" value="true"><span>Ascensor</span></label>
            <label class="bool-field"><input type="checkbox" name="sinEscalones" value="true"><span>Sin escalones</span></label>
        </div>
        <div class="form-actions"><button class="btn btn-primary">Calcular score</button></div>
    </form>

    <div class="kpi-grid" th:if="${result != null}">
        <div class="kpi-card"><div class="kpi-label">Power</div>
            <div class="kpi-value" th:text="${#numbers.formatDecimal(result.powerReadiness(),0,0)} + '/100'">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Robotics</div>
            <div class="kpi-value" th:text="${#numbers.formatDecimal(result.roboticsReadiness(),0,0)} + '/100'">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Total</div>
            <div class="kpi-value pos" th:text="${#numbers.formatDecimal(result.total(),0,0)} + '/100'">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Rating</div>
            <div class="kpi-value" th:text="${result.rating()}">—</div></div>
    </div>
</div>
</body>
</html>
