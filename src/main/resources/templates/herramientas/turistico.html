<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Turistico vs Largo plazo</title></head>
<body>
<div layout:fragment="content">
    <form method="post" action="/herramientas/turistico" class="form-card">
        <h3>Comparativa turistico vs largo plazo</h3>
        <div class="form-grid cols-3">
            <label>Renta largo plazo (mes) <input type="number" step="0.01" name="rentaLargoPlazoMes" required></label>
            <label>Tarifa diaria turistico <input type="number" step="0.01" name="tarifaDiariaTuristico" required></label>
            <label>Ocupacion (%) <input type="number" step="0.1" name="ocupacionPct" value="65"></label>
            <label>Gastos gestion (%) <input type="number" step="0.1" name="gastosGestion" value="25"></label>
            <label>Limpieza mensual ([[${mon}]]) <input type="number" step="0.01" name="limpiezaMes" value="250"></label>
        </div>
        <div class="form-actions"><button class="btn btn-primary">Comparar</button></div>
    </form>
    <div class="kpi-grid" th:if="${ganador != null}">
        <div class="kpi-card"><div class="kpi-label">Anual largo plazo</div>
            <div class="kpi-value" th:text="${#numbers.formatDecimal(anualLp,0,'DEFAULT',0,'DEFAULT')} + ' ' + ${mon}">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Anual turistico (neto)</div>
            <div class="kpi-value" th:text="${#numbers.formatDecimal(anualTur,0,'DEFAULT',0,'DEFAULT')} + ' ' + ${mon}">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Diferencia</div>
            <div class="kpi-value" th:classappend="${diferencia > 0} ? 'pos' : 'neg'"
                 th:text="${#numbers.formatDecimal(diferencia,0,'DEFAULT',0,'DEFAULT')} + ' ' + ${mon}">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Ganador</div>
            <div class="kpi-value pos" th:text="${ganador}">—</div></div>
    </div>
    <div th:replace="~{fragments/official-links :: panel('turistico,alquiler,lau,mercado,validador')}"></div>
</div>
</body>
</html>
