<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Rentabilidad</title></head>
<body>
<div layout:fragment="content">
    <form method="post" action="/finanzas/yield" class="form-card">
        <h3>Rentabilidad & Yield</h3>
        <div class="form-grid cols-3">
            <label>Precio ([[${mon}]]) <input type="number" step="0.01" name="price" required></label>
            <label>Renta mensual <input type="number" step="0.01" name="rentMonthly" required></label>
            <label>Gastos mensuales <input type="number" step="0.01" name="expensesMonthly" value="0"></label>
            <label>Cuota hipoteca <input type="number" step="0.01" name="mortgageMonthly" value="0"></label>
            <label>Equity aportado <input type="number" step="0.01" name="equity" value="0"></label>
        </div>
        <div class="form-actions"><button class="btn btn-primary">Calcular</button></div>
    </form>

    <div class="kpi-grid" th:if="${out != null}">
        <div class="kpi-card"><div class="kpi-label">Yield bruto</div>
            <div class="kpi-value" th:text="${#numbers.formatDecimal(out.grossYield(),1,2)} + '%'">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Yield neto</div>
            <div class="kpi-value" th:text="${#numbers.formatDecimal(out.netYield(),1,2)} + '%'">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Cap rate</div>
            <div class="kpi-value" th:text="${#numbers.formatDecimal(out.capRate(),1,2)} + '%'">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Cash-on-Cash</div>
            <div class="kpi-value" th:text="${#numbers.formatDecimal(out.cashOnCash(),1,2)} + '%'">—</div></div>
        <div class="kpi-card"><div class="kpi-label">NOI mensual</div>
            <div class="kpi-value" th:text="${#numbers.formatDecimal(out.noiMonthly(),0,'DEFAULT',0,'DEFAULT')} + ' ' + ${mon}">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Cashflow mensual</div>
            <div class="kpi-value" th:classappend="${out.cashflowMonthly() >= 0} ? 'pos' : 'neg'"
                 th:text="${#numbers.formatDecimal(out.cashflowMonthly(),0,'DEFAULT',0,'DEFAULT')} + ' ' + ${mon}">—</div></div>
    </div>
</div>
</body>
</html>
