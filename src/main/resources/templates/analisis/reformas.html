<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Value-Add</title></head>
<body>
<div layout:fragment="content">
    <form method="post" action="/finanzas/reformas" class="form-card">
        <h3>Simulador Value-Add</h3>
        <div class="form-grid cols-3">
            <label>Precio compra <input type="number" step="0.01" name="precioCompra" required></label>
            <label>Coste reforma <input type="number" step="0.01" name="costeReforma" required></label>
            <label>Renta actual (mes) <input type="number" step="0.01" name="rentaActual" required></label>
            <label>Renta post-reforma <input type="number" step="0.01" name="rentaPostReforma" required></label>
            <label>Meses de obra <input type="number" name="mesesObra" value="12"></label>
        </div>
        <div class="form-actions"><button class="btn btn-primary">Calcular</button></div>
    </form>
    <div class="kpi-grid" th:if="${inversion != null}">
        <div class="kpi-card"><div class="kpi-label">Inversion total</div><div class="kpi-value" th:text="${inversion}">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Delta renta anual</div><div class="kpi-value pos" th:text="${deltaRenta}">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Yield pre</div>
            <div class="kpi-value" th:text="${#numbers.formatDecimal(yieldPre,1,2)} + '%'">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Yield post</div>
            <div class="kpi-value pos" th:text="${#numbers.formatDecimal(yieldPost,1,2)} + '%'">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Payback reforma</div>
            <div class="kpi-value" th:text="${#numbers.formatDecimal(paybackAnios,1,1)} + ' anos'">—</div></div>
        <div class="kpi-card"><div class="kpi-label">ROI reforma (10y)</div>
            <div class="kpi-value pos" th:text="${#numbers.formatDecimal(roiReforma,1,0)} + '%'">—</div></div>
    </div>
</div>
</body>
</html>
