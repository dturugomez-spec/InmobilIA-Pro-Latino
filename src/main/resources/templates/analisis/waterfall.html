<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Waterfall</title></head>
<body>
<div layout:fragment="content">
    <form method="post" action="/finanzas/waterfall" class="form-card">
        <h3>Waterfall de distribucion</h3>
        <div class="form-grid cols-3">
            <label>Equity LP (EUR) <input type="number" step="0.01" name="equityLp" required></label>
            <label>Equity GP (EUR) <input type="number" step="0.01" name="equityGp" required></label>
            <label>Preferred return (%) <input type="number" step="0.1" name="preferredRate" value="8"></label>
            <label>Promote GP (%) <input type="number" step="0.1" name="promotePct" value="20"></label>
            <label class="full">Cashflows anuales (separados por coma)
                <input type="text" name="cashflows" placeholder="120000, 125000, 130000, 135000, 1500000" required>
            </label>
        </div>
        <div class="form-actions"><button class="btn btn-primary">Calcular</button></div>
    </form>

    <div th:if="${out != null}">
        <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-label">Total LP</div>
                <div class="kpi-value pos" th:text="${#numbers.formatDecimal(out.totalLp(),0,'POINT',0,'COMMA')} + ' EUR'">—</div></div>
            <div class="kpi-card"><div class="kpi-label">Total GP</div>
                <div class="kpi-value" th:text="${#numbers.formatDecimal(out.totalGp(),0,'POINT',0,'COMMA')} + ' EUR'">—</div></div>
        </div>

        <div class="crud-table-wrap">
            <table class="crud-table">
                <thead><tr><th>Ano</th><th>Cashflow</th><th>LP</th><th>GP</th></tr></thead>
                <tbody>
                <tr th:each="d : ${out.distribuciones()}">
                    <td th:text="${d.get('Ano')}">1</td>
                    <td th:text="${#numbers.formatDecimal(d.get('Cashflow'),0,'POINT',0,'COMMA')}">0</td>
                    <td th:text="${#numbers.formatDecimal(d.get('LP'),0,'POINT',0,'COMMA')}">0</td>
                    <td th:text="${#numbers.formatDecimal(d.get('GP'),0,'POINT',0,'COMMA')}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
