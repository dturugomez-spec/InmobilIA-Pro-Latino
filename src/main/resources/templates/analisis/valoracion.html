<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Valoracion</title></head>
<body>
<div layout:fragment="content">
    <form method="post" action="/finanzas/valoracion" class="form-card">
        <h3>Valoracion multimetodo</h3>
        <div class="form-grid cols-3">
            <label>NOI anual <input type="number" step="0.01" name="noi" required></label>
            <label>Cap rate (%) <input type="number" step="0.01" name="capRatePct" value="5.5"></label>
            <label>m2 <input type="number" step="0.01" name="m2" required></label>
            <label>Precio m2 mercado <input type="number" step="0.01" name="precioM2Mercado" required></label>
            <label>Comparable 1 <input type="number" step="0.01" name="comparable1"></label>
            <label>Comparable 2 <input type="number" step="0.01" name="comparable2"></label>
            <label>Comparable 3 <input type="number" step="0.01" name="comparable3"></label>
        </div>
        <div class="form-actions"><button class="btn btn-primary">Valorar</button></div>
    </form>
    <div class="kpi-grid" th:if="${valorSintesis != null}">
        <div class="kpi-card"><div class="kpi-label">Valor por ingresos</div><div class="kpi-value" th:text="${valorIngresos}">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Valor por mercado</div><div class="kpi-value" th:text="${valorMercado}">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Valor comparables</div><div class="kpi-value" th:text="${valorComparables}">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Valor sintesis</div><div class="kpi-value pos" th:text="${valorSintesis}">—</div></div>
    </div>
</div>
</body>
</html>
