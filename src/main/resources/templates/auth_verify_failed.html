<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificación fallida · InmobilIA Pro</title>
    <link rel="stylesheet" href="/css/tw.css?v=7a9273c5">
    <script src="https://unpkg.com/lucide@1.52.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
    <div class="max-w-md text-center">
        <div class="inline-flex h-16 w-16 rounded-2xl bg-red-100 items-center justify-center mb-6">
            <i data-lucide="alert-circle" class="h-8 w-8 text-red-600"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight mb-2">Verificación no válida</h1>
        <p class="text-sm text-slate-600 mb-6" th:text="${error}">El enlace ha caducado o no es válido.</p>
        <a href="/login" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-blue-800 hover:bg-blue-900 text-white text-sm font-medium">
            <i data-lucide="arrow-left" class="h-4 w-4"></i>
            Volver al login
        </a>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
