<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Staging Digital</title></head>
<body><div layout:fragment="content">
<div class="rounded-xl bg-gradient-to-br from-fuchsia-700 to-pink-900 p-6 mb-5 text-white">
    <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="sofa" class="h-6 w-6"></i> Staging digital</h2>
    <p class="text-sm text-white/80 mt-1">Mobiliario virtual en fotos de pisos vacíos. Vende antes y mejor.</p>
</div>

<form method="post" action="/staging-digital/crear" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 mb-5 max-w-2xl space-y-3">
    <h3 class="font-semibold text-sm"> Nuevo proyecto</h3>
    <input type="text" name="nombre" required placeholder="Nombre del proyecto" class="w-full px-3 py-2 text-sm border rounded">
    <input type="url" name="imagen_original_url" required placeholder="URL imagen original (piso vacío)" class="w-full px-3 py-2 text-sm border rounded">
    <select name="propiedad_id" class="w-full px-3 py-2 text-sm border rounded">
        <option value="">— Propiedad (opcional) —</option>
        <option th:each="p : ${propiedades}" th:value="${p.get('id')}" th:text="${p.get('direccion')}">—</option>
    </select>
    <div class="grid grid-cols-2 gap-2">
        <select name="estilo" required class="px-3 py-2 text-sm border rounded">
            <option value="moderno"> Moderno</option>
            <option value="nordico"> Nórdico</option>
            <option value="industrial"> Industrial</option>
            <option value="clasico"> Clásico</option>
            <option value="minimalista"> Minimalista</option>
            <option value="boho"> Boho</option>
        </select>
        <select name="tipo_habitacion" required class="px-3 py-2 text-sm border rounded">
            <option value="salon">Salón</option>
            <option value="dormitorio">Dormitorio</option>
            <option value="cocina">Cocina</option>
            <option value="bano">Baño</option>
            <option value="terraza">Terraza</option>
            <option value="oficina">Oficina</option>
        </select>
    </div>
    <button class="w-full px-4 py-2 rounded bg-fuchsia-700 text-white text-sm font-medium"> Crear staging IA</button>
</form>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div th:each="p : ${proyectos}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 overflow-hidden">
        <div class="grid grid-cols-2 h-40">
            <div class="bg-slate-200 flex items-center justify-center text-slate-400 text-xs">ANTES<br><img th:if="${p.get('imagen_original_url')}" th:src="${p.get('imagen_original_url')}" class="object-cover w-full h-full"></div>
            <div class="bg-emerald-50 flex items-center justify-center text-emerald-400 text-xs">DESPUÉS<br><img th:if="${p.get('imagen_staged_url')}" th:src="${p.get('imagen_staged_url')}" class="object-cover w-full h-full"></div>
        </div>
        <div class="p-3">
            <p class="font-semibold text-sm" th:text="${p.get('nombre')}">—</p>
            <p class="text-[10px] text-slate-500 mt-1 capitalize">
                <span th:text="${p.get('estilo')}">—</span> · <span th:text="${p.get('tipo_habitacion')}">—</span>
            </p>
            <p class="text-[10px] mt-1">
                <span th:if="${p.get('estado') == 'pendiente'}" class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-700">⏳ Pendiente IA</span>
                <span th:if="${p.get('estado') == 'completado'}" class="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700"> Completo</span>
            </p>
        </div>
    </div>
    <div th:if="${proyectos.isEmpty()}" class="md:col-span-3 py-12 text-center text-slate-500 text-sm">Sin proyectos de staging aún.</div>
</div>
</div></body></html>
