<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Pipeline board</title></head>
<body>
<div layout:fragment="content">

    <a href="/pipelines" class="text-xs text-slate-500 hover:underline flex items-center gap-1 mb-3">
        <i data-lucide="arrow-left" class="h-3.5 w-3.5"></i> Volver a pipelines
    </a>

    <!-- Header con forecast -->
    <div class="rounded-xl bg-gradient-to-br from-teal-700 to-cyan-900 p-5 mb-4 text-white">
        <div class="flex items-start justify-between flex-wrap gap-3">
            <div>
                <h2 class="text-lg font-bold" th:text="${pipeline.get('nombre')}">—</h2>
                <p class="text-xs text-white/70 mt-1" th:text="${pipeline.get('descripcion')}">—</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] uppercase text-white/60">Valor total · Forecast</p>
                <p class="text-lg font-bold">
                    <span class="text-white/90" th:text="${#numbers.formatDecimal(valorTotal, 1, 'DEFAULT', 0, 'DEFAULT')} + ' ' + ${mon}">0</span>
                    <span class="text-emerald-300 ml-2 text-sm">→ <span th:text="${#numbers.formatDecimal(forecast, 1, 'DEFAULT', 0, 'DEFAULT')} + ' ' + ${mon}">0</span></span>
                </p>
            </div>
        </div>
    </div>

    <!-- Tablero horizontal -->
    <div class="overflow-x-auto pb-4">
        <div class="flex gap-3 min-w-max">

            <div th:each="col : ${pipeline.get('columnas')}"
                 class="flex-shrink-0 w-72 rounded-xl bg-slate-50 dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 flex flex-col max-h-[80vh]">

                <!-- Header columna -->
                <div class="p-3 border-b border-slate-200 dark:border-neutral-800">
                    <div class="flex items-center justify-between">
                        <p class="font-semibold text-sm flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full" th:style="|background-color: ${col.get('color')}|"></span>
                            <span th:text="${col.get('label')}">—</span>
                            <span class="text-xs text-slate-500" th:text="'(' + ${contColumna.get(col.get('key')) ?: 0} + ')'">0</span>
                        </p>
                        <button th:data-id="${pipeline.get('id')}" th:data-col="${col.get('key')}" onclick="abrirNuevaCard(this.dataset.id, this.dataset.col)" class="text-slate-400 hover:text-slate-700 text-lg">+</button>
                    </div>
                    <div class="mt-1 flex items-center justify-between text-[10px]">
                        <span class="font-mono text-emerald-700" th:text="${#numbers.formatDecimal(valorColumna.get(col.get('key')) ?: 0, 1, 'DEFAULT', 0, 'DEFAULT')} + ' ' + ${mon}">0</span>
                        <span class="text-slate-400" th:if="${tiempoMedio.get(col.get('key')) != null}" th:text="${tiempoMedio.get(col.get('key'))} + 'h media'">0</span>
                    </div>
                </div>

                <!-- Cards -->
                <div class="flex-1 overflow-y-auto p-2 space-y-2 kanban-column"
                     th:attr="data-columna=${col.get('key')}">
                    <th:block th:each="card : ${cards}" th:if="${card.get('columna_key') == col.get('key')}">
                        <div class="kanban-card bg-white dark:bg-neutral-800 rounded-lg p-3 ring-1 ring-slate-200 dark:ring-neutral-700 hover:shadow cursor-grab active:cursor-grabbing"
                             th:attr="data-id=${card.get('id')}, draggable='true'">

                            <div th:if="${card.get('color_etiqueta')}" class="h-1 rounded-full mb-2" th:style="|background-color: ${card.get('color_etiqueta')}|"></div>

                            <p class="text-sm font-semibold" th:text="${card.get('titulo')}">—</p>
                            <p class="text-xs text-slate-500 mt-0.5" th:text="${card.get('subtitulo')}">—</p>

                            <div th:if="${card.get('valor') != null}" class="mt-2 flex items-center justify-between text-xs">
                                <span class="font-mono font-bold text-emerald-700" th:text="${#numbers.formatDecimal(card.get('valor'), 1, 'DEFAULT', 0, 'DEFAULT')} + ' ' + ${mon}">—</span>
                                <span th:if="${card.get('probabilidad')}" class="text-[10px] px-1.5 py-0.5 rounded bg-blue-100 text-blue-700" th:text="${card.get('probabilidad')} + '%'">—</span>
                            </div>

                            <p th:if="${card.get('fecha_limite')}" class="text-[10px] text-amber-700 mt-2">
                                ⏰ <span th:text="${card.get('fecha_limite')}">—</span>
                            </p>

                            <p th:if="${card.get('notas')}" class="text-[10px] text-slate-400 mt-2 line-clamp-2" th:text="${card.get('notas')}">—</p>

                            <button th:data-id="${card.get('id')}" onclick="archivar(this.dataset.id)" class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500 text-xs"></button>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal nueva card -->
    <div id="modalNew" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onclick="if(event.target===this)cerrarModal()">
        <div class="bg-white dark:bg-neutral-900 rounded-2xl p-5 max-w-md w-full">
            <h3 class="font-bold text-lg mb-3">Nueva tarjeta</h3>
            <form action="/pipelines/cards/crear" method="post" class="space-y-3">
                <input type="hidden" name="pipeline_id" id="newPipelineId">
                <input type="hidden" name="columna_key" id="newColumnaKey">
                <input type="text" name="titulo" placeholder="Título *" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                <input type="text" name="subtitulo" placeholder="Subtítulo" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" name="valor" placeholder="Valor ($)" step="0.01" class="px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                    <input type="number" name="probabilidad" placeholder="% prob." min="0" max="100" class="px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
                <input type="date" name="fecha_limite" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                <textarea name="notas" rows="2" placeholder="Notas..." class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700"></textarea>
                <div class="flex gap-2 justify-end">
                    <button type="button" onclick="cerrarModal()" class="px-4 py-2 rounded-lg border border-slate-200 text-sm">Cancelar</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-teal-700 text-white text-sm font-medium">Crear</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Drag & drop nativo
        document.querySelectorAll('.kanban-card').forEach(card => {
            card.addEventListener('dragstart', e => {
                e.dataTransfer.setData('cardId', card.dataset.id);
                card.classList.add('opacity-50');
            });
            card.addEventListener('dragend', () => card.classList.remove('opacity-50'));
        });

        document.querySelectorAll('.kanban-column').forEach(col => {
            col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('bg-teal-50'); });
            col.addEventListener('dragleave', () => col.classList.remove('bg-teal-50'));
            col.addEventListener('drop', async e => {
                e.preventDefault();
                col.classList.remove('bg-teal-50');
                const cardId = e.dataTransfer.getData('cardId');
                const columna = col.dataset.columna;
                const cardEl = document.querySelector(`[data-id="${cardId}"]`);
                if (cardEl) col.appendChild(cardEl);

                await fetch('/pipelines/cards/' + cardId + '/mover', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ columna, orden: 0 })
                });
            });
        });

        function abrirNuevaCard(pipelineId, columnaKey) {
            document.getElementById('newPipelineId').value = pipelineId;
            document.getElementById('newColumnaKey').value = columnaKey;
            document.getElementById('modalNew').classList.remove('hidden');
        }
        function cerrarModal() { document.getElementById('modalNew').classList.add('hidden'); }

        async function archivar(id) {
            if (!confirm('¿Archivar esta tarjeta?')) return;
            await fetch('/pipelines/cards/' + id + '/archivar', { method: 'POST' });
            location.reload();
        }
    </script>

</div>
</body>
</html>
