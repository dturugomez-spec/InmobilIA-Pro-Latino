<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Reconoce habitaciones IA</title></head>
<body><div layout:fragment="content">
<div class="rounded-xl bg-gradient-to-br from-pink-700 to-rose-900 p-6 mb-5 text-white">
    <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="eye" class="h-6 w-6"></i> Reconocimiento de habitaciones IA</h2>
    <p class="text-sm text-white/80 mt-1">Describe lo que ves o sube fotos. La IA clasifica y sugiere mejoras.</p>
</div>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
        <h3 class="font-semibold text-sm mb-3"> Sube imagen o describe</h3>
        <input type="file" id="img" accept="image/*" class="w-full text-sm mb-3">
        <img id="preview" class="max-h-48 rounded mb-3 hidden">
        <textarea id="desc" rows="4" placeholder="O describe la imagen: 'Salón amplio con ventana al patio, sofá gris, suelo de madera...'" class="w-full px-3 py-2 text-sm border rounded mb-3"></textarea>
        <button onclick="clasificar()" class="w-full px-4 py-2 rounded bg-pink-700 text-white text-sm"> Clasificar con IA</button>
    </div>
    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
        <h3 class="font-semibold text-sm mb-3"> Resultado IA</h3>
        <pre id="resultado" class="text-xs bg-slate-50 p-3 rounded overflow-auto max-h-96">Sube imagen o describe...</pre>
    </div>
</div>
<script>
document.getElementById('img').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        document.getElementById('preview').src = ev.target.result;
        document.getElementById('preview').classList.remove('hidden');
    };
    reader.readAsDataURL(file);
});

async function clasificar() {
    const descripcion = document.getElementById('desc').value;
    if (!descripcion) return alert('Describe la imagen');
    document.getElementById('resultado').textContent = '⏳ Clasificando...';
    const res = await fetch('/reconocer-habitaciones/clasificar', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({descripcion})
    });
    const d = await res.json();
    document.getElementById('resultado').textContent = d.resultado || d.error;
}
</script>
</div></body></html>
