<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Reconoce habitaciones IA</title></head>
<body><div layout:fragment="content">
<div class="rounded-xl bg-gradient-to-br from-pink-700 to-rose-900 p-6 mb-5 text-white">
    <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="eye" class="h-6 w-6"></i> Reconocimiento de habitaciones IA</h2>
    <p class="text-sm text-white/80 mt-1">Sube la foto de una estancia: la IA la mira, dice qué es, en qué estado está y qué mejorar antes de publicarla. Cada análisis gasta 1 crédito de IA.</p>
</div>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
        <h3 class="font-semibold text-sm mb-3">Foto de la estancia</h3>
        <input type="file" id="img" accept="image/jpeg,image/png,image/webp" class="w-full text-sm mb-3">
        <img id="preview" class="max-h-48 rounded mb-3 hidden" alt="Vista previa">
        <label for="desc" class="block text-xs text-slate-500 mb-1">Nota opcional (o, sin foto, describe la estancia)</label>
        <textarea id="desc" rows="3" placeholder="Ej.: es el salón principal, da a la calle" class="w-full px-3 py-2 text-sm border rounded mb-3 dark:bg-neutral-800 dark:border-neutral-700"></textarea>
        <button id="btn" onclick="clasificar()" class="w-full px-4 py-2 rounded bg-pink-700 hover:bg-pink-800 text-white text-sm">Analizar con IA</button>
    </div>
    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
        <h3 class="font-semibold text-sm mb-3">Resultado</h3>
        <div id="resultado" class="text-sm text-slate-500">Sube una foto para empezar.</div>
    </div>
</div>
<script>
let imagen = null;

/** Reduce la foto a 1280 px de lado mayor (JPEG): menos espera y menos datos móviles. */
function reducir(file) {
    return new Promise((ok, ko) => {
        const img = new Image();
        img.onload = () => {
            const k = Math.min(1, 1280 / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(img.src);
            ok(c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => ko(new Error('No se pudo leer la imagen'));
        img.src = URL.createObjectURL(file);
    });
}

document.getElementById('img').addEventListener('change', async e => {
    const file = e.target.files[0];
    imagen = null;
    if (!file) return;
    try {
        imagen = await reducir(file);
        const p = document.getElementById('preview');
        p.src = imagen; p.classList.remove('hidden');
    } catch (err) { alert(err.message); }
});

const NOMBRES = { salon:'Salón', dormitorio:'Dormitorio', cocina:'Cocina', bano:'Baño', terraza:'Terraza', garaje:'Garaje',
    trastero:'Trastero', jardin:'Jardín', fachada:'Fachada', otro:'Otra estancia',
    reformada:'Reformada', para_reformar:'Para reformar', en_buen_estado:'En buen estado', nueva:'Nueva',
    buena:'Buena', mejorable:'Mejorable', mala:'Mala' };
const nombre = v => NOMBRES[v] || v || '—';

function el(tag, cls, txt) { const x = document.createElement(tag); if (cls) x.className = cls; if (txt != null) x.textContent = txt; return x; }
function lista(titulo, items) {
    const box = el('div', 'mt-4');
    box.appendChild(el('div', 'text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1', titulo));
    const ul = el('ul', 'list-disc pl-5 space-y-1 text-slate-700 dark:text-neutral-300');
    (items || []).forEach(t => ul.appendChild(el('li', null, t)));
    if (!ul.children.length) ul.appendChild(el('li', null, '—'));
    box.appendChild(ul);
    return box;
}

async function clasificar() {
    const descripcion = document.getElementById('desc').value.trim();
    if (!imagen && !descripcion) return alert('Sube una foto o describe la estancia');
    const out = document.getElementById('resultado'), btn = document.getElementById('btn');
    out.textContent = 'Analizando…'; btn.disabled = true;
    try {
        const res = await fetch('/reconocer-habitaciones/clasificar', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ descripcion, imagen })
        });
        const d = await res.json();
        out.textContent = '';
        if (!d.ok) { out.appendChild(el('p', 'text-red-600', d.error || 'No se pudo analizar')); return; }
        if (!d.resultado) { out.appendChild(el('p', 'whitespace-pre-line text-slate-700 dark:text-neutral-300', d.texto)); return; }
        const r = d.resultado;
        const chips = el('div', 'flex flex-wrap gap-2');
        const datos = [ ['Estancia', nombre(r.tipo_habitacion)], ['Estado', nombre(r.estado)] ];
        if (r.calidad_foto) datos.push(['Foto', nombre(r.calidad_foto)]);
        datos.forEach(([k, v]) => chips.appendChild(el('span', 'px-2 py-1 rounded bg-pink-50 dark:bg-pink-900/30 text-pink-800 dark:text-pink-200 text-xs font-medium', k + ': ' + v)));
        out.appendChild(chips);
        out.appendChild(lista('Lo que se ve', r.caracteristicas_detectadas));
        out.appendChild(lista('Qué mejorar antes de publicar', r.sugerencias));
        if (!d.conFoto) out.appendChild(el('p', 'mt-4 text-xs text-slate-400', 'Análisis hecho solo con la descripción escrita.'));
    } catch (err) {
        out.textContent = 'No se pudo conectar. Inténtalo de nuevo.';
    } finally { btn.disabled = false; }
}
</script>
</div></body></html>
