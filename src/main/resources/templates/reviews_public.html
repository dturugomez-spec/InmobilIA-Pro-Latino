<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Deja tu review - InmobilIA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-amber-50 to-yellow-50 min-h-screen flex items-center justify-center p-4">

<div class="max-w-lg w-full bg-white rounded-2xl shadow-xl p-8">

    <div th:if="${gracias}" class="text-center">
        <div class="text-6xl mb-4"></div>
        <h1 class="text-2xl font-bold text-emerald-700">¡Gracias por tu opinión!</h1>
        <p class="text-slate-600 mt-2">Tu review ha sido enviada y será revisada antes de publicarse.</p>
    </div>

    <div th:if="${error}" class="text-center">
        <p class="text-red-600" th:text="${error}">—</p>
    </div>

    <div th:if="${review != null and !gracias and !error}">
        <h1 class="text-2xl font-bold text-slate-900 mb-2"> Tu opinión cuenta</h1>
        <p class="text-slate-600 text-sm mb-6">Hola <strong th:text="${review.get('autor_nombre')}">—</strong>, gracias por dedicarnos 30 segundos.</p>

        <form th:action="@{|/reviews/publico/${review.get('solicitud_token')}|}" method="post" class="space-y-4">

            <div>
                <label class="block text-sm font-medium mb-2">¿Cómo valoras nuestro servicio?</label>
                <div class="flex justify-between gap-2" x-data="{n: 5}">
                    <label class="flex-1 cursor-pointer" th:each="i : ${#numbers.sequence(1, 5)}">
                        <input type="radio" name="puntuacion" th:value="${i}" required class="sr-only peer" th:checked="${i == 5}">
                        <span class="block text-center py-4 rounded-lg border-2 border-slate-200 peer-checked:border-amber-500 peer-checked:bg-amber-50 hover:border-amber-300">
                            <span class="text-2xl block" th:text="${i == 1 ? '' : (i == 2 ? '' : (i == 3 ? '' : (i == 4 ? '' : '')))}"></span>
                            <span class="text-xs text-slate-500 mt-1 block" th:text="${i}">1</span>
                        </span>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">¿Tu rol?</label>
                <select name="autor_rol" class="w-full px-3 py-2 text-sm border-2 border-slate-200 rounded-lg">
                    <option value="comprador">Compré una propiedad</option>
                    <option value="vendedor">Vendí una propiedad</option>
                    <option value="inquilino">Alquilé una propiedad</option>
                    <option value="propietario">Tengo mi inmueble con ellos</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Título (opcional)</label>
                <input type="text" name="titulo" placeholder="Excelente servicio..." class="w-full px-3 py-2 text-sm border-2 border-slate-200 rounded-lg">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Tu opinión *</label>
                <textarea name="comentario" required rows="5" placeholder="Cuéntanos tu experiencia..." class="w-full px-3 py-2 text-sm border-2 border-slate-200 rounded-lg"></textarea>
            </div>

            <button type="submit" class="w-full px-4 py-3 rounded-lg bg-gradient-to-r from-amber-500 to-yellow-600 text-white font-bold">
                 Enviar review
            </button>
        </form>
    </div>
</div>

</body>
</html>
