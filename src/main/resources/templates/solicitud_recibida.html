<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Solicitud recibida</title>
<link rel="stylesheet" href="/css/tw.css?v=7a9273c5"></head>
<body class="bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4">
<div class="max-w-lg bg-white rounded-2xl shadow-2xl p-10 text-center">
    <div th:if="${solicitud_ok}">
        <div class="text-6xl mb-4"></div>
        <h1 class="text-3xl font-black mb-3">¡Solicitud enviada, <span th:text="${nombre}">amigo</span>!</h1>
        <p class="text-slate-600 mb-6">
            Hemos recibido tu solicitud y te enviaremos un email con las credenciales en
            <strong>menos de 24h laborables</strong>.
        </p>
        <p class="text-sm text-slate-500 mb-8">Revisa tu bandeja de entrada (y la carpeta de spam por si acaso).</p>
        <a href="/" class="inline-block px-6 py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold">← Volver a la web</a>
    </div>
    <div th:if="${error}" class="text-red-600">
        <div class="text-6xl mb-4"></div>
        <h1 class="text-2xl font-bold mb-2">Algo salió mal</h1>
        <p class="text-slate-600" th:text="${error}">—</p>
        <a href="/" class="inline-block mt-6 text-blue-600">← Volver</a>
    </div>
</div></body></html>
