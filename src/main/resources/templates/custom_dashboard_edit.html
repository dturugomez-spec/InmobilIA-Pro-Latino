<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Editar dashboard</title></head>
<body>
<div layout:fragment="content" x-data="dashboardEditor()">

    <div class="rounded-xl bg-gradient-to-br from-violet-700 to-purple-900 p-5 mb-5 text-white">
        <h2 class="text-lg font-bold"> Editar dashboard</h2>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-5">

        <!-- Editor -->
        <div class="lg:col-span-3 space-y-4">
            <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 space-y-3">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" x-model="dash.nombre" placeholder="Nombre" class="px-3 py-2 text-base font-semibold border border-slate-200 rounded-lg">
                    <input type="text" x-model="dash.icono" placeholder="" maxlength="2" class="px-3 py-2 text-2xl border border-slate-200 rounded-lg">
                </div>
                <input type="text" x-model="dash.descripcion" placeholder="Descripción" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg">
            </div>

            <!-- Widgets -->
            <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
                <h3 class="font-semibold text-sm mb-3"> Widgets actuales</h3>
                <div class="grid grid-cols-12 gap-2">
                    <template x-for="(w, idx) in dash.widgets" :key="w.id">
                        <div :class="`col-span-${w.w} bg-slate-50 rounded-lg p-3 border-l-4`" :style="`border-color: ${w.color}`">
                            <div class="flex items-center justify-between mb-1">
                                <input type="text" x-model="w.titulo" class="flex-1 text-xs font-semibold bg-transparent border-b border-transparent focus:border-slate-300 outline-none">
                                <button @click="dash.widgets.splice(idx, 1)" class="text-red-500 text-xs"></button>
                            </div>
                            <div class="flex items-center gap-1 text-[10px] text-slate-500">
                                <span x-text="w.tipo"></span>
                                <span>·</span>
                                <select x-model="w.w" class="text-[10px] bg-transparent border-none">
                                    <option value="3">3 col</option><option value="4">4 col</option>
                                    <option value="6">6 col</option><option value="12">Full</option>
                                </select>
                            </div>
                        </div>
                    </template>
                    <p x-show="dash.widgets.length === 0" class="col-span-12 text-center text-xs text-slate-400 py-8">Añade widgets desde el lateral →</p>
                </div>
            </div>

            <div class="flex justify-end gap-2">
                <a href="/dashboards" class="px-4 py-2 rounded-lg border border-slate-200 text-sm">Cancelar</a>
                <button @click="guardar()" class="px-4 py-2 rounded-lg bg-purple-700 hover:bg-purple-800 text-white text-sm font-medium"> Guardar</button>
            </div>
        </div>

        <!-- Catálogo widgets -->
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-4">
            <h3 class="font-semibold text-sm mb-3"> Añadir widget</h3>
            <p class="text-[10px] text-slate-500 mb-3">Click para añadir al dashboard</p>

            <div class="space-y-2">
                <template x-for="opt in catalogo">
                    <button @click="addWidget(opt)" class="w-full text-left p-2 rounded-lg border-l-4 hover:bg-slate-50 transition" :style="`border-color: ${opt.color}`">
                        <p class="text-xs font-semibold" x-text="opt.titulo"></p>
                        <p class="text-[10px] text-slate-500" x-text="'campo: ' + opt.campo"></p>
                    </button>
                </template>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const dashData = /*[[${dashboard}]]*/ {};

        function dashboardEditor() {
            return {
                dash: Object.assign({widgets: []}, dashData),
                catalogo: [
                    {tipo: 'kpi', campo: 'kpi_propiedades', titulo: ' Propiedades', color: '#3b82f6'},
                    {tipo: 'kpi', campo: 'kpi_leads', titulo: ' Leads', color: '#8b5cf6'},
                    {tipo: 'kpi', campo: 'kpi_leads_hot', titulo: ' Leads HOT', color: '#ef4444'},
                    {tipo: 'kpi', campo: 'kpi_leads_nuevos', titulo: ' Leads nuevos', color: '#06b6d4'},
                    {tipo: 'kpi', campo: 'kpi_visitas_mes', titulo: ' Visitas mes', color: '#ec4899'},
                    {tipo: 'kpi', campo: 'kpi_facturado_mes', titulo: ' Facturado mes', color: '#10b981'},
                    {tipo: 'kpi', campo: 'kpi_tareas_pendientes', titulo: ' Tareas', color: '#f59e0b'},
                    {tipo: 'kpi', campo: 'kpi_contratos', titulo: ' Contratos', color: '#06b6d4'},
                    {tipo: 'kpi', campo: 'kpi_matches_nuevos', titulo: ' Matches', color: '#ec4899'}
                ],
                addWidget(opt) {
                    this.dash.widgets.push({
                        id: Math.random().toString(36).substring(2, 10),
                        tipo: opt.tipo, campo: opt.campo, titulo: opt.titulo,
                        color: opt.color, w: 3, h: 2
                    });
                },
                async guardar() {
                    const res = await fetch('/dashboards/guardar', {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify(this.dash)
                    });
                    const d = await res.json();
                    if (d.ok) location.href = '/dashboards/' + d.id;
                }
            }
        }
    </script>

</div>
</body>
</html>
