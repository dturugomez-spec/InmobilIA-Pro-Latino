<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>NPS</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
    <div th:if="${gracias}" class="text-center"><div class="text-6xl mb-3"></div><h1 class="text-2xl font-bold text-emerald-700">¡Gracias!</h1></div>
    <div th:if="${error}" class="text-center text-red-600"> Enlace no válido</div>
    <div th:if="${r != null and !gracias}">
        <h1 class="text-xl font-bold mb-2">¿Nos recomendarías?</h1>
        <p class="text-sm text-slate-600 mb-5">Del 0 (nada) al 10 (totalmente), ¿qué probabilidad hay de que recomiendes nuestros servicios?</p>
        <form th:action="@{|/nps/responder/${r.get('token')}|}" method="post" class="space-y-3">
            <div class="grid grid-cols-11 gap-1">
                <label th:each="i : ${#numbers.sequence(0,10)}" class="cursor-pointer">
                    <input type="radio" name="puntuacion" th:value="${i}" required class="sr-only peer">
                    <span class="block text-center py-2 rounded border-2 border-slate-200 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 font-bold text-sm" th:text="${i}">0</span>
                </label>
            </div>
            <textarea name="comentario" rows="3" placeholder="Comentario (opcional)" class="w-full px-3 py-2 text-sm border-2 border-slate-200 rounded-lg"></textarea>
            <button type="submit" class="w-full px-4 py-3 rounded-lg bg-emerald-700 text-white font-bold">Enviar</button>
        </form>
    </div>
</div></body></html>
