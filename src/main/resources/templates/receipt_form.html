<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Nuevo recibo</title></head>
<body>
<div layout:fragment="content">
<form action="/receipts" method="post" class="max-w-3xl mx-auto space-y-4">

    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-6">
        <h2 class="font-semibold text-base mb-4 flex items-center gap-2"><i data-lucide="receipt" class="h-5 w-5 text-brand-600"></i> Recibo de alquiler</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div>
                <label class="block text-sm font-medium mb-1">Serie</label>
                <input type="text" name="serie" value="R" maxlength="3" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700 font-mono">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Fecha emisión</label>
                <input type="date" name="fecha_emision" th:value="${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Período</label>
                <div class="flex gap-2">
                    <input type="number" name="period_month" min="1" max="12" placeholder="MM" class="w-1/2 px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700 font-mono">
                    <input type="number" name="period_year" min="2020" max="2100" placeholder="YYYY" class="w-1/2 px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700 font-mono">
                </div>
            </div>
        </div>
    </div>

    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-6">
        <h3 class="font-semibold text-sm mb-3 text-slate-700">Inquilino y propiedad</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-medium mb-1">Inquilino</label>
                <input type="text" name="inquilino_nombre" required list="inq-list" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                <datalist id="inq-list"><option th:each="i : ${inquilinos}" th:value="${i.get('name')}"></option></datalist>
            </div>
            <div>
                <label class="block text-xs font-medium mb-1">NIF inquilino</label>
                <input type="text" name="inquilino_nif" class="w-full px-3 py-2 text-sm font-mono border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            </div>
            <div class="md:col-span-2">
                <label class="block text-xs font-medium mb-1">Propiedad</label>
                <input type="text" name="property_name" list="prop-list" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                <datalist id="prop-list"><option th:each="p : ${propiedades}" th:value="${p.get('name')}"></option></datalist>
            </div>
            <div class="md:col-span-2">
                <label class="block text-xs font-medium mb-1">Concepto</label>
                <input type="text" name="concepto" placeholder="Alquiler vivienda · Mayo 2026" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            </div>
        </div>
    </div>

    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-6">
        <h3 class="font-semibold text-sm mb-3 text-slate-700">Importes</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div>
                <label class="block text-xs font-medium mb-1">Importe ([[${mon}]]) *</label>
                <input type="number" step="0.01" name="importe" required class="w-full px-3 py-2 text-sm font-mono border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            </div>
            <div>
                <label class="block text-xs font-medium mb-1">Retención IRPF (%)</label>
                <select name="irpf_pct" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                    <option value="0">Sin retención</option>
                    <option value="19" selected>19% · Persona física (típico)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium mb-1">Método pago</label>
                <select name="metodo_pago" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                    <option>Transferencia</option><option>Domiciliación</option><option>Efectivo</option><option>Bizum</option>
                </select>
            </div>
        </div>
    </div>

    <div class="flex justify-end gap-2">
        <a href="/receipts" class="px-4 py-2 rounded-lg bg-white ring-1 ring-slate-200 hover:bg-slate-50 text-sm">Cancelar</a>
        <button type="submit" class="inline-flex items-center gap-1.5 px-5 py-2 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-sm font-semibold shadow-card">
            <i data-lucide="save" class="h-4 w-4"></i> Crear recibo
        </button>
    </div>
</form>
</div>
</body>
</html>
