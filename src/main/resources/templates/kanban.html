<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Pipeline Kanban</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>
<div layout:fragment="content">

    <!-- Toolbar -->
    <div class="flex flex-wrap items-center gap-2 mb-4">
        <a th:href="${kanbanType == 'leads' ? '/crud/leads/new' : '/crud/oportunidades/new'}"
           class="inline-flex items-center gap-2 px-3.5 py-2 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-sm font-medium transition-colors shadow-card"
           th:if="${canWrite}">
            <i data-lucide="plus" class="h-4 w-4"></i>
            <span th:text="${kanbanType == 'leads' ? 'Nuevo lead' : 'Nueva oportunidad'}">Nuevo</span>
        </a>

        <div class="flex items-center bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-700 rounded-lg p-0.5">
            <a th:href="${kanbanType == 'leads' ? '/crud/leads' : '/crud/oportunidades'}"
               class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-neutral-800 transition-colors">
                <i data-lucide="list" class="h-3.5 w-3.5"></i>
                <span>Lista</span>
            </a>
            <button class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium bg-brand-100 dark:bg-brand-950/50 text-brand-800 dark:text-brand-300">
                <i data-lucide="kanban" class="h-3.5 w-3.5"></i>
                <span>Pipeline</span>
            </button>
        </div>

        <div class="ml-auto flex items-center gap-3 text-xs text-slate-500 dark:text-neutral-400">
            <span class="inline-flex items-center gap-1.5">
                <i data-lucide="info" class="h-3.5 w-3.5"></i>
                <span>Arrastra las tarjetas entre columnas para cambiar de etapa</span>
            </span>
        </div>
    </div>

    <!-- Tablero Kanban -->
    <div class="flex gap-3 overflow-x-auto pb-4 scroll-thin"
         th:attr="data-type=${kanbanType},data-can-write=${canWrite}">
        <div th:each="etapa : ${etapas}"
             th:attr="data-stage=${etapa}"
             class="flex-shrink-0 w-72 flex flex-col rounded-xl bg-slate-100 dark:bg-neutral-900/60 ring-1 ring-slate-200 dark:ring-neutral-800">

            <!-- Header columna -->
            <div class="px-3 py-3 border-b border-slate-200 dark:border-neutral-800">
                <div class="flex items-center justify-between mb-1.5">
                    <div class="flex items-center gap-2">
                        <span class="h-2 w-2 rounded-full"
                              th:classappend="${etapa == 'Nuevo' ? 'bg-blue-500' : (etapa == 'Contactado' or etapa == 'Análisis' ? 'bg-cyan-500' : (etapa == 'Visita' or etapa == 'Negociación' ? 'bg-amber-500' : (etapa == 'Oferta' ? 'bg-purple-500' : (etapa == 'Cerrado' ? 'bg-emerald-500' : 'bg-slate-400'))))}"></span>
                        <h3 class="text-sm font-semibold" th:text="${etapa}">Etapa</h3>
                    </div>
                    <span class="text-xs font-mono font-semibold text-slate-500 dark:text-neutral-400 bg-white dark:bg-neutral-800 px-1.5 py-0.5 rounded"
                          th:text="${byEtapa.get(etapa).size()}">0</span>
                </div>
                <div class="text-[11px] text-slate-500 dark:text-neutral-400 font-mono"
                     th:if="${presupuestoEtapa.get(etapa) != null and presupuestoEtapa.get(etapa) > 0}"
                     th:text="${#numbers.formatDecimal(presupuestoEtapa.get(etapa),0,'POINT',0,'COMMA')} + ' € total'">— €</div>
            </div>

            <!-- Tarjetas -->
            <div class="kanban-column flex-1 overflow-y-auto scroll-thin p-2 space-y-2 min-h-[200px]"
                 th:attr="data-stage=${etapa}">

                <th:block th:if="${kanbanType == 'leads'}">
                    <a th:each="r : ${byEtapa.get(etapa)}"
                       th:href="@{|/entity/lead/${r.get('id')}|}"
                       th:attr="data-id=${r.get('id')}"
                       class="kanban-card block p-3 rounded-lg bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 hover:shadow-card-lg transition-all cursor-grab active:cursor-grabbing">
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <div class="flex items-center gap-2 min-w-0">
                                <div class="h-7 w-7 rounded-md bg-gradient-to-br from-brand-600 to-brand-800 text-white flex items-center justify-center text-xs font-bold flex-shrink-0"
                                     th:text="${r.get('nombre') != null ? #strings.toUpperCase(#strings.substring(r.get('nombre'),0,1)) : 'L'}">L</div>
                                <div class="font-medium text-sm truncate" th:text="${r.get('nombre')}">nombre</div>
                            </div>
                            <span th:if="${r.get('score') != null and r.get('score') >= 70}" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-400 flex-shrink-0"></span>
                        </div>
                        <div class="text-xs text-slate-600 dark:text-slate-400 line-clamp-2 mb-2" th:text="${r.get('interes') ?: r.get('zona') ?: '—'}">interés</div>
                        <div class="flex items-center justify-between text-[11px]">
                            <span class="font-mono font-semibold text-slate-700 dark:text-slate-300" th:text="${r.get('presupuesto') != null ? r.get('presupuesto') + ' €' : '—'}">— €</span>
                            <span class="text-slate-400" th:text="${r.get('origen') ?: ''}">origen</span>
                        </div>
                        <div class="text-[10px] text-slate-400 mt-1.5 flex items-center gap-1" th:if="${r.get('next_followup')}">
                            <i data-lucide="calendar" class="h-2.5 w-2.5"></i>
                            <span th:text="${'Seguim. ' + #strings.substring(r.get('next_followup'),0,10)}">—</span>
                        </div>
                    </a>
                </th:block>

                <th:block th:if="${kanbanType == 'oportunidades'}">
                    <a th:each="r : ${byEtapa.get(etapa)}"
                       th:href="@{|/crud/oportunidades/${r.get('id')}/edit|}"
                       th:attr="data-id=${r.get('id')}"
                       class="kanban-card block p-3 rounded-lg bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 hover:shadow-card-lg transition-all cursor-grab active:cursor-grabbing">
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <div class="font-semibold text-sm truncate" th:text="${r.get('property_name')}">propiedad</div>
                            <span th:if="${r.get('priority') != null and #strings.equalsIgnoreCase(r.get('priority'),'Alta')}"
                                  class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-100 dark:bg-red-950/40 text-red-700 dark:text-red-400 flex-shrink-0">!</span>
                        </div>
                        <div class="text-xs text-slate-600 dark:text-slate-400 mb-2" th:text="${(r.get('city') ?: '') + ' · ' + (r.get('type') ?: '')}">ubicación</div>
                        <div class="flex items-center justify-between text-[11px]">
                            <span class="font-mono font-semibold text-slate-700 dark:text-slate-300" th:text="${r.get('price') != null ? r.get('price') + ' €' : '—'}">— €</span>
                            <span class="text-slate-400 font-mono" th:if="${r.get('cap_rate')}" th:text="${r.get('cap_rate') + '%'}">—</span>
                        </div>
                        <div class="text-[10px] text-slate-400 mt-1.5 truncate" th:text="${r.get('source') ?: ''}">origen</div>
                    </a>
                </th:block>

                <!-- Empty -->
                <div class="text-center py-8 text-xs text-slate-400 dark:text-neutral-500" th:if="${byEtapa.get(etapa).isEmpty()}">
                    Sin tarjetas en esta etapa
                </div>
            </div>
        </div>
    </div>

</div>

<script th:inline="javascript">
/*<![CDATA[*/
const kanbanType = /*[[${kanbanType}]]*/ 'leads';
const canWrite = /*[[${canWrite}]]*/ false;

document.addEventListener('DOMContentLoaded', () => {
    if (!canWrite) return;
    document.querySelectorAll('.kanban-column').forEach(col => {
        new Sortable(col, {
            group: 'kanban',
            animation: 180,
            ghostClass: 'opacity-30',
            chosenClass: 'ring-2',
            dragClass: 'rotate-1',
            onEnd: async (evt) => {
                const card = evt.item;
                const id = card.dataset.id;
                const newStage = evt.to.dataset.stage;
                const oldStage = evt.from.dataset.stage;
                if (newStage === oldStage) return;
                try {
                    const res = await fetch(`/kanban/${kanbanType}/${id}/move`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ stage: newStage })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        if (window.toast) window.toast(`Movido a "${newStage}"`, 'ok');
                    } else {
                        if (window.toast) window.toast('Error: ' + (data.error || 'no se pudo guardar'), 'err');
                        evt.from.appendChild(card); // revertir
                    }
                } catch (e) {
                    console.error(e);
                    if (window.toast) window.toast('Error de red al actualizar', 'err');
                    evt.from.appendChild(card);
                }
            }
        });
    });
});
/*]]>*/
</script>
</body>
</html>
