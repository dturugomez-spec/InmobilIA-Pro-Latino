<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Referido - InmobilIA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-fuchsia-50 to-pink-50 min-h-screen flex items-center justify-center p-4">

<div class="max-w-lg w-full bg-white rounded-2xl shadow-xl overflow-hidden">
    <div class="bg-gradient-to-r from-fuchsia-600 to-pink-700 p-6 text-white text-center">
        <div class="text-5xl mb-2">🎁</div>
        <h1 class="text-2xl font-bold">¡Tienes una recomendación!</h1>
    </div>

    <div class="p-6">
        <div th:if="${error}" class="text-red-600 text-center" th:text="${error}">—</div>

        <div th:if="${registrado}" class="text-center">
            <div class="text-5xl mb-3">✅</div>
            <h2 class="text-xl font-bold text-emerald-700">¡Registro completado!</h2>
            <p class="text-slate-600 mt-2">Te contactaremos en menos de 24h.</p>
        </div>

        <div th:if="${ref != null and !registrado and !error}">
            <p class="text-sm text-slate-700">Te recomienda: <strong th:text="${ref.get('referente_nombre')}">—</strong></p>
            <p class="text-sm text-slate-600 mt-2">Si haces una operación con nosotros:</p>

            <div th:if="${cfg != null}" class="my-4 p-4 bg-gradient-to-r from-amber-50 to-yellow-50 border-2 border-amber-200 rounded-lg">
                <p class="text-xs uppercase tracking-wider text-amber-700 mb-1">🎁 Tu premio</p>
                <p class="font-bold text-amber-900" th:text="${cfg.get('premio_referido')}">—</p>
            </div>

            <form th:action="@{|/referidos/codigo/${ref.get('codigo')}/usar|}" method="post" class="space-y-3 mt-5">
                <h3 class="font-bold text-slate-900">📝 Déjanos tus datos</h3>
                <input type="text" name="nombre" required placeholder="Tu nombre *" class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg">
                <input type="email" name="email" required placeholder="Email *" class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg">
                <input type="tel" name="telefono" placeholder="Teléfono" class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg">
                <button type="submit" class="w-full px-4 py-3 rounded-lg bg-gradient-to-r from-fuchsia-600 to-pink-700 text-white font-bold">
                    ✨ Quiero información
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
