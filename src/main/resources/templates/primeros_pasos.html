<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Primeros pasos</title></head>
<body><div layout:fragment="content">

<div class="rounded-xl bg-gradient-to-br from-brand-700 to-brand-950 p-6 mb-5 text-white">
    <h2 class="text-xl font-bold flex items-center gap-2">
        <i data-lucide="rocket" class="h-6 w-6"></i> Primeros pasos
    </h2>
    <p class="text-sm text-white/80 mt-1">Deja tu InmobilIA lista en unos minutos. Completa estos pasos para empezar a captar y vender desde el día 1.</p>

    <!-- Progreso -->
    <div class="mt-4">
        <div class="flex items-center justify-between text-sm mb-1">
            <span th:text="${hechos} + ' de ' + ${total} + ' completados'">0 de 6</span>
            <span class="font-bold" th:text="${pct} + '%'">0%</span>
        </div>
        <div class="h-2.5 rounded-full bg-white/20 overflow-hidden">
            <div class="h-full rounded-full bg-white transition-all" th:style="'width:' + ${pct} + '%'"></div>
        </div>
    </div>
</div>

<div th:if="${pct == 100}" class="rounded-xl bg-emerald-50 ring-1 ring-emerald-200 p-5 mb-5 text-center">
    <p class="text-2xl"></p>
    <p class="font-bold text-emerald-800 mt-1">¡Todo listo! Tu InmobilIA está configurada al completo.</p>
</div>

<div class="space-y-3">
    <div th:each="p : ${pasos}"
         class="rounded-xl bg-white dark:bg-neutral-900 ring-1 p-5 flex items-center gap-4"
         th:classappend="${#bools.isTrue(p.get('hecho')) ? 'ring-emerald-200' : 'ring-slate-200 dark:ring-neutral-800'}">
        <div class="h-10 w-10 rounded-full flex items-center justify-center flex-shrink-0 text-lg"
             th:classappend="${#bools.isTrue(p.get('hecho')) ? 'bg-emerald-100' : 'bg-slate-100 dark:bg-neutral-800'}">
            <span th:if="${p.get('hecho')}"></span>
            <span th:unless="${p.get('hecho')}" th:text="${p.get('icono')}">•</span>
        </div>
        <div class="flex-1 min-w-0">
            <p class="font-semibold" th:classappend="${#bools.isTrue(p.get('hecho')) ? 'text-slate-400 line-through' : 'text-slate-900 dark:text-white'}" th:text="${p.get('titulo')}">—</p>
            <p class="text-sm text-slate-500" th:text="${p.get('desc')}">—</p>
        </div>
        <a th:unless="${p.get('hecho')}" th:href="${p.get('link')}"
           class="px-4 py-2 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-sm font-bold whitespace-nowrap flex-shrink-0">Hacer →</a>
        <a th:if="${p.get('hecho')}" th:href="${p.get('link')}"
           class="px-3 py-2 rounded-lg text-slate-400 hover:text-slate-600 text-sm font-medium whitespace-nowrap flex-shrink-0">Revisar</a>
    </div>
</div>

<script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>

</div></body></html>
