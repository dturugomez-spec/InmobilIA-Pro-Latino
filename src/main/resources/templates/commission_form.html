<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Nueva comisión</title></head>
<body>
<div layout:fragment="content">
<form action="/commissions" method="post" class="max-w-2xl mx-auto bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 rounded-xl p-6 space-y-4"
      x-data="{ value: 0, pct: 3, get amount() { return Math.round(this.value * this.pct / 100 * 100) / 100; } }">

    <h2 class="font-semibold text-base">Nueva comisión</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
            <label class="block text-sm font-medium mb-1">Comercial *</label>
            <input type="text" name="agent_name" required list="agents" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            <datalist id="agents"><option th:each="m : ${members}" th:value="${m.get('name') ?: m.get('email')}"></option></datalist>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Tipo *</label>
            <select name="operation_type" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                <option value="venta"> Venta</option>
                <option value="alquiler"> Alquiler</option>
                <option value="gestión"> Gestión / mantenimiento</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Propiedad</label>
            <input type="text" name="property_name" list="props" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
            <datalist id="props"><option th:each="p : ${propiedades}" th:value="${p.get('name')}"></option></datalist>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Cliente</label>
            <input type="text" name="client_name" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Fecha operación</label>
            <input type="date" name="operation_date" th:value="${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Estado</label>
            <select name="status" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                <option>Pendiente</option><option>Pagada</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Valor operación (€) *</label>
            <input type="number" step="0.01" name="operation_value" x-model.number="value" required class="w-full px-3 py-2 text-sm font-mono border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">% comisión</label>
            <input type="number" step="0.1" name="commission_pct" x-model.number="pct" class="w-full px-3 py-2 text-sm font-mono border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
        </div>
    </div>

    <!-- Preview -->
    <div class="rounded-lg bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 p-3 flex items-center justify-between">
        <span class="text-sm font-semibold text-emerald-800">Comisión a pagar:</span>
        <span class="text-2xl font-bold font-mono text-emerald-700" x-text="amount.toLocaleString('es-ES', {minimumFractionDigits:2}) + ' €'">0 €</span>
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Notas</label>
        <textarea name="notes" rows="2" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700"></textarea>
    </div>

    <div class="flex justify-end gap-2 pt-2">
        <a href="/commissions" class="px-4 py-2 rounded-lg bg-white ring-1 ring-slate-200 hover:bg-slate-50 text-sm">Cancelar</a>
        <button type="submit" class="inline-flex items-center gap-1.5 px-5 py-2 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-sm font-semibold shadow-card">
            <i data-lucide="save" class="h-4 w-4"></i> Crear comisión
        </button>
    </div>
</form>
</div>
</body>
</html>
