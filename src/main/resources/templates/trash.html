<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Papelera</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-xl bg-amber-50 dark:bg-amber-950/30 ring-1 ring-amber-200 dark:ring-amber-900/40 p-4 mb-5 flex items-start gap-3">
        <i data-lucide="trash-2" class="h-5 w-5 text-amber-600 flex-shrink-0 mt-0.5"></i>
        <div class="text-sm">
            <p class="font-semibold text-amber-900 dark:text-amber-200">Items eliminados (últimos 30 días)</p>
            <p class="text-amber-800 dark:text-amber-300">Los registros se guardan aquí 30 días antes de eliminarse permanentemente. Puedes restaurarlos en cualquier momento.</p>
        </div>
    </div>

    <div class="flex items-center gap-2 mb-4" th:if="${!rows.isEmpty()}">
        <form action="/trash/empty" method="post" onsubmit="return confirm('¿Vaciar toda la papelera permanentemente? No se podrá recuperar.')">
            <button type="submit" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-sm font-medium">
                <i data-lucide="trash" class="h-4 w-4"></i> Vaciar papelera
            </button>
        </form>
    </div>

    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 dark:bg-neutral-800/50 border-b border-slate-200 dark:border-neutral-800">
                <tr class="text-[10px] uppercase tracking-wider text-slate-500">
                    <th class="text-left px-4 py-3">Tipo</th>
                    <th class="text-left px-4 py-3">Eliminado por</th>
                    <th class="text-left px-4 py-3">Fecha</th>
                    <th class="text-left px-4 py-3">Caduca</th>
                    <th class="text-right px-4 py-3">Acciones</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-neutral-800">
                <tr th:each="t : ${rows}" class="hover:bg-slate-50 dark:hover:bg-neutral-800/40">
                    <td class="px-4 py-3">
                        <span class="inline-flex items-center gap-1.5 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-neutral-800" th:text="${t.get('table_name')}">tabla</span>
                    </td>
                    <td class="px-4 py-3" th:text="${t.get('actor_name') ?: '—'}">—</td>
                    <td class="px-4 py-3 font-mono text-xs text-slate-500" th:text="${t.get('deleted_at') != null ? #strings.substring(t.get('deleted_at'),0,10) : '—'}">—</td>
                    <td class="px-4 py-3 font-mono text-xs text-slate-500" th:text="${t.get('expires_at') != null ? #strings.substring(t.get('expires_at'),0,10) : '—'}">—</td>
                    <td class="px-4 py-3 text-right">
                        <form th:action="@{|/trash/${t.get('id')}/restore|}" method="post" class="inline">
                            <button type="submit" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium text-emerald-700 hover:bg-emerald-50">
                                <i data-lucide="rotate-ccw" class="h-3 w-3"></i> Restaurar
                            </button>
                        </form>
                        <form th:action="@{|/trash/${t.get('id')}/delete|}" method="post" class="inline" onsubmit="return confirm('Eliminar permanentemente?')">
                            <button type="submit" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium text-red-700 hover:bg-red-50">
                                <i data-lucide="trash" class="h-3 w-3"></i> Borrar
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${rows.isEmpty()}">
                    <td colspan="5" class="py-12 text-center text-slate-500 text-sm">Papelera vacía </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
