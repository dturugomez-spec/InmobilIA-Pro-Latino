<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Agenda y calendario</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/es.global.min.js"></script>
    <style>
        /* Override estilos de FullCalendar para alinearlos al design system */
        .fc { --fc-border-color: rgb(226 232 240); --fc-page-bg-color: transparent; font-family: 'Inter', system-ui, sans-serif; }
        .dark .fc { --fc-border-color: rgb(38 38 38); }
        .fc .fc-toolbar.fc-header-toolbar { margin-bottom: 1rem; }
        .fc .fc-toolbar-title { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.025em; }
        .fc .fc-button { background: white; border: 1px solid rgb(226 232 240); color: rgb(51 65 85); font-weight: 500; font-size: 0.8125rem; padding: 0.4rem 0.75rem; border-radius: 0.5rem; box-shadow: 0 1px 2px rgb(0 0 0 / 0.04); transition: all 0.15s; text-transform: capitalize; }
        .fc .fc-button:hover { background: rgb(248 250 252); border-color: rgb(203 213 225); }
        .fc .fc-button-primary:not(:disabled).fc-button-active, .fc .fc-button-primary:not(:disabled):active { background: rgb(30 64 175); border-color: rgb(30 58 138); color: white; box-shadow: 0 0 0 4px rgb(59 130 246 / 0.15); }
        .dark .fc .fc-button { background: rgb(23 23 23); border-color: rgb(38 38 38); color: rgb(212 212 216); }
        .dark .fc .fc-button:hover { background: rgb(38 38 38); }
        .fc .fc-daygrid-day-number, .fc .fc-col-header-cell-cushion { padding: 6px 8px; color: rgb(51 65 85); font-size: 0.8125rem; font-weight: 500; }
        .dark .fc .fc-daygrid-day-number, .dark .fc .fc-col-header-cell-cushion { color: rgb(212 212 216); }
        .fc .fc-day-today { background: rgb(239 246 255) !important; }
        .dark .fc .fc-day-today { background: rgb(23 37 84 / 0.3) !important; }
        .fc-event { border-radius: 4px !important; padding: 2px 4px !important; font-size: 0.7rem !important; font-weight: 500 !important; cursor: pointer; }
        .fc .fc-col-header-cell-cushion { text-transform: uppercase; font-size: 0.65rem !important; letter-spacing: 0.05em; color: rgb(100 116 139); }
        .dark .fc .fc-col-header-cell-cushion { color: rgb(148 163 184); }
    </style>
</head>
<body>
<div layout:fragment="content">

    <!-- Leyenda y filtros -->
    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-4 mb-4">
        <div class="flex items-center justify-between flex-wrap gap-3">
            <div class="flex items-center gap-3 flex-wrap">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-neutral-400">Tipos de evento</span>
                <span class="inline-flex items-center gap-1.5 text-xs"><span class="h-2.5 w-2.5 rounded bg-blue-500"></span> Visitas</span>
                <span class="inline-flex items-center gap-1.5 text-xs"><span class="h-2.5 w-2.5 rounded bg-purple-500"></span> Eventos</span>
                <span class="inline-flex items-center gap-1.5 text-xs"><span class="h-2.5 w-2.5 rounded bg-amber-500"></span> Fin contrato</span>
                <span class="inline-flex items-center gap-1.5 text-xs"><span class="h-2.5 w-2.5 rounded bg-red-500"></span> Mantenim.</span>
                <span class="inline-flex items-center gap-1.5 text-xs"><span class="h-2.5 w-2.5 rounded bg-slate-500"></span> Tareas</span>
                <span class="inline-flex items-center gap-1.5 text-xs"><span class="h-2.5 w-2.5 rounded bg-cyan-500"></span> Leads</span>
            </div>
            <div class="flex items-center gap-2">
                <a href="/crud/eventos/new" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-xs font-medium transition-colors">
                    <i data-lucide="plus" class="h-3.5 w-3.5"></i> Nuevo evento
                </a>
                <a href="/crud/reservas/new" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white dark:bg-neutral-800 hover:bg-slate-50 dark:hover:bg-neutral-700 ring-1 ring-slate-200 dark:ring-neutral-700 text-slate-700 dark:text-slate-200 text-xs font-medium transition-colors">
                    <i data-lucide="map-pin" class="h-3.5 w-3.5"></i> Nueva visita
                </a>
            </div>
        </div>
    </div>

    <!-- Calendario -->
    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
        <div id="calendar"></div>
    </div>

    <!-- Modal detalle evento -->
    <div x-data="{ open: false, ev: {} }" @open-event.window="ev = $event.detail; open = true"
         x-show="open" @keydown.escape.window="open = false"
         class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm" x-cloak>
        <div @click.outside="open = false"
             class="bg-white dark:bg-neutral-900 rounded-xl ring-1 ring-slate-200 dark:ring-neutral-800 shadow-card-xl w-full max-w-md overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 dark:border-neutral-800 flex items-center justify-between">
                <h3 class="font-semibold text-base" x-text="ev.title || 'Evento'">Evento</h3>
                <button @click="open = false" class="p-1 rounded text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">
                    <i data-lucide="x" class="h-4 w-4"></i>
                </button>
            </div>
            <div class="p-5 space-y-3 text-sm">
                <div class="flex justify-between"><span class="text-slate-500 dark:text-neutral-400">Fecha</span><span class="font-mono" x-text="ev.start"></span></div>
                <template x-if="ev.props">
                    <div class="space-y-2.5 pt-2 border-t border-slate-200 dark:border-neutral-800">
                        <template x-for="(val, key) in ev.props">
                            <div class="flex justify-between gap-3" x-show="val">
                                <span class="text-slate-500 dark:text-neutral-400 capitalize" x-text="key"></span>
                                <span class="text-right truncate" x-text="val"></span>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
            <div class="px-5 py-3 border-t border-slate-200 dark:border-neutral-800 flex justify-end">
                <button @click="open = false" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-neutral-800 hover:bg-slate-200 dark:hover:bg-neutral-700 text-sm font-medium transition-colors">Cerrar</button>
            </div>
        </div>
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    if (!calendarEl) return;

    const calendar = new FullCalendar.Calendar(calendarEl, {
        locale: 'es',
        initialView: 'dayGridMonth',
        height: 'auto',
        firstDay: 1,
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
        },
        buttonText: { today: 'Hoy', month: 'Mes', week: 'Semana', day: 'Día', list: 'Lista' },
        events: '/calendar/events',
        eventDisplay: 'block',
        eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
        dayMaxEvents: 3,
        moreLinkText: n => '+' + n + ' más',
        eventClick: function(info) {
            info.jsEvent.preventDefault();
            window.dispatchEvent(new CustomEvent('open-event', {
                detail: {
                    title: info.event.title,
                    start: info.event.start ? info.event.start.toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '',
                    props: info.event.extendedProps
                }
            }));
        },
        loading: function(isLoading) {
            calendarEl.style.opacity = isLoading ? '0.5' : '1';
        }
    });

    calendar.render();
});
</script>
</body>
</html>
