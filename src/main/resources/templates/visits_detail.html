<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Detalle visita</title></head>
<body>
<div layout:fragment="content">

    <a href="/visitas" class="text-xs text-slate-500 hover:underline flex items-center gap-1 mb-4">
        <i data-lucide="arrow-left" class="h-3.5 w-3.5"></i> Volver
    </a>

    <div class="rounded-xl bg-gradient-to-br from-violet-700 to-indigo-900 p-6 mb-5 text-white">
        <div class="flex items-start justify-between flex-wrap gap-3">
            <div>
                <p class="text-xs text-white/70 uppercase tracking-wider">Visita</p>
                <h2 class="text-xl font-bold mt-1" th:text="${visita.get('visitante_nombre')}">—</h2>
                <p class="text-sm text-white/80 mt-2 font-mono" th:text="${#strings.substring(visita.get('fecha_inicio'), 0, 16)}">—</p>
                <p class="text-xs text-white/70 mt-1" th:text="${visita.get('propiedad') != null ? ' ' + visita.get('propiedad').get('direccion') : '—'}">—</p>
            </div>
            <div class="text-right">
                <span th:switch="${visita.get('estado')}" class="inline-flex text-xs font-bold px-3 py-1 rounded-full">
                    <span th:case="'programada'" class="bg-amber-100 text-amber-900 px-3 py-1 rounded-full"> Programada</span>
                    <span th:case="'confirmada'" class="bg-blue-100 text-blue-900 px-3 py-1 rounded-full"> Confirmada</span>
                    <span th:case="'realizada'" class="bg-emerald-100 text-emerald-900 px-3 py-1 rounded-full"> Realizada</span>
                    <span th:case="'cancelada'" class="bg-slate-200 text-slate-700 px-3 py-1 rounded-full"> Cancelada</span>
                    <span th:case="'no_presentado'" class="bg-red-100 text-red-900 px-3 py-1 rounded-full"> No presentado</span>
                </span>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

        <!-- Datos visitante -->
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
            <h3 class="font-semibold text-sm mb-3"> Visitante</h3>
            <dl class="space-y-2 text-sm">
                <div class="flex justify-between"><dt class="text-slate-500">Nombre:</dt><dd class="font-medium" th:text="${visita.get('visitante_nombre')}">—</dd></div>
                <div class="flex justify-between"><dt class="text-slate-500">DNI:</dt><dd class="font-mono text-xs" th:text="${visita.get('visitante_dni') ?: '—'}">—</dd></div>
                <div class="flex justify-between"><dt class="text-slate-500">Email:</dt><dd class="text-xs" th:text="${visita.get('visitante_email') ?: '—'}">—</dd></div>
                <div class="flex justify-between"><dt class="text-slate-500">Teléfono:</dt><dd class="font-mono text-xs" th:text="${visita.get('visitante_telefono') ?: '—'}">—</dd></div>
            </dl>
            <div th:if="${visita.get('visitante_telefono')}" class="mt-3 flex gap-2">
                <a th:href="${'tel:' + visita.get('visitante_telefono')}" class="flex-1 px-3 py-2 rounded bg-blue-50 text-blue-700 text-xs text-center"> Llamar</a>
                <a th:href="${'https://wa.me/' + visita.get('visitante_telefono')}" target="_blank" class="flex-1 px-3 py-2 rounded bg-emerald-50 text-emerald-700 text-xs text-center"> WhatsApp</a>
            </div>
        </div>

        <!-- Acciones rápidas -->
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
            <h3 class="font-semibold text-sm mb-3"> Acciones</h3>
            <div class="space-y-2">
                <form th:if="${visita.get('estado') != 'cancelada' and visita.get('estado') != 'realizada'}" method="post" th:action="@{|/visitas/${visita.get('id')}/estado|}">
                    <input type="hidden" name="estado" value="confirmada">
                    <button class="w-full px-3 py-2 rounded bg-blue-100 hover:bg-blue-200 text-blue-700 text-sm"> Marcar confirmada</button>
                </form>
                <form method="post" th:action="@{|/visitas/${visita.get('id')}/estado|}">
                    <input type="hidden" name="estado" value="realizada">
                    <button class="w-full px-3 py-2 rounded bg-emerald-100 hover:bg-emerald-200 text-emerald-700 text-sm"> Marcar realizada</button>
                </form>
                <form method="post" th:action="@{|/visitas/${visita.get('id')}/estado|}">
                    <input type="hidden" name="estado" value="no_presentado">
                    <button class="w-full px-3 py-2 rounded bg-red-100 hover:bg-red-200 text-red-700 text-sm"> No se presentó</button>
                </form>
                <form method="post" th:action="@{|/visitas/${visita.get('id')}/estado|}" onsubmit="this.querySelector('[name=motivo]').value = prompt('Motivo:') || ''">
                    <input type="hidden" name="estado" value="cancelada">
                    <input type="hidden" name="motivo">
                    <button class="w-full px-3 py-2 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm"> Cancelar</button>
                </form>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-100 dark:border-neutral-800 text-xs">
                <p class="font-semibold mb-2"> Enlaces públicos</p>
                <p class="text-slate-500 mb-1">Confirmación:</p>
                <input type="text" readonly th:value="${baseUrl + '/visitas/confirmar/' + visita.get('confirmacion_token')}" class="w-full px-2 py-1 text-[10px] font-mono border border-slate-200 rounded dark:bg-neutral-800 dark:border-neutral-700 mb-2">
                <p class="text-slate-500 mb-1">Feedback:</p>
                <input type="text" readonly th:value="${baseUrl + '/visitas/feedback-publico/' + visita.get('feedback_token')}" class="w-full px-2 py-1 text-[10px] font-mono border border-slate-200 rounded dark:bg-neutral-800 dark:border-neutral-700">
            </div>
        </div>

        <!-- Feedback agente (post-visita) -->
        <div class="lg:col-span-2 rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
            <h3 class="font-semibold text-sm mb-3"> Feedback de la visita</h3>
            <form method="post" th:action="@{|/visitas/${visita.get('id')}/feedback|}" class="space-y-3">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium mb-1">Nivel de interés del visitante (1-5)</label>
                        <select name="interes_nivel" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                            <option value="1"> 1 - Muy bajo</option>
                            <option value="2"> 2 - Bajo</option>
                            <option value="3" th:selected="${visita.get('interes_nivel') == 3}"> 3 - Medio</option>
                            <option value="4" th:selected="${visita.get('interes_nivel') == 4}"> 4 - Alto</option>
                            <option value="5" th:selected="${visita.get('interes_nivel') == 5}"> 5 - Muy alto</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1">Siguiente paso</label>
                        <select name="siguiente_paso" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                            <option value="">— Sin definir —</option>
                            <option value="segunda_visita" th:selected="${visita.get('siguiente_paso') == 'segunda_visita'}">2ª visita</option>
                            <option value="oferta" th:selected="${visita.get('siguiente_paso') == 'oferta'}">Hacer oferta</option>
                            <option value="reserva" th:selected="${visita.get('siguiente_paso') == 'reserva'}">Reservar</option>
                            <option value="descartado" th:selected="${visita.get('siguiente_paso') == 'descartado'}">Descartado</option>
                            <option value="sin_decision" th:selected="${visita.get('siguiente_paso') == 'sin_decision'}">Sin decisión</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Observaciones (agente)</label>
                    <textarea name="feedback_agente" rows="3" th:text="${visita.get('feedback_agente')}" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Objeciones del visitante</label>
                    <textarea name="objeciones" rows="2" th:text="${visita.get('objeciones')}" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Fecha siguiente paso</label>
                    <input type="date" name="fecha_siguiente_paso" th:value="${visita.get('fecha_siguiente_paso')}" class="px-3 py-2 text-sm border border-slate-200 rounded-lg dark:bg-neutral-800 dark:border-neutral-700">
                </div>
                <button class="px-4 py-2 rounded-lg bg-violet-700 hover:bg-violet-800 text-white text-sm font-medium">
                     Guardar feedback
                </button>
            </form>

            <div th:if="${visita.get('feedback_visitante')}" class="mt-4 pt-3 border-t border-slate-100 dark:border-neutral-800">
                <p class="text-xs font-semibold mb-1 text-emerald-700"> Feedback del visitante:</p>
                <p class="text-sm bg-emerald-50 p-3 rounded" th:text="${visita.get('feedback_visitante')}">—</p>
            </div>
        </div>
    </div>

</div>
</body>
</html>
