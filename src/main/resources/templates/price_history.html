<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Histórico precios</title></head>
<body>
<div layout:fragment="content">

    <a href="/propiedades" class="text-xs text-slate-500 hover:underline flex items-center gap-1 mb-3">
        <i data-lucide="arrow-left" class="h-3.5 w-3.5"></i> Volver
    </a>

    <div class="rounded-xl bg-gradient-to-br from-indigo-700 to-blue-900 p-6 mb-5 text-white">
        <h2 class="text-xl font-bold flex items-center gap-2">
            <i data-lucide="trending-up" class="h-6 w-6"></i> Histórico de precios
        </h2>
        <p class="text-sm text-white/80 mt-1" th:text="${propiedad.get('direccion')}">—</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-4">
            <p class="text-[10px] uppercase text-slate-500">Precio original</p>
            <p class="text-xl font-bold mt-1" th:text="${#numbers.formatDecimal(precioOriginal, 1, 'POINT', 0, 'COMMA')} + ' €'">0</p>
        </div>
        <div class="rounded-xl bg-blue-50 ring-1 ring-blue-200 p-4">
            <p class="text-[10px] uppercase text-blue-700">Precio actual</p>
            <p class="text-xl font-bold mt-1 text-blue-700" th:text="${#numbers.formatDecimal(precioActual, 1, 'POINT', 0, 'COMMA')} + ' €'">0</p>
        </div>
        <div class="rounded-xl" th:classappend="${cambioTotal >= 0 ? 'bg-emerald-50 ring-1 ring-emerald-200' : 'bg-red-50 ring-1 ring-red-200'}" class="p-4">
            <p class="text-[10px] uppercase" th:classappend="${cambioTotal >= 0 ? 'text-emerald-700' : 'text-red-700'}">Cambio total</p>
            <p class="text-xl font-bold mt-1" th:classappend="${cambioTotal >= 0 ? 'text-emerald-700' : 'text-red-700'}"
               th:text="${(cambioTotal >= 0 ? '+' : '') + #numbers.formatDecimal(cambioTotal, 1, 'POINT', 0, 'COMMA')} + ' €'">0</p>
        </div>
        <div class="rounded-xl" th:classappend="${cambioPct >= 0 ? 'bg-emerald-50 ring-1 ring-emerald-200' : 'bg-red-50 ring-1 ring-red-200'}" class="p-4">
            <p class="text-[10px] uppercase">% variación</p>
            <p class="text-xl font-bold mt-1" th:classappend="${cambioPct >= 0 ? 'text-emerald-700' : 'text-red-700'}"
               th:text="${(cambioPct >= 0 ? '+' : '') + #numbers.formatDecimal(cambioPct, 1, 1)} + '%'">0</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <!-- Gráfico -->
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
            <h3 class="font-semibold text-sm mb-3"> Evolución</h3>
            <canvas id="priceChart" height="200"></canvas>
        </div>

        <!-- Tabla -->
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 overflow-hidden">
            <div class="p-4 border-b border-slate-100 dark:border-neutral-800">
                <h3 class="font-semibold text-sm"> Cambios registrados</h3>
            </div>
            <table class="w-full text-sm">
                <thead class="bg-slate-50 dark:bg-neutral-800/50">
                <tr class="text-[10px] uppercase text-slate-500">
                    <th class="text-left px-3 py-2">Fecha</th>
                    <th class="text-right px-3 py-2">Anterior</th>
                    <th class="text-right px-3 py-2">Nuevo</th>
                    <th class="text-right px-3 py-2">Δ%</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-neutral-800">
                <tr th:each="h : ${historico}">
                    <td class="px-3 py-2 font-mono text-xs" th:text="${#strings.substring(h.get('created_at'),0,10)}">—</td>
                    <td class="px-3 py-2 text-right font-mono text-xs" th:text="${#numbers.formatDecimal(h.get('precio_anterior') ?: 0, 1, 'POINT', 0, 'COMMA')} + ' €'">—</td>
                    <td class="px-3 py-2 text-right font-mono text-xs font-bold" th:text="${#numbers.formatDecimal(h.get('precio_nuevo'), 1, 'POINT', 0, 'COMMA')} + ' €'">—</td>
                    <td class="px-3 py-2 text-right font-mono text-xs"
                        th:classappend="${h.get('diferencia_pct') != null and h.get('diferencia_pct').doubleValue() >= 0 ? 'text-emerald-700' : 'text-red-700'}"
                        th:text="${h.get('diferencia_pct') != null ? (h.get('diferencia_pct').doubleValue() >= 0 ? '+' : '') + #numbers.formatDecimal(h.get('diferencia_pct'), 1, 1) + '%' : '—'}">—</td>
                </tr>
                <tr th:if="${historico.isEmpty()}"><td colspan="4" class="py-8 text-center text-slate-500 text-xs">Sin cambios registrados.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        const historico = /*[[${historico}]]*/ [];
        const precioOriginal = /*[[${precioOriginal}]]*/ 0;
        const precioActual = /*[[${precioActual}]]*/ 0;

        const labels = ['Original'];
        const data = [precioOriginal];
        for (const h of historico) {
            labels.push((h.created_at || '').substring(5, 10));
            data.push(h.precio_nuevo);
        }
        if (historico.length === 0) {
            labels.push('Actual');
            data.push(precioActual);
        }

        new Chart(document.getElementById('priceChart'), {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: 'Precio (€)',
                    data,
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59,130,246,0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                scales: { y: { ticks: { callback: v => new Intl.NumberFormat('es-ES').format(v) + ' €' } } }
            }
        });
    </script>

</div>
</body>
</html>
