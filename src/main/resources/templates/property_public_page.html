<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${p != null ? p.get('name') + ' · ' + (ms?.get('nombre_publico') ?: '') : 'Propiedad'}">Propiedad</title>
<meta name="description" th:if="${p != null}" th:content="${p.get('type') + ' en ' + p.get('city') + ' por ' + (p.get('current_value') ?: p.get('purchase_price')) + ' ' + mon}">
<meta property="og:title" th:if="${p != null}" th:content="${p.get('name')}">
<link rel="canonical" th:if="${canonical != null}" th:href="${canonical}">
<meta name="robots" content="index,follow">
<meta property="og:url" th:if="${canonical != null}" th:content="${canonical}">
<meta property="og:type" content="website">
<meta property="og:image" th:if="${p != null and p.get('featured_photo') != null}" th:content="${p.get('featured_photo')}">
<meta property="og:price:amount" th:if="${p != null}" th:content="${p.get('current_value') ?: p.get('purchase_price')}">
<meta property="og:price:currency" content="EUR">
<script type="application/ld+json" th:if="${p != null}" th:inline="text">
{
  "@context": "https://schema.org",
  "@type": "RealEstateListing",
  "name": "[[${p.get('name')}]]",
  "description": "[[${p.get('notes')}]]",
  "datePosted": "[[${p.get('created_at')}]]",
  "offers": {
    "@type": "Offer",
    "price": [[${p.get('current_value') ?: (p.get('purchase_price') ?: 0)}]],
    "priceCurrency": ((window.MON||''))
  }
}
</script>
<link rel="stylesheet" href="/css/tw.css?v=7a9273c5">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Inter', sans-serif; color: #0f172a; }
    .display { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.02em; }
    .brand-grad { background: linear-gradient(135deg, #1d4ed8 0%, #172554 100%); }
</style></head>
<body class="bg-slate-50">

<div th:if="${error}" class="min-h-screen flex items-center justify-center">
    <p class="text-slate-600" th:text="${error}">—</p>
</div>

<div th:if="${gracias}" class="min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl p-12 text-center max-w-md">
        <div class="text-6xl mb-4"></div>
        <h1 class="display text-2xl font-extrabold text-emerald-700">¡Mensaje enviado!</h1>
        <p class="text-slate-600 mt-2">Te contactaremos en menos de 24h.</p>
    </div>
</div>

<div th:if="${p != null and gracias == null and error == null}">
    <header class="bg-white shadow-sm py-4 px-6 sticky top-0 z-10">
    <script th:inline="javascript">window.MON = /*[[${mon}]]*/ 'MXN'; window.LOC = /*[[${pais != null ? pais.locale().toLanguageTag() : 'es'}]]*/ 'es-MX';</script>
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <p class="display font-extrabold" th:text="${ms?.get('nombre_publico') ?: (agente?.get('nombre') ?: 'Inmobiliaria')}">—</p>
            <a th:if="${agente?.get('telefono') != null and agente.get('telefono') != ''}" th:href="${'tel:' + agente.get('telefono')}" class="text-sm font-bold text-blue-700">
                 <span th:text="${agente.get('telefono')}">—</span>
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
            <!-- Galería -->
            <div>
                <div class="rounded-2xl overflow-hidden bg-slate-200 aspect-video flex items-center justify-center">
                    <img th:if="${p.get('featured_photo') != null}" id="fotoPrincipal" th:src="${p.get('featured_photo')}" th:alt="${p.get('name')}" class="w-full h-full object-cover">
                    <span th:if="${p.get('featured_photo') == null}" class="text-slate-400 text-sm">Sin fotos todavía</span>
                </div>
                <div th:if="${fotos != null and !fotos.isEmpty()}" class="grid grid-cols-4 sm:grid-cols-6 gap-2 mt-2">
                    <img th:each="f : ${fotos}" th:src="${f.get('url')}" th:alt="${p.get('name')}" loading="lazy" decoding="async"
                         onclick="var m=document.getElementById('fotoPrincipal'); if(m){m.src=this.src;}"
                         class="w-full aspect-square object-cover rounded-lg cursor-pointer ring-1 ring-slate-200 hover:ring-2 hover:ring-blue-500 transition">
                </div>
            </div>

            <!-- Info principal -->
            <div class="bg-white rounded-2xl p-6 shadow">
                <span class="inline-block px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs uppercase tracking-wider mb-3" th:text="${p.get('type')}">—</span>
                <h1 class="display text-3xl font-extrabold mb-2" th:text="${p.get('name')}">—</h1>
                <p class="text-slate-500" th:text="${(p.get('address') ?: '') + (p.get('city') != null ? ', ' + p.get('city') : '')}">—</p>
                <p class="display text-4xl font-extrabold text-blue-700 mt-4" th:text="${#numbers.formatDecimal((p.get('current_value') ?: (p.get('purchase_price') ?: 0)), 1, 'DEFAULT', 0, 'DEFAULT') + ' ' + mon}">—</p>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6 py-4 border-y">
                    <div><p class="text-2xl"></p><p class="text-xs text-slate-500">Habitaciones</p><p class="font-bold" th:text="${p.get('bedrooms') != null ? #numbers.formatInteger(p.get('bedrooms'), 0) : '—'}">—</p></div>
                    <div><p class="text-2xl"></p><p class="text-xs text-slate-500">Baños</p><p class="font-bold" th:text="${p.get('bathrooms') != null ? #numbers.formatInteger(p.get('bathrooms'), 0) : '—'}">—</p></div>
                    <div><p class="text-2xl"></p><p class="text-xs text-slate-500">Superficie</p><p class="font-bold" th:text="${p.get('area_m2') != null ? #numbers.formatInteger(p.get('area_m2'), 0) + ' m²' : '—'}">—</p></div>
                    <div><p class="text-2xl"></p><p class="text-xs text-slate-500">Año</p><p class="font-bold" th:text="${p.get('year_built') ?: '—'}">—</p></div>
                </div>

                <div class="mt-6" th:if="${p.get('notes')}">
                    <h2 class="display font-bold text-lg mb-2"> Descripción</h2>
                    <p class="text-slate-700 leading-relaxed whitespace-pre-line" th:text="${p.get('notes')}">—</p>
                </div>

                <div class="mt-6">
                    <h2 class="display font-bold text-lg mb-2"> Detalles</h2>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-2 text-sm text-slate-600">
                        <p th:if="${p.get('type')}" th:text="${p.get('type')}">—</p>
                        <p th:if="${p.get('floor')}" th:text="${'Planta ' + p.get('floor')}">—</p>
                        <p th:if="${p.get('status')}" th:text="${p.get('status')}">—</p>
                        <p th:if="${p.get('reference')}" th:text="${'Ref. ' + p.get('reference')}">—</p>
                        <p th:if="${p.get('postal_code')}" th:text="${p.get('postal_code')}">—</p>
                    </div>
                </div>
            </div>

            <!-- Similares -->
            <div th:if="${!similares.isEmpty()}" class="bg-white rounded-2xl p-6 shadow">
                <h2 class="display font-bold text-lg mb-4"> Propiedades similares</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <a th:each="s : ${similares}" th:href="@{|/propiedad/${s.get('id')}|}" class="block p-3 rounded-lg border hover:shadow">
                        <p class="font-semibold text-sm" th:text="${s.get('name')}">—</p>
                        <p class="text-blue-700 font-bold mt-1" th:text="${#numbers.formatDecimal((s.get('current_value') ?: (s.get('purchase_price') ?: 0)), 1, 'DEFAULT', 0, 'DEFAULT') + ' ' + mon}">—</p>
                    </a>
                </div>
            </div>
        </div>

        <!-- Sidebar contacto -->
        <aside class="lg:sticky lg:top-24 h-fit space-y-4">
            <div class="bg-white rounded-2xl p-6 shadow">
                <h3 class="display font-bold text-lg mb-3"> ¿Te interesa?</h3>
                <form th:action="@{|/propiedad/${p.get('id')}/contactar|}" method="post" class="space-y-3">
                    <input type="text" name="nombre" required placeholder="Nombre *" class="w-full px-3 py-2 border rounded-lg text-sm">
                    <input type="email" name="email" required placeholder="Email *" class="w-full px-3 py-2 border rounded-lg text-sm">
                    <input type="tel" name="telefono" placeholder="Teléfono" class="w-full px-3 py-2 border rounded-lg text-sm">
                    <textarea name="mensaje" rows="3" placeholder="Mensaje..." class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
                    <button type="submit" class="w-full px-4 py-3 brand-grad hover:opacity-90 text-white rounded-xl font-bold transition"> Enviar consulta</button>
                </form>
                <div th:if="${agente?.get('telefono') != null and agente.get('telefono') != ''}" class="mt-4 pt-4 border-t text-center">
                    <a th:href="${'tel:' + agente.get('telefono')}" class="block w-full px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-bold"> <span th:text="${agente.get('telefono')}">—</span></a>
                    <a th:href="${'https://wa.me/' + #strings.replace(#strings.replace(agente.get('telefono'), ' ', ''), '+', '')}" target="_blank" class="block mt-2 w-full px-4 py-2 bg-green-500 text-white rounded-lg text-sm font-bold"> WhatsApp</a>
                </div>
            </div>
        </aside>
    </main>
</div>

</body></html>
