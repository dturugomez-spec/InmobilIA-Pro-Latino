<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Baja - InmobilIA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md bg-white rounded-2xl shadow-xl p-8 text-center">
        <div th:if="${error}" class="text-red-600">
            <div class="text-6xl mb-4"></div>
            <h1 class="text-xl font-bold">Enlace no válido</h1>
            <p class="text-slate-600 mt-2" th:text="${error}">—</p>
        </div>
        <div th:unless="${error}" class="text-emerald-600">
            <div class="text-6xl mb-4"></div>
            <h1 class="text-2xl font-bold text-slate-900">Te has dado de baja</h1>
            <p class="text-slate-600 mt-3">El email <strong th:text="${email}">—</strong> ha sido eliminado de nuestras listas.</p>
            <p class="text-xs text-slate-500 mt-4">Lamentamos verte partir. Si fue un error, contacta con nosotros.</p>
        </div>
    </div>
</body>
</html>
