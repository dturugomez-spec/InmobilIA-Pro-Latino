<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Mejora IA imágenes</title></head>
<body><div layout:fragment="content">
<div class="rounded-xl bg-gradient-to-br from-purple-700 to-violet-900 p-6 mb-5 text-white">
    <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="image" class="h-6 w-6"></i> Mejora IA de imágenes</h2>
    <p class="text-sm text-white/80 mt-1">Optimiza brillo, contraste, saturación y nitidez automáticamente.</p>
</div>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
        <h3 class="font-semibold text-sm mb-3"> Subir imagen</h3>
        <input type="file" id="img" accept="image/*" class="w-full text-sm mb-3">

        <div class="space-y-2">
            <label class="text-xs">Brillo <input type="range" id="bri" min="0" max="200" value="100" class="w-full"></label>
            <label class="text-xs">Contraste <input type="range" id="con" min="0" max="200" value="100" class="w-full"></label>
            <label class="text-xs">Saturación <input type="range" id="sat" min="0" max="200" value="100" class="w-full"></label>
            <label class="text-xs">Sombras <input type="range" id="hue" min="0" max="360" value="0" class="w-full"></label>
        </div>

        <div class="grid grid-cols-2 gap-2 mt-3">
            <button onclick="autoMejora()" class="px-4 py-2 rounded bg-purple-700 text-white text-sm"> Auto IA</button>
            <button onclick="descargar()" class="px-4 py-2 rounded bg-emerald-700 text-white text-sm"> Descargar</button>
        </div>
    </div>
    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
        <h3 class="font-semibold text-sm mb-3"> Vista previa</h3>
        <canvas id="canvas" class="w-full max-h-96 border rounded"></canvas>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let imgData = null;

document.getElementById('img').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
            canvas.width = img.width; canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            imgData = canvas.toDataURL();
            aplicar();
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});

['bri','con','sat','hue'].forEach(id => document.getElementById(id).addEventListener('input', aplicar));

function aplicar() {
    if (!imgData) return;
    const img = new Image();
    img.onload = () => {
        const b = document.getElementById('bri').value;
        const c = document.getElementById('con').value;
        const s = document.getElementById('sat').value;
        const h = document.getElementById('hue').value;
        ctx.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%) hue-rotate(${h}deg)`;
        ctx.drawImage(img, 0, 0);
    };
    img.src = imgData;
}

function autoMejora() {
    document.getElementById('bri').value = 110;
    document.getElementById('con').value = 115;
    document.getElementById('sat').value = 120;
    aplicar();
}

function descargar() {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/jpeg', 0.92);
    a.download = 'mejorada.jpg';
    a.click();
}
</script>
</div></body></html>
