<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Reviews</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-xl bg-gradient-to-br from-yellow-500 to-amber-700 p-6 mb-5 text-white">
        <h2 class="text-xl font-bold flex items-center gap-2">
            <i data-lucide="star" class="h-6 w-6"></i> Reviews y testimonios
        </h2>
        <p class="text-sm text-white/80 mt-1">Construye reputación: solicita opiniones tras cada cierre.</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-4">
            <p class="text-[10px] uppercase text-slate-500">Puntuación media</p>
            <p class="text-xl font-bold mt-1" th:text="${#numbers.formatDecimal(promedio, 1, 1)} + ' / 5'">0</p>
        </div>
        <div class="rounded-xl bg-emerald-50 ring-1 ring-emerald-200 p-4">
            <p class="text-[10px] uppercase text-emerald-700">Aprobadas</p>
            <p class="text-xl font-bold mt-1 text-emerald-700" th:text="${aprobadas}">0</p>
        </div>
        <div class="rounded-xl bg-amber-50 ring-1 ring-amber-200 p-4">
            <p class="text-[10px] uppercase text-amber-700">Pendientes</p>
            <p class="text-xl font-bold mt-1 text-amber-700" th:text="${pendientes}">0</p>
        </div>
        <div class="rounded-xl bg-fuchsia-50 ring-1 ring-fuchsia-200 p-4">
            <p class="text-[10px] uppercase text-fuchsia-700">Destacadas</p>
            <p class="text-xl font-bold mt-1 text-fuchsia-700" th:text="${destacadas}">0</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

        <form method="post" action="/reviews/solicitar" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 space-y-3 lg:col-span-1">
            <h3 class="font-semibold text-sm"> Solicitar review</h3>
            <input type="text" name="nombre" required placeholder="Nombre del cliente" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg">
            <input type="email" name="email" required placeholder="Email" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg">
            <button class="w-full px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium">
                 Enviar solicitud
            </button>
        </form>

        <div class="lg:col-span-2 space-y-3">
            <div th:each="r : ${reviews}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
                <div class="flex items-start justify-between mb-2">
                    <div>
                        <div class="flex items-center gap-2">
                            <p class="font-semibold text-sm" th:text="${r.get('autor_nombre')}">—</p>
                            <span th:if="${r.get('autor_rol')}" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 capitalize" th:text="${r.get('autor_rol')}">—</span>
                        </div>
                        <div class="flex items-center gap-0.5 mt-1">
                            <span th:each="i : ${#numbers.sequence(1, 5)}" th:text="${i <= r.get('puntuacion') ? '' : ''}" class="text-amber-500"></span>
                            <span class="ml-1 text-[10px] text-slate-400" th:text="${#strings.substring(r.get('created_at'), 0, 10)}">—</span>
                        </div>
                    </div>
                    <div class="flex gap-1">
                        <button th:if="${#bools.isFalse(r.get('aprobada'))}" th:data-id="${r.get('id')}" onclick="aprobar(this.dataset.id)" class="text-[10px] px-2 py-0.5 rounded bg-emerald-100 text-emerald-700 hover:bg-emerald-200"> Aprobar</button>
                        <button th:if="${r.get('aprobada')}" th:data-id="${r.get('id')}" onclick="destacar(this.dataset.id)" class="text-[10px] px-2 py-0.5 rounded"
                                th:classappend="${#bools.isTrue(r.get('destacada')) ? 'bg-fuchsia-100 text-fuchsia-700' : 'bg-slate-100 text-slate-600'}">
                            <span th:text="${#bools.isTrue(r.get('destacada')) ? ' Destacada' : ' Destacar'}">—</span>
                        </button>
                    </div>
                </div>

                <p th:if="${r.get('titulo')}" class="font-semibold text-sm mb-1" th:text="${r.get('titulo')}">—</p>
                <p class="text-sm text-slate-700 dark:text-slate-300" th:text="${r.get('comentario')}">—</p>

                <div th:if="${r.get('respuesta')}" class="mt-3 pl-3 border-l-4 border-blue-300 bg-blue-50 dark:bg-blue-900/20 p-2 rounded">
                    <p class="text-[10px] font-bold text-blue-700">RESPUESTA</p>
                    <p class="text-sm text-blue-900 dark:text-blue-100" th:text="${r.get('respuesta')}">—</p>
                </div>

                <details th:unless="${r.get('respuesta')}" class="mt-3">
                    <summary class="text-xs text-blue-700 cursor-pointer">+ Responder</summary>
                    <form th:action="@{|/reviews/${r.get('id')}/responder|}" method="post" class="mt-2 flex gap-2">
                        <input type="text" name="respuesta" placeholder="Tu respuesta..." class="flex-1 px-2 py-1.5 text-xs border rounded">
                        <button class="px-3 py-1.5 text-xs rounded bg-blue-700 text-white">Enviar</button>
                    </form>
                </details>
            </div>

            <div th:if="${reviews.isEmpty()}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 py-12 text-center text-slate-500 text-sm">
                Sin reviews todavía. Solicita la primera al lateral.
            </div>
        </div>
    </div>

    <script>
        async function aprobar(id) {
            await fetch('/reviews/' + id + '/aprobar', { method: 'POST' });
            location.reload();
        }
        async function destacar(id) {
            await fetch('/reviews/' + id + '/destacar', { method: 'POST' });
            location.reload();
        }
    </script>

</div>
</body>
</html>
