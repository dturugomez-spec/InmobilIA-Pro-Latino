<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Google Calendar</title></head>
<body><div layout:fragment="content">
    <div class="rounded-xl bg-gradient-to-br from-blue-500 to-blue-800 p-6 mb-5 text-white">
        <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="calendar" class="h-6 w-6"></i> Google Calendar</h2>
        <p class="text-sm text-white/80 mt-1">Sincroniza tus visitas y eventos con Google Calendar.</p>
    </div>
    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 max-w-lg">
        <div th:if="${!conectado}">
            <p class="text-sm mb-4"> Conecta tu cuenta de Google para sincronizar visitas:</p>
            <a th:href="${authUrl}" class="inline-block px-4 py-2 rounded bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium">
                 Conectar con Google
            </a>
        </div>
        <div th:if="${conectado}">
            <p class="text-emerald-600 font-bold mb-3"> Conectado a Google Calendar</p>
            <p class="text-xs text-slate-500 mb-3" th:text="'Último sync: ' + ${cfg?.get('ultimo_sync_at')}">—</p>
            <form method="post" action="/google-calendar/desconectar">
                <button class="text-xs text-red-600 hover:underline"> Desconectar</button>
            </form>
            <div class="mt-4 pt-3 border-t text-xs text-slate-600">
                 En cada visita aparecerá un botón "Sync con Google" para crear el evento automáticamente.
            </div>
        </div>
    </div>
</div></body></html>
