<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>OCR DNI</title></head>
<body><div layout:fragment="content">
<div class="rounded-xl bg-gradient-to-br from-orange-700 to-red-900 p-6 mb-5 text-white">
    <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="scan" class="h-6 w-6"></i> OCR DNI / NIE</h2>
    <p class="text-sm text-white/80 mt-1">Sube foto del DNI y extrae los datos automáticamente.</p>
</div>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
        <h3 class="font-semibold text-sm mb-3"> Foto del DNI</h3>
        <input type="file" id="img" accept="image/*" capture="environment" class="w-full text-sm mb-3">
        <button onclick="procesar()" id="btnProc" disabled class="w-full px-4 py-2 rounded bg-orange-700 text-white text-sm disabled:opacity-50"> Procesar OCR</button>
        <div id="preview" class="mt-3"></div>
        <p id="status" class="text-xs text-slate-500 mt-2"></p>
    </div>
    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
        <h3 class="font-semibold text-sm mb-3"> Datos extraídos</h3>
        <pre id="resultado" class="text-xs bg-slate-50 p-3 rounded">Sube una imagen primero...</pre>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const img = document.getElementById('img');
img.addEventListener('change', () => {
    const file = img.files[0]; if (!file) return;
    const url = URL.createObjectURL(file);
    document.getElementById('preview').innerHTML = '<img src="' + url + '" class="max-h-48 rounded">';
    document.getElementById('btnProc').disabled = false;
});

async function procesar() {
    const status = document.getElementById('status');
    status.textContent = '⏳ Reconociendo texto...';
    const file = img.files[0];
    const { data } = await Tesseract.recognize(file, 'spa', {
        logger: m => status.textContent = '⏳ ' + Math.round((m.progress || 0) * 100) + '%'
    });
    status.textContent = ' Extrayendo campos...';
    const res = await fetch('/ocr-dni/extraer', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({texto: data.text})
    });
    const json = await res.json();
    document.getElementById('resultado').textContent = JSON.stringify(json, null, 2);
    status.textContent = ' Listo';
}
</script>
</div></body></html>
