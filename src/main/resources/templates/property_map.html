<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Mapa cartera</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
</head>
<body>
<div layout:fragment="content">

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        <div class="p-4 rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Total cartera</div>
            <div class="text-xl font-bold mt-1" th:text="${totalProps}">0</div>
        </div>
        <div class="p-4 rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Geolocalizadas</div>
            <div class="text-xl font-bold mt-1 text-emerald-600" th:text="${totalGeolocalizadas}">0</div>
        </div>
        <div class="md:col-span-2 p-4 rounded-xl bg-amber-50 dark:bg-amber-950/30 ring-1 ring-amber-200 text-xs text-amber-800" th:if="${totalGeolocalizadas < totalProps}">
            <strong></strong> <span th:text="${totalProps - totalGeolocalizadas}">N</span> propiedades no aparecen en el mapa porque no tienen coordenadas (lat/lon). Edita su ficha para añadirlas.
        </div>
    </div>

    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 overflow-hidden">
        <div id="propertyMap" style="height: 600px; width: 100%;"></div>
    </div>

</div>

<script th:inline="javascript">
const markers = /*[[${markers}]]*/ [];
document.addEventListener('DOMContentLoaded', () => {
    if (!window.L) return;
    const map = L.map('propertyMap').setView([40.4168, -3.7038], 6);  // España default
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    if (markers.length === 0) return;

    const cluster = L.markerClusterGroup();
    const bounds = [];
    markers.forEach(m => {
        const lat = parseFloat(m.lat);
        const lon = parseFloat(m.lon);
        if (isNaN(lat) || isNaN(lon)) return;
        bounds.push([lat, lon]);

        const color = m.status === 'Ocupado' ? '#10b981' : (m.status === 'Libre' ? '#f59e0b' : '#3b82f6');
        const icon = L.divIcon({
            html: `<div style="background:${color};color:white;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,0.2);border:2px solid white;"></div>`,
            className: '',
            iconSize: [32, 32]
        });

        const popupHtml = `
            <div style="min-width:220px;font-family:Inter,sans-serif">
                ${m.photo ? `<img src="${m.photo}" style="width:100%;height:120px;object-fit:cover;border-radius:6px;margin-bottom:8px">` : ''}
                <div style="font-weight:600;font-size:14px;margin-bottom:4px">${m.name || 'Sin nombre'}</div>
                <div style="font-size:12px;color:#64748b;margin-bottom:6px"> ${m.address || ''} ${m.city ? '· '+m.city : ''}</div>
                <div style="display:flex;gap:8px;font-size:11px;margin-bottom:8px">
                    ${m.status ? `<span style="background:${color};color:white;padding:2px 6px;border-radius:9999px;font-weight:600">${m.status}</span>` : ''}
                    ${m.type ? `<span style="background:#f1f5f9;padding:2px 6px;border-radius:9999px">${m.type}</span>` : ''}
                </div>
                <div style="font-family:'Geist Mono',monospace;font-weight:700;font-size:14px">${m.value || '—'} €</div>
                ${m.rent ? `<div style="font-family:'Geist Mono',monospace;color:#10b981;font-size:11px">${m.rent} €/mes</div>` : ''}
                <a href="/entity/propiedad/${m.id}" style="display:block;margin-top:8px;text-align:center;background:#1e40af;color:white;padding:6px;border-radius:4px;font-size:12px;font-weight:500;text-decoration:none">Ver ficha →</a>
            </div>`;

        const marker = L.marker([lat, lon], { icon }).bindPopup(popupHtml);
        cluster.addLayer(marker);
    });
    map.addLayer(cluster);

    if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
    }
});
</script>
</body>
</html>
