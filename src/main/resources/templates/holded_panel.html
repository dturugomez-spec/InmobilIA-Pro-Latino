<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Holded</title></head>
<body><div layout:fragment="content">
    <div class="rounded-xl bg-gradient-to-br from-emerald-700 to-teal-900 p-6 mb-5 text-white">
        <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="link" class="h-6 w-6"></i> Integración Holded / A3 / Sage</h2>
        <p class="text-sm text-white/80 mt-1">Exporta facturas y gastos en CSV o sincroniza con la API de Holded.</p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <form method="post" action="/holded/config" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 space-y-3">
            <h3 class="font-semibold text-sm"> API Key Holded</h3>
            <input type="text" name="api_key" placeholder="Tu API key de Holded" th:value="${cfg.get('api_key')}" class="w-full px-3 py-2 text-sm font-mono border rounded">
            <p class="text-[10px] text-slate-500">Obtén tu key en Holded → Configuración → Desarrolladores → API</p>
            <button class="px-4 py-2 rounded bg-emerald-700 text-white text-sm"> Guardar</button>
        </form>
        <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5">
            <h3 class="font-semibold text-sm mb-3"> Exportar a CSV</h3>
            <p class="text-xs text-slate-500 mb-3"><span th:text="${facturas}">0</span> facturas · <span th:text="${gastos}">0</span> gastos</p>
            <a href="/holded/export/facturas.csv" class="block px-4 py-2 rounded bg-blue-700 hover:bg-blue-800 text-white text-sm text-center mb-2"> Facturas CSV</a>
            <button onclick="fetch('/holded/sync',{method:'POST'}).then(r=>r.json()).then(d=>alert(d.mensaje||d.error))" class="w-full px-4 py-2 rounded bg-emerald-700 hover:bg-emerald-800 text-white text-sm"> Sync API Holded</button>
        </div>
    </div>
</div></body></html>
