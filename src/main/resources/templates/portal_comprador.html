<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Portal del comprador</title></head>
<body><div layout:fragment="content">

<div class="rounded-xl bg-gradient-to-br from-blue-700 to-blue-950 p-6 mb-5 text-white">
    <h2 class="text-xl font-bold flex items-center gap-2">
        <i data-lucide="heart-handshake" class="h-6 w-6"></i> Portal del comprador
    </h2>
    <p class="text-sm text-white/80 mt-1">Arma una selección de inmuebles a medida y compártela por un enlace de marca. El comprador marca favoritos, descarta y pide visitas; tú recibes el feedback al instante. Adiós a mandar links sueltos.</p>
</div>

<!-- Nueva selección -->
<form th:action="@{/portal-comprador/nueva}" method="post"
      class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 mb-5">
    <p class="text-sm font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2 mb-3"><i data-lucide="plus-circle" class="h-4 w-4"></i> Nueva selección</p>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-end">
        <div>
            <label class="block text-xs font-semibold mb-1 text-slate-600">Título *</label>
            <input name="titulo" required placeholder="Ej. Inmuebles para Ana en Del Valle"
                   class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm">
        </div>
        <div>
            <label class="block text-xs font-semibold mb-1 text-slate-600">Comprador (lead)</label>
            <select name="lead_id" class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm">
                <option value="">— Sin asociar —</option>
                <option th:each="l : ${leads}" th:value="${l.get('id')}"
                        th:text="${(l.get('nombre') ?: 'Lead') + (l.get('interes') != null ? ' · ' + l.get('interes') : '')}">—</option>
            </select>
        </div>
        <button class="px-5 py-2.5 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-sm font-bold flex items-center justify-center gap-2">
            <i data-lucide="folder-plus" class="h-4 w-4"></i> Crear selección
        </button>
    </div>
    <div class="mt-3">
        <label class="block text-xs font-semibold mb-1 text-slate-600">Mensaje para el comprador (opcional)</label>
        <input name="mensaje_agente" placeholder="Ej. Hola Ana, te dejo una primera selección. Dime cuáles te gustan y agendamos visitas."
               class="w-full px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-neutral-700 dark:bg-neutral-800 focus:border-blue-600 outline-none text-sm">
    </div>
</form>

<!-- Lista -->
<div th:if="${#lists.isEmpty(selecciones)}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-10 text-center">
    <i data-lucide="heart-handshake" class="h-10 w-10 mx-auto text-slate-300"></i>
    <p class="mt-3 font-semibold text-slate-600">Aún no has creado selecciones</p>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <a th:each="s : ${selecciones}" th:href="@{|/portal-comprador/${s.get('id')}|}"
       class="block rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 hover:ring-blue-300 hover:shadow-md transition">
        <div class="flex items-start justify-between gap-2">
            <p class="font-bold text-slate-900 dark:text-white" th:text="${s.get('titulo')}">—</p>
            <span class="text-xs px-2 py-0.5 rounded-full font-bold flex-shrink-0"
                  th:classappend="${s.get('activo') != false ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}"
                  th:text="${s.get('activo') != false ? 'Activa' : 'Inactiva'}">—</span>
        </div>
        <p class="text-sm text-slate-500 mt-1" th:if="${s.get('comprador_nombre')}" th:text="' ' + ${s.get('comprador_nombre')}">—</p>
        <div class="flex flex-wrap gap-x-4 text-xs text-slate-400 mt-2">
            <span th:text="' ' + ${s.getOrDefault('vistas', 0)} + ' vistas'">—</span>
            <span class="font-mono" th:if="${s.get('created_at')}" th:text="${#strings.substring(s.get('created_at'), 0, 10)}">—</span>
        </div>
    </a>
</div>

<script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>

</div></body></html>
