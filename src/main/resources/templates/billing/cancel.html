<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Suscripción cancelada</title></head>
<body>
<div layout:fragment="content">
    <div class="max-w-xl mx-auto text-center py-16">
        <div class="inline-flex h-20 w-20 rounded-2xl bg-slate-100 dark:bg-neutral-800 items-center justify-center mb-5">
            <i data-lucide="x-circle" class="h-10 w-10 text-slate-500"></i>
        </div>
        <h1 class="text-3xl font-bold tracking-tight mb-3">Pago cancelado</h1>
        <p class="text-slate-600 dark:text-slate-400 mb-8">
            No se ha realizado ningún cargo. Puedes volver a intentarlo o seguir usando la versión gratuita.
        </p>
        <div class="flex items-center justify-center gap-2">
            <a href="/upgrade" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-sm font-medium shadow-card">
                <i data-lucide="arrow-left" class="h-4 w-4"></i>
                Volver a planes
            </a>
            <a href="/dashboard" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-white dark:bg-neutral-800 hover:bg-slate-50 dark:hover:bg-neutral-700 ring-1 ring-slate-200 dark:ring-neutral-700 text-sm font-medium">
                Ir al dashboard
            </a>
        </div>
    </div>
</div>
</body>
</html>
