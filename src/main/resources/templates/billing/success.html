<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Suscripción activada</title></head>
<body>
<div layout:fragment="content">
    <div class="max-w-xl mx-auto text-center py-16">
        <div class="inline-flex h-20 w-20 rounded-2xl bg-emerald-100 dark:bg-emerald-950/40 items-center justify-center mb-5">
            <i data-lucide="check-circle-2" class="h-10 w-10 text-emerald-600 dark:text-emerald-400"></i>
        </div>
        <h1 class="text-3xl font-bold tracking-tight mb-3">¡Bienvenido al equipo Pro! </h1>
        <p class="text-slate-600 dark:text-slate-400 mb-8 leading-relaxed">
            Tu suscripción se ha activado correctamente. Ya puedes usar todas las funciones del plan.
            Recibirás un email con la confirmación y la primera factura.
        </p>
        <div class="flex items-center justify-center gap-2">
            <a href="/dashboard" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-brand-800 hover:bg-brand-900 text-white text-sm font-medium shadow-card">
                <i data-lucide="layout-dashboard" class="h-4 w-4"></i>
                Volver al dashboard
            </a>
            <a href="/billing" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-white dark:bg-neutral-800 hover:bg-slate-50 dark:hover:bg-neutral-700 ring-1 ring-slate-200 dark:ring-neutral-700 text-sm font-medium">
                Ver mi facturación
            </a>
        </div>
    </div>
</div>
</body>
</html>
