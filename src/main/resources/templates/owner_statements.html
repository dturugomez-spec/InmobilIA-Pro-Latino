<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Extractos propietarios</title></head>
<body><div layout:fragment="content">
<div class="rounded-xl bg-gradient-to-br from-emerald-700 to-green-900 p-6 mb-5 text-white">
    <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="receipt-text" class="h-6 w-6"></i> Extractos a propietarios</h2>
    <p class="text-sm text-white/80 mt-1">Liquidaciones mensuales con cálculo automático de comisión, IVA, IRPF y gastos.</p>
</div>

<div class="rounded-xl bg-amber-50 border-2 border-amber-200 p-4 mb-5">
    <p class="text-sm font-bold text-amber-900"> Pendiente liquidar: <span th:text="${#numbers.formatDecimal(totalPendiente, 1, 'POINT', 2, 'COMMA')} + ' €'">0</span></p>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
    <form method="post" action="/extractos/generar" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 space-y-3">
        <h3 class="font-semibold text-sm"> Generar extracto</h3>
        <select name="propietarioId" required class="w-full px-3 py-2 text-sm border rounded">
            <option value="">— Propietario —</option>
            <option th:each="p : ${propietarios}" th:value="${p.get('id')}" th:text="${p.get('nombre')}">—</option>
        </select>
        <div class="grid grid-cols-2 gap-2">
            <input type="date" name="periodoInicio" required class="px-3 py-2 text-sm border rounded">
            <input type="date" name="periodoFin" required class="px-3 py-2 text-sm border rounded">
        </div>
        <div class="grid grid-cols-2 gap-2">
            <div><label class="block text-xs">Comisión %</label><input type="number" step="0.1" name="comisionPct" value="10" class="w-full px-2 py-1 text-sm border rounded"></div>
            <div><label class="block text-xs">Retención IRPF %</label><input type="number" step="0.1" name="retencionIrpfPct" value="19" class="w-full px-2 py-1 text-sm border rounded"></div>
        </div>
        <button class="w-full px-4 py-2 rounded bg-emerald-700 text-white text-sm"> Generar</button>
    </form>

    <div class="lg:col-span-2 rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 dark:bg-neutral-800/50">
            <tr class="text-[10px] uppercase text-slate-500">
                <th class="text-left px-3 py-2">Propietario</th><th class="text-left px-3 py-2">Periodo</th>
                <th class="text-right px-3 py-2">Rentas</th><th class="text-right px-3 py-2">Gastos</th>
                <th class="text-right px-3 py-2">A liquidar</th><th class="text-left px-3 py-2">Estado</th><th></th>
            </tr></thead>
            <tbody class="divide-y divide-slate-100 dark:divide-neutral-800">
            <tr th:each="e : ${extractos}">
                <td class="px-3 py-2 text-xs" th:text="${e.get('propietario') != null ? e.get('propietario').get('nombre') : '—'}">—</td>
                <td class="px-3 py-2 text-xs font-mono" th:text="${#strings.substring(e.get('periodo_inicio'),0,7)}">—</td>
                <td class="px-3 py-2 text-right font-mono text-emerald-700" th:text="${#numbers.formatDecimal(e.get('total_rentas') ?: 0, 1, 'POINT', 2, 'COMMA')} + '€'">—</td>
                <td class="px-3 py-2 text-right font-mono text-red-700" th:text="${#numbers.formatDecimal(e.get('total_gastos') ?: 0, 1, 'POINT', 2, 'COMMA')} + '€'">—</td>
                <td class="px-3 py-2 text-right font-mono font-bold" th:text="${#numbers.formatDecimal(e.get('importe_liquidar') ?: 0, 1, 'POINT', 2, 'COMMA')} + '€'">—</td>
                <td class="px-3 py-2">
                    <span th:if="${e.get('estado') == 'pendiente'}" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">Pendiente</span>
                    <span th:if="${e.get('estado') == 'pagado'}" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700"> Pagado</span>
                </td>
                <td class="px-3 py-2 text-right">
                    <form th:if="${e.get('estado') == 'pendiente'}" th:action="@{|/extractos/${e.get('id')}/marcar-pagado|}" method="post" class="inline">
                        <button class="text-[10px] text-emerald-700 hover:underline"> Pagado</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${extractos.isEmpty()}"><td colspan="7" class="py-6 text-center text-slate-500 text-xs">Sin extractos</td></tr>
            </tbody>
        </table>
    </div>
</div>
</div></body></html>
