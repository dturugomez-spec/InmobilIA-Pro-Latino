<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi portal · InmobilIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@1.52.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif} [x-cloak]{display:none!important}</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

<!-- Header -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <div class="h-8 w-8 rounded-lg bg-gradient-to-br from-blue-700 to-blue-950 flex items-center justify-center">
                <span class="text-lg"></span>
            </div>
            <span class="font-bold tracking-tight">Mi portal</span>
        </div>
        <a href="/logout" class="text-sm text-slate-600 hover:text-slate-900">Cerrar sesión</a>
    </div>
</header>

<main class="max-w-5xl mx-auto px-6 py-8">

    <!-- Bienvenida -->
    <div class="rounded-2xl bg-gradient-to-br from-blue-700 to-blue-950 text-white p-6 mb-6">
        <h1 class="text-2xl font-bold tracking-tight">Hola, <span th:text="${inq.get('name')}">Juan</span> </h1>
        <p class="text-blue-200 text-sm mt-1" th:text="'Inquilino de ' + ${inq.get('property_name')}">propiedad</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6" x-data="{ tab: 'recibos' }">

        <!-- KPIs -->
        <div class="md:col-span-3 grid grid-cols-3 gap-3">
            <div class="bg-white rounded-xl ring-1 ring-slate-200 p-4">
                <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Renta mensual</div>
                <div class="text-xl font-bold mt-1" th:text="${inq.get('rent_amount') != null ? inq.get('rent_amount') + ' €' : '—'}">— €</div>
            </div>
            <div class="bg-white rounded-xl ring-1 ring-slate-200 p-4">
                <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Recibos disponibles</div>
                <div class="text-xl font-bold mt-1" th:text="${receipts.size()}">0</div>
            </div>
            <div class="bg-white rounded-xl ring-1 ring-slate-200 p-4">
                <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Solicitudes abiertas</div>
                <div class="text-xl font-bold mt-1" th:text="${requests.size()}">0</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="md:col-span-3 bg-white rounded-xl ring-1 ring-slate-200 overflow-hidden">
            <nav class="flex border-b border-slate-200">
                <button @click="tab='recibos'" :class="tab==='recibos'?'border-blue-700 text-blue-800 font-semibold':'border-transparent text-slate-500'" class="px-5 py-3 text-sm border-b-2"> Mis recibos</button>
                <button @click="tab='contrato'" :class="tab==='contrato'?'border-blue-700 text-blue-800 font-semibold':'border-transparent text-slate-500'" class="px-5 py-3 text-sm border-b-2"> Mi contrato</button>
                <button @click="tab='solicitar'" :class="tab==='solicitar'?'border-blue-700 text-blue-800 font-semibold':'border-transparent text-slate-500'" class="px-5 py-3 text-sm border-b-2"> Solicitar</button>
                <button @click="tab='solicitudes'" :class="tab==='solicitudes'?'border-blue-700 text-blue-800 font-semibold':'border-transparent text-slate-500'" class="px-5 py-3 text-sm border-b-2"> Mis solicitudes</button>
            </nav>

            <!-- TAB RECIBOS -->
            <div x-show="tab==='recibos'" class="p-5">
                <table class="w-full text-sm" th:if="${!receipts.isEmpty()}">
                    <thead><tr class="text-[10px] uppercase text-slate-500"><th class="text-left py-2">Nº</th><th class="text-left py-2">Período</th><th class="text-right py-2">Importe</th><th class="text-left py-2">Estado</th><th></th></tr></thead>
                    <tbody class="divide-y divide-slate-100">
                        <tr th:each="r : ${receipts}">
                            <td class="py-2.5 font-mono font-bold" th:text="${r.get('full_number')}">R/00001</td>
                            <td class="py-2.5" th:text="${r.get('period_month') + '/' + r.get('period_year')}">—</td>
                            <td class="py-2.5 font-mono text-right" th:text="${r.get('total_pagado') + ' €'}">—</td>
                            <td class="py-2.5"><span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700" th:text="${r.get('status')}">—</span></td>
                            <td class="py-2.5 text-right"><a th:href="@{|/portal/receipts/${r.get('id')}|}" class="text-xs text-blue-700 hover:underline">Ver →</a></td>
                        </tr>
                    </tbody>
                </table>
                <div th:if="${receipts.isEmpty()}" class="text-center py-8 text-sm text-slate-500">Aún no tienes recibos.</div>
            </div>

            <!-- TAB CONTRATO -->
            <div x-show="tab==='contrato'" x-cloak class="p-5">
                <div th:each="c : ${contracts}" class="rounded-lg bg-slate-50 p-4 mb-3">
                    <div class="text-xs text-slate-500"> <span th:text="${c.get('start_date') + ' → ' + c.get('end_date')}">—</span></div>
                    <div class="text-base font-bold mt-1" th:text="${c.get('property_name')}">—</div>
                    <div class="text-sm text-slate-600 mt-1">Renta: <strong th:text="${c.get('rent') + ' €/mes'}">—</strong> · Fianza: <strong th:text="${c.get('deposit') + ' €'}">—</strong></div>
                </div>
                <div th:if="${contracts.isEmpty()}" class="text-sm text-slate-500 text-center py-8">Sin contrato registrado.</div>
            </div>

            <!-- TAB SOLICITAR -->
            <div x-show="tab==='solicitar'" x-cloak class="p-5">
                <form action="/portal/request" method="post" class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium mb-1.5">Tipo</label>
                        <select name="category" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg">
                            <option value="mantenimiento"> Mantenimiento (caldera, fontanería, electricidad...)</option>
                            <option value="incidencia"> Incidencia urgente</option>
                            <option value="consulta"> Consulta general</option>
                            <option value="otro"> Otro</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5">Asunto *</label>
                        <input type="text" name="title" required placeholder="Caldera no calienta agua" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5">Descripción</label>
                        <textarea name="description" rows="4" placeholder="Cuéntanos los detalles..." class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5">Prioridad</label>
                        <select name="priority" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg">
                            <option>Baja</option><option selected>Media</option><option>Alta</option><option>Urgente</option>
                        </select>
                    </div>
                    <button type="submit" class="px-5 py-2 rounded-lg bg-blue-800 hover:bg-blue-900 text-white text-sm font-semibold">Enviar solicitud</button>
                </form>
            </div>

            <!-- TAB SOLICITUDES -->
            <div x-show="tab==='solicitudes'" x-cloak class="p-5">
                <ul class="divide-y divide-slate-100" th:if="${!requests.isEmpty()}">
                    <li th:each="r : ${requests}" class="py-3">
                        <div class="flex items-center justify-between">
                            <div class="font-medium text-sm" th:text="${r.get('title')}">—</div>
                            <span class="text-[10px] px-2 py-0.5 rounded-full"
                                  th:classappend="${r.get('status') == 'Resuelta' or r.get('status') == 'Cerrada' ? 'bg-emerald-100 text-emerald-700' : (r.get('status') == 'En curso' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700')}"
                                  th:text="${r.get('status')}">—</span>
                        </div>
                        <div class="text-xs text-slate-500 mt-1" th:text="${r.get('description')}">—</div>
                        <div class="text-xs mt-2 text-slate-700" th:if="${r.get('response')}">
                            <strong>Respuesta:</strong> <span th:text="${r.get('response')}">—</span>
                        </div>
                    </li>
                </ul>
                <div th:if="${requests.isEmpty()}" class="text-sm text-slate-500 text-center py-8">Sin solicitudes anteriores.</div>
            </div>
        </div>
    </div>

</main>

<script>lucide.createIcons();</script>
</body>
</html>
