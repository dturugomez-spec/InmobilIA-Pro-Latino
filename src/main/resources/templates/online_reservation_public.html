<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Reservar online</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50 min-h-screen p-4">
<div class="max-w-lg mx-auto bg-white rounded-2xl shadow-xl p-8">
<div th:if="${error}" class="text-center"><p class="text-red-600">Propiedad no encontrada</p></div>
<div th:if="${propiedad != null}">
    <h1 class="text-2xl font-bold mb-2"> Reservar online</h1>
    <p class="text-slate-600 mb-2" th:text="${direccion}">—</p>
    <p th:if="${precio > 0}" class="text-2xl font-bold text-blue-700 mb-6" th:text="${#numbers.formatDecimal(precio,1,'DEFAULT',0,'DEFAULT') + ' ' + mon}">—</p>
    <p th:if="${aviso != null}" class="mb-3 rounded-lg bg-amber-50 border border-amber-200 px-3 py-2 text-sm text-amber-800" th:text="${aviso}">—</p>
    <form th:action="@{|/reservas-online/p/${propiedad.get('id')}|}" method="post" class="space-y-3">
        <input type="text" name="nombre" required placeholder="Nombre completo *" class="w-full px-4 py-3 border-2 rounded-lg">
        <input type="email" name="email" required placeholder="Email *" class="w-full px-4 py-3 border-2 rounded-lg">
        <input type="tel" name="telefono" required placeholder="Teléfono *" class="w-full px-4 py-3 border-2 rounded-lg">
        <input type="text" name="dni" required th:placeholder="|${pais.etiquetaIdPersonal()} *|" class="w-full px-4 py-3 border-2 rounded-lg font-mono uppercase">
        <div>
            <label class="block text-sm mb-1">Importe señal ([[${mon}]])</label>
            <input type="number" name="importe" required th:value="${#numbers.formatDecimal(importeSugerido,1,0)}" min="1" step="1" class="w-full px-4 py-3 border-2 rounded-lg text-lg font-bold">
            <p class="text-xs text-slate-500 mt-1"> Sugerido: 1% del precio, con un mínimo razonable. La señal se descuenta del precio final.</p>
        </div>
        <button type="submit" class="w-full px-4 py-4 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white font-bold"> Solicitar la reserva →</button>
    </form>
    <p class="text-xs text-slate-400 text-center mt-4">Ahora no se cobra nada: la inmobiliaria te contactará para formalizar el pago de la señal. La solicitud caduca en 15 días.</p>
</div>
</div></body></html>
