<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Activar portal · InmobilIA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-slate-50 flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl ring-1 ring-slate-200 p-8">
        <div class="text-center mb-6">
            <div class="inline-flex h-14 w-14 rounded-2xl bg-blue-100 items-center justify-center mb-4 text-2xl"></div>
            <h1 class="text-2xl font-bold tracking-tight">Bienvenido al Portal</h1>
            <p class="text-sm text-slate-500 mt-1">Crea tu contraseña para empezar</p>
        </div>

        <div th:if="${error}" class="rounded-lg bg-red-50 border border-red-200 p-3 mb-4 text-sm text-red-800" th:text="${error}">error</div>

        <form action="/portal/activar" method="post" th:if="${token}" class="space-y-4">
            <input type="hidden" name="token" th:value="${token}">
            <div>
                <label class="block text-sm font-medium mb-1.5">Tu email</label>
                <input type="email" th:value="${email}" disabled class="w-full px-3 py-2.5 text-sm bg-slate-100 border border-slate-200 rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1.5">Crea tu contraseña</label>
                <input type="password" name="password" required minlength="10" maxlength="72" placeholder="Mínimo 10 caracteres" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15">
            </div>
            <button type="submit" class="w-full px-4 py-2.5 rounded-lg bg-blue-800 hover:bg-blue-900 text-white text-sm font-semibold">
                Activar mi portal
            </button>
        </form>
    </div>
</body>
</html>
