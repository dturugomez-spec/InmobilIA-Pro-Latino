<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Open House</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-xl bg-gradient-to-br from-purple-600 to-pink-800 p-6 mb-5 text-white">
        <div class="flex items-start justify-between flex-wrap gap-3">
            <div>
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="party-popper" class="h-6 w-6"></i> Open House · Jornadas puertas abiertas
                </h2>
                <p class="text-sm text-white/80 mt-1">Eventos públicos con registro online y captura de leads automática.</p>
            </div>
            <a href="/open-house/nuevo" class="px-4 py-2 rounded-lg bg-white text-pink-900 text-sm font-medium">+ Nuevo evento</a>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div th:each="oh : ${openHouses}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 overflow-hidden hover:shadow-lg transition">
            <div class="h-32 bg-gradient-to-br from-purple-400 to-pink-500 flex items-center justify-center text-white text-4xl"></div>
            <div class="p-4">
                <p class="font-bold text-sm" th:text="${oh.get('titulo')}">—</p>
                <p class="text-xs text-slate-500 mt-1" th:text="${oh.get('propiedad') != null ? oh.get('propiedad').get('direccion') : ''}">—</p>
                <p class="text-xs font-mono mt-2" th:text="${oh.get('fecha') + ' · ' + #strings.substring(oh.get('hora_inicio'),0,5) + '-' + #strings.substring(oh.get('hora_fin'),0,5)}">—</p>

                <div class="flex items-center justify-between mt-3 text-xs">
                    <span class="text-emerald-700"> <span th:text="${oh.get('asistentes_count') ?: 0}">0</span> registrados</span>
                    <span th:switch="${oh.get('estado')}">
                        <span th:case="'programado'" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">Programado</span>
                        <span th:case="'finalizado'" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-200 text-slate-600">Finalizado</span>
                    </span>
                </div>

                <div class="mt-3 pt-3 border-t border-slate-100 dark:border-neutral-800">
                    <p class="text-[10px] text-slate-500 mb-1">URL pública:</p>
                    <input type="text" readonly th:value="${baseUrl + '/open-house/publico/' + oh.get('pagina_publica_token')}" class="w-full px-2 py-1 text-[10px] font-mono border border-slate-200 rounded">
                </div>
            </div>
        </div>
        <div th:if="${openHouses.isEmpty()}" class="md:col-span-3 py-12 text-center text-slate-500 text-sm">Sin Open Houses programados.</div>
    </div>

</div>
</body>
</html>
