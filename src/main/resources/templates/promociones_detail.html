<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Detalle promoción</title></head>
<body><div layout:fragment="content">
<a href="/promociones" class="text-xs text-slate-500 mb-3 inline-block">← Promociones</a>
<div class="rounded-xl bg-gradient-to-br from-orange-700 to-amber-900 p-6 mb-5 text-white">
    <h2 class="text-2xl font-bold" th:text="${promo.get('nombre')}">—</h2>
    <p class="text-sm text-white/80 mt-1" th:text="${promo.get('municipio') + ' · ' + promo.get('fase')}">—</p>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
    <form method="post" th:action="@{|/promociones/${promo.get('id')}/unidad/crear|}" class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 p-5 space-y-2">
        <h3 class="font-semibold text-sm">+ Añadir unidad</h3>
        <div class="grid grid-cols-3 gap-2">
            <input type="text" name="bloque" placeholder="Bloque" class="px-2 py-1.5 text-xs border rounded">
            <input type="number" name="planta" placeholder="Piso (nivel)" class="px-2 py-1.5 text-xs border rounded">
            <input type="text" name="letra" placeholder="Letra" class="px-2 py-1.5 text-xs border rounded">
        </div>
        <select name="tipologia" class="w-full px-3 py-2 text-sm border rounded">
            <option value="1d">1 dorm</option><option value="2d">2 dorm</option>
            <option value="3d">3 dorm</option><option value="4d">4 dorm</option>
            <option value="atico">Penthouse</option><option value="duplex">Dúplex</option>
        </select>
        <div class="grid grid-cols-2 gap-2">
            <input type="number" name="num_habitaciones" placeholder="Hab" class="px-2 py-1.5 text-xs border rounded">
            <input type="number" name="num_banos" placeholder="Baños" class="px-2 py-1.5 text-xs border rounded">
            <input type="number" step="0.1" name="superficie_util" placeholder="m² útil" class="px-2 py-1.5 text-xs border rounded">
            <input type="text" name="orientacion" placeholder="Orientación" class="px-2 py-1.5 text-xs border rounded">
        </div>
        <input type="number" step="0.01" name="precio" required placeholder="Precio $" class="w-full px-3 py-2 text-sm border rounded">
        <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="plaza_garaje"> Plaza garaje</label>
        <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="trastero"> Bodega</label>
        <button class="w-full px-3 py-1.5 rounded bg-amber-700 text-white text-sm">+ Crear</button>
    </form>

    <div class="lg:col-span-2 rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 dark:bg-neutral-800/50">
            <tr class="text-[10px] uppercase text-slate-500">
                <th class="text-left px-3 py-2">Ubic.</th><th class="text-left px-3 py-2">Tipo</th>
                <th class="text-center px-3 py-2">Hab/Baños</th><th class="text-right px-3 py-2">m²</th>
                <th class="text-right px-3 py-2">Precio</th><th class="text-left px-3 py-2">Estado</th>
            </tr></thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="u : ${unidades}">
                <td class="px-3 py-2 font-mono text-xs" th:text="${u.get('bloque') + '-' + u.get('planta') + u.get('letra')}">—</td>
                <td class="px-3 py-2 text-xs" th:text="${u.get('tipologia')}">—</td>
                <td class="px-3 py-2 text-center text-xs" th:text="${u.get('num_habitaciones') + '/' + u.get('num_banos')}">—</td>
                <td class="px-3 py-2 text-right text-xs" th:text="${u.get('superficie_util') + ' m²'}">—</td>
                <td class="px-3 py-2 text-right font-mono font-bold" th:text="${#numbers.formatDecimal(u.get('precio') ?: 0, 1, 'DEFAULT', 0, 'DEFAULT') + ' ' + mon}">—</td>
                <td class="px-3 py-2">
                    <span th:if="${u.get('estado') == 'disponible'}" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Libre</span>
                    <span th:if="${u.get('estado') == 'reservada'}" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">Reservada</span>
                    <span th:if="${u.get('estado') == 'vendida'}" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700">Vendida</span>
                </td>
            </tr>
            <tr th:if="${unidades.isEmpty()}"><td colspan="6" class="py-6 text-center text-slate-400 text-xs">Sin unidades aún</td></tr>
            </tbody>
        </table>
    </div>
</div>
</div></body></html>
