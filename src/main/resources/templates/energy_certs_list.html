<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Certificados energéticos</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-xl bg-gradient-to-br from-green-600 to-emerald-900 p-6 mb-5 text-white">
        <div class="flex items-start justify-between flex-wrap gap-3">
            <div>
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="leaf" class="h-6 w-6"></i> Certificados energéticos (CEE)
                </h2>
                <p class="text-sm text-white/80 mt-1">Gestión y control de caducidad según RD 390/2021.</p>
            </div>
            <a href="/cee/nuevo" class="px-4 py-2 rounded-lg bg-white text-emerald-900 hover:bg-white/90 text-sm font-medium">
                <i data-lucide="plus" class="h-4 w-4 inline-block"></i> Nuevo CEE
            </a>
        </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <div class="rounded-xl bg-emerald-50 ring-1 ring-emerald-200 p-4">
            <p class="text-[10px] uppercase text-emerald-700">Vigentes</p>
            <p class="text-xl font-bold mt-1 text-emerald-700" th:text="${vigentes}">0</p>
        </div>
        <div class="rounded-xl bg-amber-50 ring-1 ring-amber-200 p-4">
            <p class="text-[10px] uppercase text-amber-700">Vencen en 90d</p>
            <p class="text-xl font-bold mt-1 text-amber-700" th:text="${porVencer}">0</p>
        </div>
        <div class="rounded-xl bg-red-50 ring-1 ring-red-200 p-4">
            <p class="text-[10px] uppercase text-red-700">Caducados</p>
            <p class="text-xl font-bold mt-1 text-red-700" th:text="${caducados}">0</p>
        </div>
        <div class="rounded-xl bg-slate-50 ring-1 ring-slate-200 p-4">
            <p class="text-[10px] uppercase text-slate-700">Sin CEE</p>
            <p class="text-xl font-bold mt-1 text-slate-700" th:text="${sinCee}">0</p>
        </div>
    </div>

    <div class="rounded-xl bg-white dark:bg-neutral-900 ring-1 ring-slate-200 dark:ring-neutral-800 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 dark:bg-neutral-800/50">
                <tr class="text-[10px] uppercase text-slate-500">
                    <th class="text-left px-4 py-3">Propiedad</th>
                    <th class="text-left px-4 py-3">Nº registro</th>
                    <th class="text-center px-4 py-3">Consumo</th>
                    <th class="text-center px-4 py-3">Emisiones</th>
                    <th class="text-left px-4 py-3">Caducidad</th>
                    <th class="text-left px-4 py-3">Estado</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-neutral-800">
                <tr th:each="c : ${certificados}" class="hover:bg-slate-50 dark:hover:bg-neutral-800/40">
                    <td class="px-4 py-3 text-xs" th:text="${c.get('propiedad') != null ? c.get('propiedad').get('direccion') : '—'}">—</td>
                    <td class="px-4 py-3 font-mono text-xs" th:text="${c.get('numero_registro')}">—</td>
                    <td class="px-4 py-3 text-center">
                        <span class="inline-flex items-center justify-center w-8 h-8 rounded font-bold text-white text-sm"
                              th:text="${c.get('calificacion_consumo')}"
                              th:style="|background-color: ${c.get('calificacion_consumo') == 'A' ? '#00a651' : (c.get('calificacion_consumo') == 'B' ? '#50b748' : (c.get('calificacion_consumo') == 'C' ? '#bfd730' : (c.get('calificacion_consumo') == 'D' ? '#fff200' : (c.get('calificacion_consumo') == 'E' ? '#fdb913' : (c.get('calificacion_consumo') == 'F' ? '#ef7c00' : '#e30613')))))}">—</span>
                    </td>
                    <td class="px-4 py-3 text-center">
                        <span class="inline-flex items-center justify-center w-8 h-8 rounded font-bold text-white text-sm"
                              th:text="${c.get('calificacion_emisiones')}"
                              th:style="|background-color: ${c.get('calificacion_emisiones') == 'A' ? '#00a651' : (c.get('calificacion_emisiones') == 'B' ? '#50b748' : (c.get('calificacion_emisiones') == 'C' ? '#bfd730' : (c.get('calificacion_emisiones') == 'D' ? '#fff200' : (c.get('calificacion_emisiones') == 'E' ? '#fdb913' : (c.get('calificacion_emisiones') == 'F' ? '#ef7c00' : '#e30613')))))}">—</span>
                    </td>
                    <td class="px-4 py-3 font-mono text-xs" th:text="${c.get('fecha_caducidad')}">—</td>
                    <td class="px-4 py-3">
                        <span th:switch="${c.get('estado')}">
                            <span th:case="'vigente'" class="inline-flex text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Vigente</span>
                            <span th:case="'caducado'" class="inline-flex text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700">Caducado</span>
                            <span th:case="'en_renovacion'" class="inline-flex text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">Renovando</span>
                        </span>
                    </td>
                </tr>
                <tr th:if="${certificados.isEmpty()}"><td colspan="6" class="py-12 text-center text-slate-500 text-sm">Sin certificados aún.</td></tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
