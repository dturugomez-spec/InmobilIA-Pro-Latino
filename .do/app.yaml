# ═══════════════════════════════════════════════════════════════════
#  DigitalOcean App Platform · InmobilIA Pro
#  Conectar repo GitHub → DO lee este archivo automáticamente.
#  Los secretos (SUPABASE_URL, SMTP_PASS, etc.) se rellenan en el panel.
# ═══════════════════════════════════════════════════════════════════
name: inmobilia-pro
region: fra   # Frankfurt: más cerca de España
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: danituru/InmobilIA-Pro
      branch: main
      deploy_on_push: true
    instance_size_slug: basic-xs    # 1 GB RAM / 1 vCPU (~12$/mes)
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /healthz
      initial_delay_seconds: 90
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 10
    envs:
      - key: PORT
        value: "8080"
      - key: TZ
        value: Europe/Madrid
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # ─── Secretos: rellenar en el panel de DigitalOcean ───
      - key: SUPABASE_URL
        type: SECRET
      - key: SUPABASE_SERVICE_KEY
        type: SECRET
      - key: SMTP_HOST
        type: SECRET
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        type: SECRET
      - key: SMTP_PASS
        type: SECRET
      - key: SMTP_FROM_NAME
        value: InmobilIA Pro
      - key: SMTP_FROM_EMAIL
        type: SECRET
      - key: ADMIN_EMAILS
        type: SECRET
      - key: BASE_URL
        type: SECRET
      - key: APP_BASE_URL
        type: SECRET
      - key: OPENAI_API_KEY
        type: SECRET
