## ═══════════════════════════════════════════════════════════════
##  Render Blueprint · InmobilIA Pro
##
##  Como usar (gratis):
##   1. Sube este repo a GitHub
##   2. Entra en https://dashboard.render.com  ->  New +  ->  Blueprint
##   3. Conecta tu repo y Render lee este archivo automaticamente
##   4. Anade tus secretos (SUPABASE_URL, SUPABASE_KEY, etc.) en el panel
##
##  Plan free: 750 horas/mes, sleep tras 15 min sin trafico, 512 MB RAM.
##  El SW + un cron externo (uptimerobot.com) mantienen la app despierta.
## ═══════════════════════════════════════════════════════════════
services:
  - type: web
    name: inmobilia-pro
    runtime: docker
    plan: free
    region: frankfurt   # mas cerca de Espana que oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: native
      - key: TZ
        value: Europe/Madrid
      # Secretos: rellenar en el panel de Render (Environment)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OPENAI_API_KEY_PLATFORM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: APP_BASE_URL
        sync: false
